name: Simulation and rendering fast-path A-B

# Focused deterministic parity/performance gate. Host us is not DS hardware FPS.
on:
  push:
    branches: [main]
    paths:
      - "core/mx.c"
      - "ds/source/main.c"
      - "ds/source/gfx.c"
      - "test/bench.c"
      - "test/wob_state_digest.c"
      - "test/wob_joint_threshold_test.c"
      - "test/ds_render.c"
      - "test/rot_sprite_parity_test.c"
      - ".github/workflows/sim-render-fastpath.yml"
  workflow_dispatch:

concurrency:
  group: sim-render-fastpath-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Compare fracture decisions at every material and damage threshold
        run: |
          set -eu
          for mode in float fixed; do
            flags=""
            if [ "$mode" = fixed ]; then flags="-DMX_FIXED"; fi
            gcc -std=gnu99 -O2 -Wall -Wno-unused-function $flags -Icore test/wob_joint_threshold_test.c -lm -o /tmp/wob_joint_threshold
            /tmp/wob_joint_threshold
          done
      - name: Compile original and optimized simulation paths for fixed/float
        run: |
          for mode in float fixed; do
            defs=""
            test "$mode" = fixed && defs="-DMX_FIXED"
            for variant in before after; do
              ref=""
              test "$variant" = before && ref="-DMX_WOB_JOINT_EARLY_REJECT=0 -DMX_WOB_JOINT_MASK=0 -DMX_LORD_AI_DIST_CULL=0 -DMX_LORD_RUBBLE_AABB=0 -DMX_LORD_DANGER_SPATIAL_FIRST=0"
              gcc -std=gnu99 -O2 $defs $ref -Icore core/mx.c test/wob_state_digest.c -lm -o /tmp/sim_${mode}_${variant}_digest
              gcc -std=gnu99 -O2 $defs $ref -Icore core/mx.c test/bench.c -lm -o /tmp/sim_${mode}_${variant}_bench
            done
          done
      - name: Verify exact whole-world state over all 660 levels x 360 frames, both modes
        run: |
          for mode in float fixed; do
            /tmp/sim_${mode}_before_digest > /tmp/world-${mode}-before
            /tmp/sim_${mode}_after_digest > /tmp/world-${mode}-after
            diff -u /tmp/world-${mode}-before /tmp/world-${mode}-after
            echo "$mode world parity: $(cat /tmp/world-${mode}-after)"
          done
      - name: Alternate reference/optimized runs and report median simulation CPU
        run: |
          python3 - <<'PY'
          import re,subprocess,statistics
          for mode in ('fixed','float'):
            times={'before':[],'after':[]}
            for turn in range(4):
              for variant in (('before','after') if turn%2==0 else ('after','before')):
                s=subprocess.check_output([f'/tmp/sim_{mode}_{variant}_bench','--quiet','360'],text=True)
                m=re.search(r'TOTAL ([0-9.]+) ms.*checksum (\d+)',s)
                assert m,s
                times[variant].append((float(m.group(1)),m.group(2)))
            a=statistics.median(t for t,c in times['before'])
            b=statistics.median(t for t,c in times['after'])
            assert {c for v in times.values() for t,c in v}.__len__()==1, 'simulation changed!'
            print(f'SIM_AB mode={mode} reference_ms={a:.2f} optimized_ms={b:.2f} improvement_pct={(a-b)*100/a:.2f}')
          PY

      - name: Isolate conservative fracture rejection and compare complete simulation state
        run: |
          set -eu
          for mode in float fixed; do
            flags=""
            if [ "$mode" = fixed ]; then flags="-DMX_FIXED"; fi
            for variant in 0 1; do
              gcc -std=gnu99 -O2 $flags -DMX_WOB_JOINT_EARLY_REJECT=$variant -Icore core/mx.c test/wob_state_digest.c -lm -o "/tmp/joint_${mode}_${variant}_digest"
              gcc -std=gnu99 -O2 $flags -DMX_WOB_JOINT_EARLY_REJECT=$variant -Icore core/mx.c test/bench.c -lm -o "/tmp/joint_${mode}_${variant}_bench"
              "/tmp/joint_${mode}_${variant}_digest" > "/tmp/joint_${mode}_${variant}.txt"
            done
            diff -u "/tmp/joint_${mode}_0.txt" "/tmp/joint_${mode}_1.txt"
            cat "/tmp/joint_${mode}_1.txt"
          done
          python3 - <<'PY'
          import re,statistics,subprocess
          for mode in ('fixed','float'):
            timings={0:[],1:[]};hashes=set()
            for turn in range(3):
              for variant in ((0,1) if turn%2==0 else (1,0)):
                line=subprocess.check_output([f'/tmp/joint_{mode}_{variant}_bench','--quiet','360'],text=True)
                m=re.search(r'TOTAL ([0-9.]+) ms.*checksum (\d+)',line)
                assert m,line
                timings[variant].append(float(m.group(1)))
                hashes.add(m.group(2))
            assert len(hashes)==1,(mode,hashes)
            a,b=map(statistics.median,(timings[0],timings[1]))
            print(f'WOB_JOINT_AB mode={mode} reference_ms={a:.2f} optimized_ms={b:.2f} gain_pct={(a-b)*100/a:.2f} [host only]')
          PY

      - name: Isolate rubble AABB cost and prove exact contact-physics state parity
        run: |
          for mode in fixed float; do
            defs=""
            test "$mode" = fixed && defs="-DMX_FIXED"
            for aabb in 0 1; do
              gcc -std=gnu99 -O2 $defs -DMX_LORD_RUBBLE_AABB=$aabb -Icore                 core/mx.c test/wob_state_digest.c -lm -o /tmp/rubble_${mode}_${aabb}_digest
              gcc -std=gnu99 -O2 $defs -DMX_LORD_RUBBLE_AABB=$aabb -Icore                 core/mx.c test/bench.c -lm -o /tmp/rubble_${mode}_${aabb}_bench
            done
            /tmp/rubble_${mode}_0_digest > /tmp/rubble_${mode}_off.txt
            /tmp/rubble_${mode}_1_digest > /tmp/rubble_${mode}_on.txt
            diff -u /tmp/rubble_${mode}_off.txt /tmp/rubble_${mode}_on.txt
          done
          python3 - <<'PY'
          import re,subprocess,statistics
          for mode in ('fixed','float'):
            tt={0:[],1:[]}
            hashes=set()
            for round in range(5):
              for aabb in ((0,1) if round%2==0 else (1,0)):
                s=subprocess.check_output([f'/tmp/rubble_{mode}_{aabb}_bench','--quiet','360'],text=True)
                m=re.search(r'TOTAL ([0-9.]+) ms.*checksum (\d+)',s)
                assert m,s
                tt[aabb].append(float(m.group(1)))
                hashes.add(m.group(2))
            assert len(hashes)==1, (mode,hashes)
            off=statistics.median(tt[0]);on=statistics.median(tt[1])
            print(f'RUBBLE_AABB_AB mode={mode} off_ms={off:.2f} on_ms={on:.2f} improvement_pct={(off-on)*100/off:.2f} [host only]')
          PY

      - name: Isolate landlord debris-danger spatial rejection (float/fixed)
        run: |
          for mode in fixed float; do
            defs=""
            test "$mode" = fixed && defs="-DMX_FIXED"
            for ordering in 0 1; do
              gcc -std=gnu99 -O2 $defs -DMX_LORD_DANGER_SPATIAL_FIRST=$ordering -Icore core/mx.c test/wob_state_digest.c -lm -o /tmp/lord_danger_${mode}_${ordering}_digest
              gcc -std=gnu99 -O2 $defs -DMX_LORD_DANGER_SPATIAL_FIRST=$ordering -Icore core/mx.c test/bench.c -lm -o /tmp/lord_danger_${mode}_${ordering}_bench
            done
            /tmp/lord_danger_${mode}_0_digest > /tmp/lord_danger_${mode}_off.txt
            /tmp/lord_danger_${mode}_1_digest > /tmp/lord_danger_${mode}_on.txt
            diff -u /tmp/lord_danger_${mode}_off.txt /tmp/lord_danger_${mode}_on.txt
          done
          python3 - <<'PY'
          import re,statistics,subprocess
          for mode in ('fixed','float'):
            times={0:[],1:[]};hashes=set()
            for turn in range(4):
              for enabled in ((0,1) if turn%2==0 else (1,0)):
                result=subprocess.check_output([f'/tmp/lord_danger_{mode}_{enabled}_bench','--quiet','360'],text=True)
                m=re.search(r'TOTAL ([0-9.]+) ms.*checksum (\d+)',result)
                assert m,result
                times[enabled].append(float(m.group(1)))
                hashes.add(m.group(2))
            assert len(hashes)==1,(mode,hashes)
            old=statistics.median(times[0]);new=statistics.median(times[1])
            print(f'LANDLORD_DANGER_AB mode={mode} old_ms={old:.2f} new_ms={new:.2f} improvement_pct={(old-new)*100/old:.2f} [host only]')
          PY

  ds-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Build real DS main-loop harness with reference and optimized render flags
        run: |
          for variant in before after; do
            defs=""
            test "$variant" = before && defs="-DMX_DS_DAMAGE_THRESH=0 -DMX_DS_VOXEL_EMPTY4=0 -DMX_DS_ELLIPSE_SYMMETRY=0 -DMX_DS_ROT_INCREMENTAL=0 -DMX_WOB_JOINT_EARLY_REJECT=0 -DMX_WOB_JOINT_MASK=0 -DMX_LORD_AI_DIST_CULL=0 -DMX_LORD_RUBBLE_AABB=0 -DMX_LORD_DANGER_SPATIAL_FIRST=0"
            gcc -std=gnu99 -O2 -Wno-unused-function -DMX_FIXED -DMX_DS_PROFILE_HOST $defs \
              -Itest/stubs -Icore -Iart -Ids/source \
              test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c \
              core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_${variant}
          done
      - name: Check ellipse silhouettes against original clipped integer reference
        run: |
          for variant in before after; do
            flags=""
            test "$variant" = before && flags="-DMX_DS_ELLIPSE_SYMMETRY=0"
            gcc -std=gnu99 -O2 -DMX_FIXED $flags -Itest/stubs -Icore -Ids/source -Iart \
              test/gfx_clip_test.c ds/source/gfx.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/gfx_ellipse_${variant}
            /tmp/gfx_ellipse_${variant}
          done
      - name: Prove 3100 rotated sprite frames are byte-identical for no-jiggle and deformed poses
        run: |
          for clip in 0 1; do
            for variant in before after; do
              flag=1
              test "$variant" = before && flag=0
              gcc -std=gnu99 -O2 -DMX_FIXED -DMX_DS_CLIP_ROT=$clip -DMX_DS_ROT_INCREMENTAL=$flag \
                -Itest/stubs -Icore -Iart -Ids/source \
                test/rot_sprite_parity_test.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mandex_rot_$variant
              /tmp/mandex_rot_$variant > /tmp/mandex_rot_$variant.txt
            done
            diff -u /tmp/mandex_rot_before.txt /tmp/mandex_rot_after.txt
            echo "Clipping mode $clip: $(cat /tmp/mandex_rot_after.txt)"
          done
      - name: Compare framebuffer hashes and report host draw/physics cost
        run: |
          mkdir -p out/sim-render-fastpath
          for level in 0 9 39 59; do
            for variant in before after; do
              DS_PERF_BENCH=1 /tmp/ds_${variant} /tmp/ds-${variant} 520 "$level" > out/sim-render-fastpath/${variant}-${level}.txt
            done
          done
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('out/sim-render-fastpath')
          for level in (0,9,39,59):
            a=(root/f'before-{level}.txt').read_text()
            b=(root/f'after-{level}.txt').read_text()
            p=r'DS_FRAME_HASH checksum=([0-9a-f]+) screen_samples=(\d+)'
            ha=re.search(p,a);hb=re.search(p,b)
            if not ha or not hb or ha.groups()!=hb.groups():
              raise SystemExit(f'framebuffer mismatch level {level+1}: {ha and ha.groups()} vs {hb and hb.groups()}')
            def get(s,rx):
              m=re.search(rx,s)
              if not m:raise SystemExit(f'profile metric not found: {rx}')
              return float(m.group(1))
            x=get(a,r'cpu_frame_mean_us=([0-9.]+)')
            y=get(b,r'cpu_frame_mean_us=([0-9.]+)')
            td=r'DS_PHASE phase=top_draw mean_us=([0-9.]+)'
            t0=get(a,td);t1=get(b,td)
            ph=r'DS_PHASE phase=physics mean_us=([0-9.]+)'
            p0=get(a,ph);p1=get(b,ph)
            print(f'DS_AB level={level+1} pixels=IDENTICAL old_frame_us={x:.2f} new_frame_us={y:.2f} total_gain_pct={(x-y)*100/x:.2f} old_top_us={t0:.2f} new_top_us={t1:.2f} old_physics_us={p0:.2f} new_physics_us={p1:.2f}')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-render-fastpath-host-metrics
          path: out/sim-render-fastpath/*.txt
          if-no-files-found: ignore

name: Build Nintendo DS

# NOTE: ds/Makefile had never been run when this workflow was added (no devkitPro was available to the author), so the
# first run may show real compile or link problems.  Fix those, they are what the workflow is for.
on:
  push:
    branches: [main]
    paths: ["ds/**", "core/**", "art/**", ".github/workflows/build-ds.yml"]
  pull_request:
    paths: ["ds/**", "core/**", "art/**", ".github/workflows/build-ds.yml"]
  workflow_dispatch:

jobs:
  ds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO DEVKITARM=$DEVKITARM"
          export PATH=$DEVKITARM/bin:$PATH
          arm-none-eabi-gcc --version | head -1
          ls $DEVKITPRO/calico/lib $DEVKITPRO/libnds/lib 2>&1 | head -20
          for f in $(find $DEVKITPRO/libnds $DEVKITPRO/calico $DEVKITARM -name '*.a' -o -name '*.o' | head -200); do
            arm-none-eabi-nm -A $f 2>/dev/null | grep -E "(initSystem|__libnds_mpu_setup|__dsimode|__secure_area__|__libnds_exit)$"
          done | head -30
          ls $DEVKITARM/arm-none-eabi/lib | head -40
          ls $DEVKITPRO/calico/share 2>&1 | head; ls $DEVKITPRO/libnds/include | head -5
      - name: Build mandex.nds
        run: make -C ds
      - uses: actions/upload-artifact@v4
        with:
          name: mandex-nds
          path: ds/mandex.nds
          if-no-files-found: error

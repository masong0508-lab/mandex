name: DS inline wallpaper A-B

# Inlined 2px/4px wallpaper pixels vs original per-tile gfx_wall calls, identical all other
# switches. x86 host microseconds do NOT predict DS or DeSmuME FPS.
on:
  push:
    branches: [main]
    paths:
      - "ds/source/**"
      - "core/**"
      - "test/ds_render.c"
      - ".github/workflows/ds-inline-wall-ab.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Compile identical old/new wallpaper paths for DS host profiling
        run: |
          for fast in 0 1; do
            gcc -std=gnu99 -O2 -Wno-unused-function -DMX_FIXED \
              -DMX_DS_PROFILE_HOST -DMX_DS_WALL_DIRECT_RUNS=0 -DMX_DS_FACADE_CACHE=0 -DMX_DS_WALL_INLINED=$fast \
              -Itest/stubs -Icore -Iart -Ids/source \
              test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c \
              core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_inline_$fast
          done
      - name: Check all three Landlord HQ districts with the inlined wallpaper path
        run: |
          DS_FACADE_DISTRICT_PROBE=1 /tmp/ds_inline_0 > /tmp/ds_inline_ref.txt
          DS_FACADE_DISTRICT_PROBE=1 /tmp/ds_inline_1 > /tmp/ds_inline_opt.txt
          diff -u /tmp/ds_inline_ref.txt /tmp/ds_inline_opt.txt
          cat /tmp/ds_inline_opt.txt
      - name: Check identical pixels and four paired measurements in eight heavy levels
        run: |
          mkdir -p out/ds-inline-ab
          python3 - <<'PY'
          import os,re,subprocess,statistics,pathlib
          levels=(0,9,21,29,39,40,50,59)
          lines=['level reference_median_us inline_median_us relative_gain_pct pixel_identical']
          for l in levels:
              results={0:[],1:[]}
              # Reversing evaluation order reduces warm-up and cache bias.
              for rep in range(4):
                  hashes={}
                  for mode in ((0,1) if rep%2==0 else (1,0)):
                      env=dict(os.environ,DS_PERF_BENCH='1')
                      p=subprocess.run([f'/tmp/ds_inline_{mode}',f'/tmp/ds_inline_{mode}_out','520',str(l)],
                           capture_output=True,text=True,check=True,env=env)
                      hashline=re.search(r'^DS_FRAME_HASH .*$',p.stdout,re.M)
                      timing=re.search(r'cpu_frame_mean_us=([0-9.]+)',p.stdout)
                      if not hashline or not timing:raise SystemExit('No DS profile for level '+str(l+1))
                      hashes[mode]=hashline.group()
                      results[mode].append(float(timing.group(1)))
                  if hashes[0]!=hashes[1]:
                      raise SystemExit('PIXEL REGRESSION in level '+str(l+1))
              ref=statistics.median(results[0]);new=statistics.median(results[1])
              gain=100*(ref-new)/ref
              lines.append(f'{l+1} {ref:.2f} {new:.2f} {gain:+.2f}% YES')
              print(f'Level {l+1:02}: old {ref:.2f}us, inline {new:.2f}us, delta {gain:+.2f}% — pixel identical')
          pathlib.Path('out/ds-inline-ab/paired-host-report.txt').write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: mandex-ds-inline-wall-ab-host
          path: out/ds-inline-ab/paired-host-report.txt

name: DS emulated FPS capture

# DeSmuME emulation is not physical DS FPS. Isolate TWO changes:
#   wob_ref:  former neighbor-loop solver, original wallpaper tiles
#   wall_ref: unrolled neighbors, original wallpaper tiles
#   wall_fast:unrolled neighbors, pixel-identical inlined 2/4px tile renderer
#   full_fast:reference neighbor loop + inlined wallpaper (possible sweet spot)
# All variants use identical audio and screen redraw policy (30Hz bottom).
# These are snapshots, not same-simulation-state repeated FPS averages.
on:
  push:
    branches: [main]
    paths: ["ds/**", "core/**", ".github/workflows/ds-emulator-fps.yml"]
  workflow_dispatch:

# Only the newest commit should occupy heavy build/emulator resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-roms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build test-only auto-start diagnostic ROMs
        run: |
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          mkdir -p out
          for V in "0:suburb" "39:landlord_hq" "59:alpha_landlord"; do
            L=${V%%:*}; N=${V#*:}
            for MODE in wob_ref wall_ref wall_fast full_fast; do
              DEF="-DMX_WOB_UNROLL_NB=1 -DMX_DS_WALL_DIRECT_RUNS=0 -DMX_DS_WALL_INLINED=0"
              [ "$MODE" = wob_ref ] && DEF="-DMX_WOB_UNROLL_NB=0 -DMX_DS_WALL_DIRECT_RUNS=0 -DMX_DS_WALL_INLINED=0"
              [ "$MODE" = wall_fast ] && DEF="-DMX_WOB_UNROLL_NB=1 -DMX_DS_WALL_DIRECT_RUNS=0 -DMX_DS_WALL_INLINED=1"
              [ "$MODE" = full_fast ] && DEF="-DMX_WOB_UNROLL_NB=0 -DMX_DS_WALL_DIRECT_RUNS=0 -DMX_DS_WALL_INLINED=1"
              sh tools/build_ds_bare.sh "out/$N-$MODE.nds" -DMX_FPS_DEMO_LEVEL=$L -DMX_NOSOUND $DEF
              python3 tools/ntr_patch.py "out/$N-$MODE.nds" "out/$N-$MODE.tmp.nds"
              mv "out/$N-$MODE.tmp.nds" "out/$N-$MODE.nds"
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mandex-ds-fps-autoboot-roms
          path: out/*.nds
          retention-days: 7

  emulator:
    needs: probe-roms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with: {name: mandex-ds-fps-autoboot-roms, path: out}
      - name: Run DeSmuME and capture HUD FPS/SIM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desmume xvfb imagemagick x11-utils >/dev/null
          mkdir -p captures
          export LIBGL_ALWAYS_SOFTWARE=1
          for N in suburb landlord_hq alpha_landlord; do
            for MODE in wob_ref wall_ref wall_fast full_fast; do
              export ROM="$PWD/out/$N-$MODE.nds" LEVEL="$N-$MODE"
              xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
                desmume-cli --disable-sound "$ROM" > "captures/$LEVEL.log" 2>&1 &
                P=$!
                sleep 5
                import -window root "captures/$LEVEL-first.png" 2>/dev/null || true
                sleep 8
                import -window root "captures/$LEVEL-last.png" 2>/dev/null || true
                kill $P 2>/dev/null || true
              '
            done
          done
          ls -lh captures/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mandex-ds-emulator-fps-screenshots
          path: captures/*
          retention-days: 7
          if-no-files-found: ignore

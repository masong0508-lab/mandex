name: Gameplay art and animation gates
on:
  push:
    branches: [main]
    paths:
      - "art/manspr.h"
      - "tools/gen_manspr.py"
      - "web/index.html"
      - "ds/source/main.c"
      - "ds/source/intro.c"
      - "ds/source/gfx.c"
      - "3ds/main.c"
      - "dreamcast/main.c"
      - "test/sprite_surface_test.py"
      - "test/room_facade_web_test.js"
      - "test/landlord_motion_regression.c"
      - "test/landlord_motion_regression.py"
      - "test/ds_render.c"
      - ".github/workflows/gameplay-art-gates.yml"
  workflow_dispatch:
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Sprite geometry, material shading, zero-heap and gait invariants
        run: python3 test/sprite_surface_test.py
      - name: Landlord art animation and zero-frame-allocation invariants
        run: |
          python3 test/landlord_motion_regression.py
          gcc -std=gnu99 -O2 -DMX_FIXED -Itest/stubs -Icore -Ids/source -Iart \
            test/landlord_motion_regression.c ds/source/gfx.c \
            core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/landlord_motion_regression
          /tmp/landlord_motion_regression
      - name: Validate browser script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("web/index.html").read_text()
          a=src.rfind("<script>");b=src.rfind("</script>")
          assert a>=0 and b>a
          Path("/tmp/mandex-gameplay.js").write_text(src[a+8:b])
          PY
          node --check /tmp/mandex-gameplay.js
          node test/room_backdrop_web_test.js
          node test/room_facade_web_test.js
      - name: Render Nintendo DS gameplay and movement review screenshots
        run: |
          mkdir -p out/art-review
          gcc -std=gnu99 -O2 -DMX_FIXED -DMX_DS_PROFILE_HOST -Wno-unused-function \
            -Itest/stubs -Icore -Iart -Ids/source \
            test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c \
            core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mandex_art_review
          DS_PERF_BENCH=1 DS_ART_REVIEW=1 /tmp/mandex_art_review out/art-review/gameplay 520 0 > out/art-review/host-report.txt
          WALK_TEST=3 /tmp/mandex_art_review out/art-review/landlords 900 25 > out/art-review/landlords-report.txt
          find out/art-review -name '*.ppm' -print | head -24
          find out/art-review -name '*.ppm' -print0 | xargs -0 -r python3 tools/ppm_to_png.py
          test -n "$(find out/art-review -name '*.png' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: mandex-gameplay-art-review
          path: |
            out/art-review/*.png
            out/art-review/host-report.txt
            out/art-review/landlords-report.txt
          retention-days: 7
          if-no-files-found: error

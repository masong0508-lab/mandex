name: Cutscene gates

# Fast, independent sanity suite. The complete host sweep takes much longer;
# this detects new broken browser scripts and console framebuffer changes quickly.
on:
  push:
    branches: [main]
    paths:
      - "web/index.html"
      - "ds/source/**"
      - "test/gfx_clip_test.c"
      - "test/cutscene_guard_test.c"
      - "test/run_tests.sh"
      - "test/intro_shot.c"
      - "tools/ppm_to_png.py"
      - ".github/workflows/cutscene-gates.yml"
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Browser cutscene JavaScript parses
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const page = fs.readFileSync('web/index.html','utf8');
          const a = page.indexOf('<script>'), b = page.indexOf('</script>',a);
          if (a < 0 || b < a) throw Error('Game script not found');
          const source = page.slice(a + 8, b);
          new Function(source);
          for (const name of ['cgRearPanel','cgHotTake','cgMoonlitKiss','cutGraphicDirection']) {
            if (!source.includes('function '+name+'(')) throw Error(name+' missing');
          }
          console.log('Browser cutscene JavaScript syntax: OK');
          NODE
      - name: Pixel-perfect console drawing regressions
        run: |
          gcc -std=gnu99 -O2 -DMX_FIXED -Itest/stubs -Icore -Ids/source -Iart test/gfx_clip_test.c ds/source/gfx.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mandex_gfx_clip_test
          /tmp/mandex_gfx_clip_test
      - name: All shared story cutscenes and framebuffer canaries
        run: |
          gcc -std=gnu99 -O2 -DMX_FIXED -DMX_SHARED_CUTSCENE -Dgfx_init=ds_gfx_init -Idreamcast/shim -Itest/stubs -Icore -Iart -Ids/source test/cutscene_guard_test.c ds/source/gfx.c ds/source/intro.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mandex_cutscene_guard_test
          /tmp/mandex_cutscene_guard_test
      - name: Render cutscene art review contact sheets
        run: |
          mkdir -p out/cutscene-storyboards
          gcc -std=gnu99 -O2 -DMX_FIXED -DMX_SHARED_CUTSCENE -Dgfx_init=ds_gfx_init -Idreamcast/shim -Itest/stubs -Icore -Iart -Ids/source test/intro_shot.c ds/source/gfx.c ds/source/intro.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mandex_intro_shot
          /tmp/mandex_intro_shot out/cutscene-storyboards/01_origin_apartment.ppm 0 3 12 122 262
          /tmp/mandex_intro_shot out/cutscene-storyboards/02_origin_landlord.ppm 0 4 12 109 256
          /tmp/mandex_intro_shot out/cutscene-storyboards/03_wolf_rear_view.ppm 1 4 12 105 205
          /tmp/mandex_intro_shot out/cutscene-storyboards/04_wolf_flirt.ppm 1 6 12 153 315
          /tmp/mandex_intro_shot out/cutscene-storyboards/05_chapter_one_victory.ppm 2 1 12 148 270
          /tmp/mandex_intro_shot out/cutscene-storyboards/06_chapter_two_victory.ppm 3 2 12 155 290
          python3 tools/ppm_to_png.py out/cutscene-storyboards/*.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: mandex-cutscene-storyboards
          path: out/cutscene-storyboards/*.png
          retention-days: 7
          if-no-files-found: error

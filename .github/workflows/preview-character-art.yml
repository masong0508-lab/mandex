name: Preview Mandex character atlases (PR)

# Generate the real DS/3DS pixel frames and Dreamcast PVR artwork on a PR,
# WITHOUT pushing generated bytes or granting source-write permissions.
on:
  pull_request:
    paths:
      - "web/index.html"
      - "test/head_turnaround_test.py"
      - "test/character_turnaround_test.py"
      - "test/dreamcast_wolf_atlas_test.py"
      - "art/manspr.h"
      - "art/dcart.h"
      - "tools/manhead.py"
      - "tools/gen_manspr.py"
      - "tools/gen_dc_art.py"
      - "tools/turn_hair_finish.py"
      - "tools/sprite_pinhole_cleanup.py"
      - "tools/wolf_upper_volume.py"
      - "tools/hd_wolf_finish.py"
      - "test/sprite_volume_continuity_test.py"
      - "test/hd_wolf_volume_test.py"
      - "test/turnaround_preview_palette_test.py"
      - "test/sprite_turn_anchor_test.py"
      - "tools/render_turnaround_sheet.py"
      - ".github/workflows/preview-character-art.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mandex-art-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install offline art pipeline
        run: |
          python -m pip install --disable-pip-version-check "numpy<3" pillow playwright
          python -m playwright install --with-deps chromium
      - name: Regenerate the real 142-frame indexed and two HD texture atlases
        run: |
          set -eu
          python3 tools/gen_manspr.py > /tmp/mandex-indexed-rebake.log
          python3 tools/gen_dc_art.py > /tmp/mandex-hd-rebake.log
          grep -q 'MS_CANONICAL_TURN_BAKE 1' art/manspr.h
          grep -q 'shared human rectangles: 0' /tmp/mandex-hd-rebake.log
          test -s art/manspr.h
          test -s art/dcart.h
          test -s docs/man_sprites.png
          test -s docs/dc_art_sheet.png
          tail -n 8 /tmp/mandex-indexed-rebake.log
          tail -n 8 /tmp/mandex-hd-rebake.log
      - name: Check geometry, human/Wolfman identity, mask and texture surface
        run: |
          set -eu
          python3 test/head_turnaround_test.py
          python3 test/character_turnaround_test.py
          python3 test/dreamcast_wolf_atlas_test.py
          python3 test/sprite_surface_test.py
          python3 test/sprite_volume_continuity_test.py
          python3 test/hd_wolf_volume_test.py
          python3 test/turnaround_preview_palette_test.py
          python3 test/sprite_turn_anchor_test.py
          python3 tools/turn_hair_finish.py --check
          python3 tools/sprite_pinhole_cleanup.py --check
          python3 tools/wolf_upper_volume.py --check
          git diff --check
      - name: Render pivot-aligned actual sprite turnaround for human and Wolfman
        run: |
          set -eu
          mkdir -p docs/art-review
          python3 tools/render_turnaround_sheet.py docs/art-review/turnaround.ppm
          python3 tools/ppm_to_png.py docs/art-review/turnaround.ppm
          test -s docs/art-review/turnaround.png
          test -s docs/art-review/turnaround.txt
      - name: Upload reviewable artwork (never push to main from a PR)
        uses: actions/upload-artifact@v4
        with:
          name: mandex-pr-character-sprite-review
          path: |
            art/manspr.h
            art/dcart.h
            docs/man_sprites.png
            docs/dc_art_sheet.png
            docs/art-review/turnaround.png
            docs/art-review/turnaround.txt
          if-no-files-found: error
          retention-days: 14

name: DS rectangle stroke width A-B
on:
  push:
    branches: [main]
    paths:
      - "ds/source/gfx.c"
      - ".github/workflows/ds-rect-width.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile old/new DS renderer with width selection hoisted
        run: |
          for MODE in 0 1; do
            gcc -std=gnu99 -O1 -Wno-unused-function -DMX_FIXED -DMX_DS_PROFILE_HOST \
              -DMX_DS_RECT_WIDTH_HOIST=$MODE -Itest/stubs -Icore -Iart -Ids/source \
              test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c \
              core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mandex-rect-$MODE
          done
      - name: Run DS clipped-primitive parity regression
        run: |
          gcc -std=gnu99 -O2 -DMX_FIXED -Itest/stubs -Icore -Ids/source -Iart \
            test/gfx_clip_test.c ds/source/gfx.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mandex-clip
          /tmp/mandex-clip
      - name: Compare all 60 levels for frame hashes and matched CPU times
        run: |
          mkdir -p /tmp/mandex-rect-results
          for LEVEL in $(seq 0 59); do
            for MODE in 0 1; do
              DS_PERF_BENCH=1 /tmp/mandex-rect-$MODE /tmp/rect-$LEVEL-$MODE 300 "$LEVEL" > "/tmp/mandex-rect-results/$LEVEL-$MODE.txt"
            done
          done
          python3 - <<'PY'
          import pathlib,re,statistics
          results=[]
          for level in range(60):
              a=pathlib.Path(f'/tmp/mandex-rect-results/{level}-0.txt').read_text()
              b=pathlib.Path(f'/tmp/mandex-rect-results/{level}-1.txt').read_text()
              pat=r'DS_FRAME_HASH checksum=([0-9a-f]+) screen_samples=(\d+)'
              ha=re.search(pat,a);hb=re.search(pat,b)
              assert ha and hb and ha.groups()==hb.groups(),f'PIXEL REGRESSION level={level+1}'
              def val(s,p):return float(re.search(p,s).group(1))
              old=val(a,r'cpu_frame_mean_us=([0-9.]+)')
              new=val(b,r'cpu_frame_mean_us=([0-9.]+)')
              results.append((level+1,old,new,(old-new)*100/old))
          for lvl,old,new,pct in results:
              if lvl in (1,10,22,30,40,41,51,60):
                  print(f'level={lvl} pixels=EQUAL old_us={old:.1f} new_us={new:.1f} host_gain={pct:.1f}%')
          print('all_level_hashes=PASS 60/60')
          print(f'median_host_change={statistics.median(x[3] for x in results):.1f}%')
          print(f'levels_faster={sum(x[3]>0 for x in results)}/60')
          PY

name: DS fast stability regressions

# Small independent gate for the DS renderer, audio command queue and
# walking-animation math. Full cross-platform host tests take longer and are
# frequently superseded during rapid optimization commits.
on:
  push:
    branches: [main]
    paths:
      - "ds/source/**"
      - "ds/bare/**"
      - "core/**"
      - "art/**"
      - "test/landlord_motion_regression.py"
      - "test/event_overflow_test.c"
      - "test/ds_render.c"
      - "test/ds_sound_queue_test.c"
      - "test/sfx_catchup_test.c"
      - "test/music_clock_test.c"
      - "test/gfx_clip_test.c"
      - ".github/workflows/ds-fast-stability.yml"
  workflow_dispatch:

jobs:
  ds-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate landlord art and travel-based gait
        run: python3 test/landlord_motion_regression.py
      - name: Shared C event overflow and objective signal retention - float and fixed
        run: |
          set -eu
          for mode in float fixed; do
            flags=""
            if test "$mode" = fixed; then flags="-DMX_FIXED"; fi
            gcc -std=gnu99 -O2 -Wno-unused-function $flags -Icore \
              test/event_overflow_test.c -lm -o /tmp/mx_event_overflow_$mode
            /tmp/mx_event_overflow_$mode
          done
      - name: Audio queue, missed-VBlank effects and tempo
        run: |
          set -eu
          cd test
          gcc -std=gnu99 -O2 -Wno-pointer-to-int-cast -I../ds/bare ds_sound_queue_test.c -o /tmp/mx_ds_sound_queue
          /tmp/mx_ds_sound_queue
          gcc -std=gnu99 -O2 -Istubs -I../ds/source sfx_catchup_test.c -o /tmp/mx_ds_effects
          /tmp/mx_ds_effects
          gcc -std=gnu99 -O2 -Istubs -I../ds/source music_clock_test.c -o /tmp/mx_ds_music
          /tmp/mx_ds_music
      - name: Exact DS graphics clipping, animation phase and particle lifetimes
        run: |
          set -eu
          cd test
          gcc -std=gnu99 -O2 -DMX_FIXED -Istubs -I../core -I../ds/source -I../art \
            gfx_clip_test.c ../ds/source/gfx.c ../core/mx.c ../core/mx_meta.c ../core/cloth.c -lm -o /tmp/mx_ds_gfx_clip
          /tmp/mx_ds_gfx_clip
          gcc -std=gnu99 -O1 -Wno-unused-function -DMX_FIXED \
            -Istubs -I../core -I../art -I../ds/source \
            ds_render.c ../ds/source/gfx.c ../ds/source/sfx.c ../ds/source/intro.c \
            ../core/mx.c ../core/mx_meta.c ../core/cloth.c -lm -o /tmp/mx_ds_quick_render
          DS_WALK_PHASE_PROBE=1 /tmp/mx_ds_quick_render
          DS_PARTICLE_PROBE=1 /tmp/mx_ds_quick_render
      - name: DS walking gameplay - Y punches without muting soundtrack, B and touch controls remain functional
        run: |
          set -eu
          cd test
          WALK_TEST=1 /tmp/mx_ds_quick_render /tmp/mx_walk_music 1400 22 > /tmp/mx_walk_music.log
          grep -q 'Y punches while on foot' /tmp/mx_walk_music.log
          grep -q 'Y punch does not toggle music preference' /tmp/mx_walk_music.log
          grep -q 'walk: all passed' /tmp/mx_walk_music.log
          tail -n 8 /tmp/mx_walk_music.log
      - name: Expanding rings and smoke - exact particle edge pixels against unculled reference
        run: |
          set -eu
          for mode in 0 1; do
            gcc -std=gnu99 -O1 -Wno-unused-function -DMX_FIXED \
              -DMX_DS_PARTICLE_VIEW_CULL=$mode \
              -Itest/stubs -Icore -Iart -Ids/source \
              test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c \
              core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mx_ds_particle_edge_$mode
            DS_PARTICLE_EDGE_PROBE=1 /tmp/mx_ds_particle_edge_$mode > /tmp/mx_ds_particle_edge_$mode.txt
          done
          diff -u /tmp/mx_ds_particle_edge_0.txt /tmp/mx_ds_particle_edge_1.txt
          cat /tmp/mx_ds_particle_edge_1.txt
      - name: Landlord visibility - full sprite bounds across 9,792 poses and screen edges
        run: |
          set -eu
          for mode in 0 1; do
            gcc -std=gnu99 -O1 -Wno-unused-function -DMX_FIXED -DMX_DS_PROFILE_HOST \
              -DMX_DS_CULL_TARGETS=$mode \
              -Itest/stubs -Icore -Iart -Ids/source \
              test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c \
              core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mx_ds_target_$mode
            DS_TARGET_CULL_PROBE=1 /tmp/mx_ds_target_$mode > /tmp/mx_ds_target_$mode.txt
          done
          diff -u /tmp/mx_ds_target_0.txt /tmp/mx_ds_target_1.txt
          cat /tmp/mx_ds_target_1.txt
          DS_PERF_BENCH=1 /tmp/mx_ds_target_0 /tmp/mx_target_ref 360 39 | grep '^DS_FRAME_HASH ' > /tmp/mx_target_hq_ref.txt
          DS_PERF_BENCH=1 /tmp/mx_ds_target_1 /tmp/mx_target_new 360 39 | grep '^DS_FRAME_HASH ' > /tmp/mx_target_hq_opt.txt
          diff -u /tmp/mx_target_hq_ref.txt /tmp/mx_target_hq_opt.txt
          echo "Landlord HQ sampled gameplay pixels match original painter"
      - name: Compare original and optimized window pixels at every district transition
        run: |
          set -eu
          gcc -std=gnu99 -O1 -Wno-unused-function -DMX_FIXED \
            -DMX_DS_FACADE_FAST_RECT=0 \
            -Itest/stubs -Icore -Iart -Ids/source \
            test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c \
            core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/mx_ds_window_reference
          DS_FACADE_DISTRICT_PROBE=1 /tmp/mx_ds_window_reference > /tmp/mx_ds_facade_ref.txt
          DS_FACADE_DISTRICT_PROBE=1 /tmp/mx_ds_quick_render > /tmp/mx_ds_facade_new.txt
          diff -u /tmp/mx_ds_facade_ref.txt /tmp/mx_ds_facade_new.txt
          cat /tmp/mx_ds_facade_new.txt

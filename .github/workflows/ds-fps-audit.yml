name: DS FPS bottleneck audit

# Host traces measure CPU phase cost, not actual ARM9 timings.
# For true hardware FPS/SPS use the ROM L overlay backed by ARM7 VBlank.
on:
  push:
    branches: [main]
    paths:
      - "ds/**"
      - "core/**"
      - "test/ds_render.c"
      - "test/gfx_opaque_test.c"
      - ".github/workflows/ds-fps-audit.yml"
  workflow_dispatch:

jobs:
  ds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile real DS game loop with host-only phase taps
        run: |
          gcc -std=gnu99 -O2 -Wno-unused-function -DMX_FIXED -DMX_DS_PROFILE_HOST -Itest/stubs -Icore -Iart -Ids/source test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_fps_bench
          gcc -std=gnu99 -O2 -Icore test/fps_meter_test.c -o /tmp/ds_fps_meter_test
          /tmp/ds_fps_meter_test
          gcc -std=gnu99 -O2 -Wno-unused-function -DMX_FIXED -DMX_DS_PROFILE_HOST -DMX_DS_WALL_RUNS=0 -Itest/stubs -Icore -Iart -Ids/source test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_fps_wall_before
          gcc -std=gnu99 -O2 -Wno-unused-function -DMX_FIXED -DMX_DS_PROFILE_HOST -DMX_DS_FAST_RECT=0 -Itest/stubs -Icore -Iart -Ids/source test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_fps_rect_before
          gcc -std=gnu99 -O2 -Wno-unused-function -DMX_FIXED -DMX_DS_PROFILE_HOST -DMX_DS_BOTTOM30=0 -Itest/stubs -Icore -Iart -Ids/source test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_fps_before
      - name: Prove optimized tiny tile copies are pixel-identical
        run: |
          gcc -std=gnu99 -O2 -DMX_FIXED -DMX_DS_FAST_TILES=0 -Itest/stubs -Icore -Iart -Ids/source test/gfx_opaque_test.c ds/source/gfx.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_tile_before
          gcc -std=gnu99 -O2 -DMX_FIXED -DMX_DS_FAST_TILES=1 -Itest/stubs -Icore -Iart -Ids/source test/gfx_opaque_test.c ds/source/gfx.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_tile_after
          /tmp/ds_tile_before > /tmp/ds_tiles_reference.txt
          /tmp/ds_tile_after > /tmp/ds_tiles_optimized.txt
          diff -u /tmp/ds_tiles_reference.txt /tmp/ds_tiles_optimized.txt
          cat /tmp/ds_tiles_optimized.txt
      - name: Measure simulation, upper/lower rendering and presentation for eight levels
        run: |
          mkdir -p out/ds-fps-phases
          for L in 0 9 21 29 39 40 50 59; do
            DS_PERF_BENCH=1 /tmp/ds_fps_wall_before /tmp/mandex-wall-before 520 "$L" > "out/ds-fps-phases/wall-before-level-$L.txt"
            DS_PERF_BENCH=1 /tmp/ds_fps_rect_before /tmp/mandex-rect-before 520 "$L" > "out/ds-fps-phases/rect-before-level-$L.txt"
            DS_PERF_BENCH=1 /tmp/ds_fps_before /tmp/mandex-before 520 "$L" > "out/ds-fps-phases/baseline-level-$L.txt"
            DS_PERF_BENCH=1 /tmp/ds_fps_bench /tmp/mandex-fps 520 "$L" > "out/ds-fps-phases/level-$L.txt"
            grep -E '^(DS_HOST_PROFILE|DS_PHASE|DS_TOP_LAYER)' "out/ds-fps-phases/level-$L.txt"
          done
      - name: Compare actual host CPU frame costs (same job, both variants)
        run: |
          python3 - <<'PY'
          import glob,re,pathlib
          output=[]
          for fn in sorted(glob.glob('out/ds-fps-phases/level-*.txt')):
            level=pathlib.Path(fn).stem.split('-')[1]
            a=pathlib.Path('out/ds-fps-phases/baseline-level-'+level+'.txt').read_text()
            b=pathlib.Path(fn).read_text()
            pattern=r'cpu_frame_mean_us=([0-9.]+)'
            x=float(re.search(pattern,a).group(1));y=float(re.search(pattern,b).group(1))
            speedup=(x-y)/x*100 if x else 0
            output.append((int(level)+1,x,y,speedup))
          hdr='Level | Baseline host us/frame | 30 Hz lower-screen host us/frame | CPU reduction'
          print(hdr)
          for level,x,y,pct in output:print(f'{level:>5} | {x:>22.1f} | {y:>32.1f} | {pct:>12.1f}%')
          pathlib.Path('out/ds-fps-phases/summary.txt').write_text(
            hdr+'\n'+'\n'.join(f'{level} {x:.1f} {y:.1f} {pct:.1f}%' for level,x,y,pct in output)+'\n')
          PY
      - name: Compare exact two-screen gameplay frames and wall batching CPU cost
        run: |
          python3 - <<'PY'
          import re,pathlib
          rows=['level frame_hash wall_old_us wall_new_us relative_pct wall_layer_old_us wall_layer_new_us']
          for L in (0,9,21,29,39,40,50,59):
            before=pathlib.Path(f'out/ds-fps-phases/wall-before-level-{L}.txt').read_text()
            after=pathlib.Path(f'out/ds-fps-phases/level-{L}.txt').read_text()
            hash_p=r'DS_FRAME_HASH checksum=([0-9a-f]+) screen_samples=(\d+)'
            a=re.search(hash_p,before);b=re.search(hash_p,after)
            if not a or not b or a.groups()!=b.groups():
              raise SystemExit(f'PIXEL MISMATCH on level {L+1}: {a.groups() if a else None} != {b.groups() if b else None}')
            def val(s,pattern):return float(re.search(pattern,s).group(1))
            tot_p=r'cpu_frame_mean_us=([0-9.]+)'
            wall_p=r'DS_TOP_LAYER name=wallpaper_facades mean_us=([0-9.]+)'
            old=val(before,tot_p);new=val(after,tot_p)
            lo=val(before,wall_p);ln=val(after,wall_p)
            row=f'{L+1} {a.group(1)} {old:.2f} {new:.2f} {100*(old-new)/old:.1f}% {lo:.2f} {ln:.2f}'
            print(row);rows.append(row)
          pathlib.Path('out/ds-fps-phases/wall-batching-summary.txt').write_text('\n'.join(rows)+'\n')
          PY
      - name: Show matched before/after tiny-rectangle timings (host only)
        run: |
          python3 - <<'PY'
          import pathlib,re
          lines=['level rect_old_us rect_new_us change_pct top_layer_old_us top_layer_new_us']
          for L in (0,9,21,29,39,40,50,59):
            a=pathlib.Path(f'out/ds-fps-phases/rect-before-level-{L}.txt').read_text()
            b=pathlib.Path(f'out/ds-fps-phases/level-{L}.txt').read_text()
            def val(s,expr):return float(re.search(expr,s).group(1))
            old=val(a,r'cpu_frame_mean_us=([0-9.]+)')
            new=val(b,r'cpu_frame_mean_us=([0-9.]+)')
            layer=r'DS_TOP_LAYER name=wallpaper_facades mean_us=([0-9.]+)'
            lo=val(a,layer);ln=val(b,layer)
            line=f'{L+1} {old:.2f} {new:.2f} {100*(old-new)/old:.1f}% {lo:.2f} {ln:.2f}'
            print(line);lines.append(line)
          pathlib.Path('out/ds-fps-phases/rect-ab-summary.txt').write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mandex-ds-bottleneck-host-phase-times
          path: out/ds-fps-phases/*.txt
          retention-days: 7
          if-no-files-found: error

name: ROMs

# Builds both ports and packs them into ONE zip (artifact "mandex-roms" on the run; nothing is published anywhere else):
#   mandex.nds  - Nintendo DS, hardware build: own crt0 + ARM7, no libnds/calico (ds/bare)
#   mandex.cdi  - Sega Dreamcast disc image (Flycast / redream / burn or SD-card loaders)
#   mandex.elf  - the same Dreamcast program as a bare ELF (dev loaders only; emulators want the .cdi)
# DS startup has a bounded readiness wait, then three nonblank captures must
# show changing client pixels before packaging. This is not gameplay or hardware FPS validation.
on:
  push:
    branches: [main]
    paths: ["ds/**", "dreamcast/**", "3ds/**", "web/**", "core/**", "art/**", "tools/pack_cel_atlas.py", "tools/gen_manspr.py", "tools/gen_dc_art.py", "test/native_atlas_selection_test.c", "test/ch2_test.c", "test/save_test.c", "test/vmu_save_test.c", "test/native_trial_pack_test.c", "test/browser_walk_jump_forgiveness_test.js", "test/browser_creator_codec_test.js", "tools/validate_ds_smoke.py", "tools/run_ds_smoke.py", "test/ds_smoke_test.py", ".github/workflows/roms.yml"]
  pull_request:
    branches: [main]
    paths: ["ds/**", "dreamcast/**", "3ds/**", "web/**", "core/**", "art/**", "tools/pack_cel_atlas.py", "tools/gen_manspr.py", "tools/gen_dc_art.py", "test/native_atlas_selection_test.c", "test/ch2_test.c", "test/save_test.c", "test/vmu_save_test.c", "test/native_trial_pack_test.c", "test/browser_walk_jump_forgiveness_test.js", "test/browser_creator_codec_test.js", "tools/validate_ds_smoke.py", "tools/run_ds_smoke.py", "test/ds_smoke_test.py", ".github/workflows/roms.yml"]
  workflow_dispatch:

# Only the newest commit should occupy heavy build/emulator resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify campaign geometry, walking and legacy saves before packaging
        shell: bash
        run: |
          set -euo pipefail
          for mode in float fixed; do
            flags=()
            if [ "$mode" = fixed ]; then flags+=(-DMX_FIXED); fi
            gcc -std=gnu99 -O2 -Wno-unused-function -DMX_LEVEL_LOCKS "${flags[@]}" -Icore test/native_trial_pack_test.c core/mx_meta.c -lm -o /tmp/trial_pack
            /tmp/trial_pack
            for probe in ch2_test save_test vmu_save_test; do
              gcc -std=gnu99 -O2 -Wno-unused-function "${flags[@]}" -Icore core/mx.c core/mx_meta.c "test/$probe.c" -lm -o "/tmp/$probe"
              "/tmp/$probe"
            done
          done
          node test/browser_walk_jump_forgiveness_test.js
          node test/browser_creator_codec_test.js

  cel-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Bake character artwork from the real Golden Cels web rig
        env:
          MX_CEL_PREVIEW_DIR: ${{ runner.temp }}/mandex-cel-runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy<3" pillow playwright
          python -m playwright install --with-deps chromium
          python3 tools/gen_manspr.py
          python3 tools/gen_dc_art.py
          python3 tools/pack_cel_atlas.py "$MX_CEL_PREVIEW_DIR" art
          gcc -std=c99 -O1 -Wall -Iart test/native_atlas_selection_test.c -o /tmp/atlas
          /tmp/atlas
          git diff --exit-code -- art/manspr.h art/dcart.h docs/man_sprites.png docs/dc_art_sheet.png
      - name: Exercise live style switching on the three production native renderers
        run: |
          set -euo pipefail
          gcc -std=gnu99 -O1 -Wno-unused-function -DMX_FIXED -Itest/stubs -Icore -Iart -Ids/source test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_cel
          DS_CEL_PROBE=1 /tmp/ds_cel
          for f in gfx intro; do
            gcc -std=gnu99 -O1 -DMX_FIXED -D__3DS__ -I3ds/shim -Itest/stubs -Icore -Iart -Ids/source -c "ds/source/$f.c" -o "/tmp/n3d_$f.o"
            gcc -std=gnu99 -O1 -DMX_FIXED -DMX_SHARED_CUTSCENE -Dgfx_init=ds_gfx_init -Idreamcast/shim -Itest/stubs -Icore -Iart -Ids/source -c "ds/source/$f.c" -o "/tmp/dc_$f.o"
          done
          gcc -std=gnu99 -O1 -D__3DS__ -I3ds/shim -Itest/stubs -Icore -Iart -Ids/source test/n3ds_render.c /tmp/n3d_gfx.o /tmp/n3d_intro.o core/mx.c core/mx_meta.c core/cloth.c core/mx_snd.c -lm -o /tmp/n3d_cel
          N3DS_CEL_PROBE=1 /tmp/n3d_cel
          gcc -std=gnu99 -O1 -Idreamcast/shim -Itest/stubs -Icore -Iart -Ids/source /tmp/dc_gfx.o /tmp/dc_intro.o core/mx.c core/mx_meta.c core/cloth.c core/mx_snd.c test/dc_render.c -lm -o /tmp/dc_cel
          DC_OUTFIT_RECOLOR_PROBE=1 /tmp/dc_cel
      - uses: actions/upload-artifact@v7
        with:
          name: mandex-native-cel-runtime
          path: |
            art/manspr_cel.h
            art/dcart_cel.h
          if-no-files-found: error

  ds:
    needs: cel-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { name: mandex-native-cel-runtime, path: art }
      - run: test -s art/manspr_cel.h && make -C ds
      - name: Build the DS ROMs (hardware / bare-metal runtime, ds/bare)
        run: |
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          mkdir -p out
          # name | extra defines.  mandex = the game; the others are for finding where start-up stops: each paints both screens one colour and halts.
          for v in "stage0_red_crt|-DMX_CRT_STAGE=1" "mandex|" "mandex_nosound|-DMX_NOSOUND" "stage1_red|-DMX_NOSOUND -DMX_STAGE=1" "stage2_green|-DMX_NOSOUND -DMX_STAGE=2" "stage4_yellow|-DMX_NOSOUND -DMX_STAGE=4"; do
            n=${v%%|*}; d=${v#*|}
            sh tools/build_ds_bare.sh ds/$n.nds $d
            python3 tools/ntr_patch.py ds/$n.nds out/$n.nds
          done
          python3 - <<'PY'
          import struct
          for n in ("stage0_red_crt", "mandex"):
              d = open("out/%s.nds" % n, "rb").read()
              print(n, "ARM9 @0x4000:", d[0x4000:0x4008].hex(), " @0x4800 (entry):", d[0x4800:0x4810].hex())
          PY
          ndstool -i out/mandex.nds | grep -iE "unit|ARM9 (offset|entry|RAM|code)|ARM7 (offset|entry|RAM|code)|Logo CRC|Header CRC"
      - uses: actions/upload-artifact@v7
        with:
          name: rom-nds
          path: out/*.nds
          if-no-files-found: error

  dreamcast:
    needs: cel-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: kazade/dreamcast-sdk:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { name: mandex-native-cel-runtime, path: art }
      - name: Validate both character atlases before Dreamcast ROM build
        run: |
          set -eu
          test -s art/dcart_cel.h
          grep -q '^#define DCT_MAN_W 1024' art/dcart.h
          grep -q '^#define DCT_MAN_H 512' art/dcart.h
          grep -q '^#define DCT_WMAN_W 1024' art/dcart.h
          grep -q '^#define DCT_WMAN_H 512' art/dcart.h
          grep -q '^#define DCM_NFR 142' art/dcart.h
          grep -q '^#define MSF_NBASE 71' art/manspr.h
          echo "PASS: human + Wolfman have separate 1MB PVR atlases, 142 frame records"
      - name: Build
        shell: bash
        run: |
          ENV_SH=""
          for f in /opt/toolchains/dc/kos/environ.sh /usr/local/kos/environ.sh /opt/kos/environ.sh; do [ -f "$f" ] && ENV_SH="$f" && break; done || true
          [ -n "$ENV_SH" ] || { echo "no KallistiOS environ.sh found"; exit 1; }
          source "$ENV_SH"
          make -C dreamcast
          cd dreamcast
          # -N: no data track padding (the default pads the .cdi out to ~740 MB just to optimise loading speed; the game is ~5 MB)
          mkdcdisc -N -e mandex.elf -o mandex.cdi -n MANDEX 2>&1 | tail -20
          ls -la mandex.elf mandex.cdi
      - uses: actions/upload-artifact@v7
        with:
          name: rom-dreamcast
          path: |
            dreamcast/mandex.elf
            dreamcast/mandex.cdi
          if-no-files-found: error

  smoke-ds:
    needs: ds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify boot capture and readiness rejection cases
        run: python3 test/ds_smoke_test.py
      - uses: actions/download-artifact@v8
        with: { name: rom-nds }
      - name: Check bounded DS startup and title animation in DeSmuME
        run: |
          set -euo pipefail
          mkdir -p ds-smoke
          touch ds-smoke/desmume.log
          sudo apt-get update -qq
          sudo apt-get install -y -qq desmume xvfb imagemagick x11-utils >/dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 90s xvfb-run -a -s "-screen 0 1024x768x24" \
            python3 tools/run_ds_smoke.py --rom mandex.nds --out-dir ds-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-ds-shots
          path: ds-smoke/
          if-no-files-found: warn

  package:
    needs: [ds, dreamcast, n3ds, smoke-ds, gameplay-gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate latest canonical head-turn sprites and all 71 Wolfman atlas frames
        run: |
          set -eu
          python3 test/character_turnaround_test.py
          python3 test/head_turnaround_test.py
          python3 test/dreamcast_wolf_atlas_test.py
      - uses: actions/download-artifact@v8
        with: { name: rom-nds, path: pack }
      - uses: actions/download-artifact@v8
        with: { name: rom-dreamcast, path: pack }
      - uses: actions/download-artifact@v8
        with: { name: mandex-3ds, path: pack/3ds }
      - name: Zip all console builds and standalone browser game
        shell: bash
        run: |
          set -euo pipefail
          cp web/index.html pack/mandex.html
          cd pack && ls -la && ls -la 3ds
          printf 'MANDEX ALL-PORT BUILDS (commit %s, hardware FPS not verified)\n\nPLAYABLE FILES:\n  mandex.nds             Nintendo DS: DraStic / melonDS / DeSmuME / flashcart\n  mandex_nosound.nds     Nintendo DS: same game with sound disabled\n  mandex.cdi             Dreamcast disc image: Flycast / redream\n  3ds/mandex.3dsx        Nintendo 3DS homebrew launcher (not a .3ds cartridge ROM)\n  mandex.html            Browser: open directly as a local standalone web page\n\nDEVELOPER / DIAGNOSTIC FILES:\n  mandex.elf             Dreamcast developer loader\n  3ds/mandex.elf         3DS developer binary\n  stage0_red_crt.nds     Early-boot diagnostic ROM\n  stage1_red.nds         Early-boot diagnostic ROM\n  stage2_green.nds       Early-boot diagnostic ROM\n  stage4_yellow.nds      Early-boot diagnostic ROM\n\nConsole binaries are automated builds, not guaranteed hardware-validated.\n' "${{ github.sha }}" > README.txt
          files=(mandex.nds mandex_nosound.nds stage0_red_crt.nds stage1_red.nds stage2_green.nds stage4_yellow.nds mandex.cdi mandex.elf 3ds/mandex.3dsx 3ds/mandex.elf mandex.html README.txt)
          for f in "${files[@]}"; do test -s "$f"; done
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          zip -9 ../mandex-roms.zip "${files[@]}" SHA256SUMS
          unzip -tq ../mandex-roms.zip
      - uses: actions/upload-artifact@v7
        with: { name: mandex-roms, path: mandex-roms.zip, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: mandex-web, path: pack/mandex.html, if-no-files-found: error }

  n3ds:
    needs: cel-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { name: mandex-native-cel-runtime, path: art }
      - name: Build the 3DS homebrew (libctru, software rendering)
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITARM=${DEVKITARM:-$DEVKITPRO/devkitARM}
          [ -f "$DEVKITPRO/libctru/include/3ds.h" ] || dkp-pacman -S --noconfirm 3ds-dev
          test -s art/manspr_cel.h
          make -C 3ds
          mkdir -p out3ds && cp 3ds/mandex.3dsx 3ds/mandex.elf out3ds/
      - uses: actions/upload-artifact@v7
        with:
          name: mandex-3ds
          path: out3ds/*
          if-no-files-found: error

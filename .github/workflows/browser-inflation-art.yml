name: Browser inflation animation art
on:
  pull_request:
    paths: ['web/index.html','test/browser_inflation_visual_test.py','.github/workflows/browser-inflation-art.yml']
  push:
    paths: ['web/index.html','test/browser_inflation_visual_test.py','.github/workflows/browser-inflation-art.yml']
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python test/browser_inflation_visual_test.py

name: Build Dreamcast (experimental)

# NOTE: dreamcast/Makefile had never been run when this workflow was added, and the KallistiOS image below is a
# community image whose layout was not checked.  The step that sources KOS searches for environ.sh; if your image keeps it
# somewhere unusual, change KOS_IMAGE or the search.  This job is allowed to fail so it never turns the repo red.
on:
  push:
    branches: [main]
    paths: ["dreamcast/**", "core/**", "art/**", ".github/workflows/build-dreamcast.yml"]
  workflow_dispatch:
    inputs:
      image:
        description: Docker image with a built KallistiOS toolchain
        default: kazade/dreamcast-sdk:latest

jobs:
  dreamcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    container: ${{ inputs.image || 'kazade/dreamcast-sdk:latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build mandex.elf
        shell: bash
        run: |
          # (the discovery must not abort the script: under -e -o pipefail a failing ls killed the first version of this step before make ever ran)
          ENV_SH=""
          for f in /opt/toolchains/dc/kos/environ.sh /usr/local/kos/environ.sh /opt/kos/environ.sh; do [ -f "$f" ] && ENV_SH="$f" && break; done || true
          if [ -z "$ENV_SH" ]; then ENV_SH="$(find / -name environ.sh -path '*kos*' 2>/dev/null | head -1 || true)"; fi
          echo "using '$ENV_SH'"
          [ -n "$ENV_SH" ] || { echo "no KallistiOS environ.sh found in this image"; ls /opt /usr/local 2>&1 | head -30; exit 1; }
          source "$ENV_SH"
          echo "KOS_BASE=$KOS_BASE KOS_CC_BASE=$KOS_CC_BASE"
          make -C dreamcast
          ls -la dreamcast/mandex.elf
          echo "--- tools available for making a bootable disc"
          for t in mkdcdisc mkisofs genisoimage xorriso scramble makeip elf2bin cdi4dc kos-objcopy sh-elf-objcopy; do echo "$t: $(command -v $t || echo -)"; done
          ls $KOS_BASE/utils 2>&1 | head -40
          ls $KOS_BASE/utils/scramble $KOS_BASE/utils/makeip $KOS_BASE/utils/bin2c 2>&1 | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: mandex-elf
          path: dreamcast/mandex.elf
          if-no-files-found: error

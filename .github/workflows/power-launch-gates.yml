name: Power-up inventory and launch safety gates
on:
  pull_request:
    paths:
      - "core/mx.c"
      - "core/mx.h"
      - "core/mx_tool_feedback.h"
      - "test/tool_feedback_test.c"
      - ".github/workflows/power-launch-gates.yml"
  push:
    branches: [main]
    paths:
      - "core/mx.c"
      - "core/mx.h"
      - "core/mx_tool_feedback.h"
      - "test/tool_feedback_test.c"
      - ".github/workflows/power-launch-gates.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [float, fixed]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise real selected-power launches
        run: |
          FLAGS=""
          if [ "${{ matrix.mode }}" = "fixed" ]; then FLAGS="-DMX_FIXED"; fi
          gcc -std=gnu99 -O1 -g -Wall -Wno-unused-function $FLAGS -Icore \
            test/tool_feedback_test.c core/mx.c core/cloth.c -lm \
            -o /tmp/mandex-power-integrity
          /tmp/mandex-power-integrity
      - name: Undefined-behavior sanitizer and boundary regressions
        run: |
          FLAGS=""
          if [ "${{ matrix.mode }}" = "fixed" ]; then FLAGS="-DMX_FIXED"; fi
          gcc -std=gnu99 -O1 -g -fno-omit-frame-pointer -fsanitize=undefined \
            -fno-sanitize-recover=undefined -Wno-unused-function $FLAGS -Icore \
            test/tool_feedback_test.c core/mx.c core/cloth.c -lm \
            -o /tmp/mandex-power-integrity-ubsan
          /tmp/mandex-power-integrity-ubsan

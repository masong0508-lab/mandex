name: Browser custom-level world width regression
on:
  pull_request:
    paths:
      - "web/index.html"
      - "test/browser_custom_level_width_test.js"
      - ".github/workflows/browser-custom-level-width.yml"
  push:
    branches: [main]
    paths:
      - "web/index.html"
      - "test/browser_custom_level_width_test.js"
      - ".github/workflows/browser-custom-level-width.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  custom-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise wide-finale transition into a 120-column custom level
        run: node test/browser_custom_level_width_test.js
      - name: Creator code compatibility and fixed-grid validation
        run: node test/browser_creator_codec_test.js
      - name: Portrait and landscape editor regression
        run: node test/browser_orientation_test.js

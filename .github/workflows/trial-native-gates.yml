name: Trial expansion and native animation gates
on:
  pull_request:
    paths:
      - "core/**"
      - "test/native_*_test.c"
      - "test/vmu_save_test.c"
      - "test/save_test.c"
      - ".github/workflows/trial-native-gates.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "test/native_*_test.c"
      - "test/vmu_save_test.c"
      - "test/save_test.c"
      - ".github/workflows/trial-native-gates.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [float, fixed]
    steps:
      - uses: actions/checkout@v4
      - name: Run focused native integration tests
        shell: bash
        run: |
          set -euo pipefail
          flags=(-std=gnu99 -O2 -Wall -Icore -DMX_LEVEL_LOCKS)
          if [ "${{ matrix.mode }}" = fixed ]; then flags+=(-DMX_FIXED); fi
          gcc "${flags[@]}" -Wno-unused-function test/native_trial_pack_test.c core/mx_meta.c -lm -o /tmp/trials
          /tmp/trials
          gcc "${flags[@]}" test/native_options_test.c core/mx_meta.c -lm -o /tmp/options
          /tmp/options
          gcc "${flags[@]}" -Wno-unused-function test/walk_jump_forgiveness_test.c -lm -o /tmp/walk
          /tmp/walk
          gcc "${flags[@]}" test/native_prop_animation_test.c core/mx.c -lm -o /tmp/props
          /tmp/props
          gcc "${flags[@]}" -Wno-unused-function test/native_dive_pose_test.c -lm -o /tmp/dive
          /tmp/dive
          gcc "${flags[@]}" test/save_test.c core/mx.c core/mx_meta.c -lm -o /tmp/save
          /tmp/save
          gcc "${flags[@]}" -Wno-unused-function test/vmu_save_test.c core/mx.c core/mx_meta.c -lm -o /tmp/vmu
          /tmp/vmu
          gcc "${flags[@]}" test/sweep.c core/mx.c -lm -o /tmp/replay
          /tmp/replay --replay

name: Host tests

# Builds the shared game core in float and fixed-point mode, the DS front-end against stub libnds, and the Dreamcast
# front-end against stub KOS, then runs the physics, robustness-sweep and idle-gag tests.  Needs only gcc.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the newest commit should occupy heavy build/emulator resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: gcc --version
      - name: Run host integration tests (exhaustive sweeps have their own matrix)
        env:
          MX_SWEEPS_IN_MATRIX: '1'
        run: sh test/run_tests.sh

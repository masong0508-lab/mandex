name: Host tests

# Builds the shared game core in float and fixed-point mode, the DS front-end against stub libnds, and the Dreamcast
# front-end against stub KOS, then runs the physics, robustness-sweep and idle-gag tests.  Needs only gcc.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: gcc --version
      - name: Run every host test
        run: sh test/run_tests.sh

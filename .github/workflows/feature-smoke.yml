name: Focused feature smoke tests
# Fast failure detection alongside the longer all-60-level renderer checks.
# Host parity and simulated storage are NOT console hardware FPS measurements.
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "ds/source/**"
      - "3ds/**"
      - "dreamcast/**"
      - "web/index.html"
      - "test/vmu_save_test.c"
      - "test/journal_test.c"
      - "test/collapse_survivor_web_test.js"
      - "test/rubble_broadphase_test.c"
      - "test/rubble_broadphase_web_test.js"
      - "test/chunk_contact_lifetime_test.c"
      - "test/browser_dead_rubble_test.js"
      - "test/browser_walk_camera_test.js"
      - "test/browser_rubble_draw_test.js"
      - "test/browser_flight_collision_fastpath_test.js"
      - "test/landlord_ai_web_test.js"
      - "test/collapse_survivor_test.c"
      - "test/bank_shot_test.c"
      - "test/landlord_shock_test.c"
      - "test/walk_turn_interrupt_test.c"
      - "test/combat_recovery_test.c"
      - "test/walk_pad_stomp_test.c"
      - "test/browser_combat_recovery_test.js"
      - "test/browser_pad_stomp_test.js"
      - "test/n3ds_render.c"
      - "test/n3ds_walk.c"
      - "test/dc_render.c"
      - ".github/workflows/feature-smoke.yml"
  workflow_dispatch:

# Only the newest commit should occupy heavy build/emulator resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify rare collapse survivor odds, HP loss and no-invulnerability in both modes
        run: |
          for mode in float fixed; do
            flags=""
            test "$mode" = fixed && flags="-DMX_FIXED"
            gcc -std=gnu99 -O2 -Wno-unused-function $flags -Icore test/collapse_survivor_test.c -lm -o /tmp/collapse_survivor_$mode
            /tmp/collapse_survivor_$mode
          done
      - name: Verify browser survivor logic and bat AI with actual production source
        run: |
          node test/collapse_survivor_web_test.js
          node test/landlord_ai_web_test.js
      - name: Keep walking countersteer continuous in both core numeric modes
        run: |
          for mode in float fixed; do
            flags=""
            if test "$mode" = fixed; then flags="-DMX_FIXED"; fi
            gcc -std=c99 -O2 -Wall $flags -Icore core/mx.c test/walk_turn_interrupt_test.c -lm -o /tmp/walk_turn_interrupt_$mode
            /tmp/walk_turn_interrupt_$mode
          done
      - name: Verify combat recovery and stomp-pad ascent in all numeric paths
        run: |
          for mode in float fixed; do
            flags=""
            if test "$mode" = fixed; then flags="-DMX_FIXED"; fi
            for probe in combat_recovery walk_pad_stomp; do
              gcc -std=gnu99 -O2 -Wno-unused-function $flags -Icore "test/${probe}_test.c" -lm -o "/tmp/${probe}_$mode"
              "/tmp/${probe}_$mode"
            done
          done
          node test/browser_combat_recovery_test.js
          node test/browser_pad_stomp_test.js
      - name: Require exact rubble collision behavior with fast rectangle rejection
        run: |
          for mode in float fixed; do
            flags=""
            test "$mode" = fixed && flags="-DMX_FIXED"
            gcc -std=gnu99 -O2 $flags -Icore test/rubble_broadphase_test.c -lm -o /tmp/rubble_broadphase_$mode
            /tmp/rubble_broadphase_$mode
          done
          node test/rubble_broadphase_web_test.js
          node test/browser_rubble_draw_test.js
          node test/browser_flight_collision_fastpath_test.js
      - name: Stop shattered fragments from contacting again within the solver step
        run: |
          for mode in float fixed; do
            flags=""
            if test "$mode" = fixed; then flags="-DMX_FIXED"; fi
            gcc -std=gnu99 -O2 -Wno-unused-function $flags -Icore test/chunk_contact_lifetime_test.c -lm -o /tmp/chunk_contact_lifetime_$mode
            /tmp/chunk_contact_lifetime_$mode
          done
          node test/browser_dead_rubble_test.js
      - name: Keep portrait walking focus bounded through movement and rotation
        run: node test/browser_walk_camera_test.js
      - name: Verify new rubber BANK SHOT bonus in both core numeric modes
        run: |
          for mode in float fixed; do
            flags=""
            test "$mode" = fixed && flags="-DMX_FIXED"
            gcc -std=gnu99 -O2 -Wno-unused-function $flags -Icore test/bank_shot_test.c -lm -o /tmp/bank_shot_$mode
            /tmp/bank_shot_$mode
          done
      - name: Test destructible back walls and room collapse across console/browser
        run: |
          for mode in float fixed; do
            flags=""
            if test "$mode" = fixed; then flags="-DMX_FIXED"; fi
            gcc -std=gnu99 -O2 -Wno-unused-function $flags -Icore test/room_backdrop_test.c -lm -o /tmp/room_backdrop_$mode
            /tmp/room_backdrop_$mode
          done
          node test/room_backdrop_web_test.js
      - name: Validate VMU crash recovery and shared progress journal in both numeric modes
        run: |
          cd test
          for mode in float fixed; do
            flags=""
            if test "$mode" = fixed; then flags="-DMX_FIXED"; fi
            gcc -std=gnu99 -O2 -Wall -Wno-unused-function $flags -I../core ../core/mx.c ../core/mx_meta.c vmu_save_test.c -lm -o /tmp/vmu_$mode
            /tmp/vmu_$mode
            gcc -std=gnu99 -O2 -Wall $flags -I../core ../core/mx.c ../core/mx_meta.c journal_test.c -lm -o /tmp/journal_$mode
            /tmp/journal_$mode
            gcc -std=gnu99 -O2 -Wno-unused-function $flags -I../core landlord_shock_test.c -lm -o /tmp/shock_$mode
            /tmp/shock_$mode
          done
      - name: Validate browser script and Eco FX controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('web/index.html').read_text()
          a=source.rfind('<script>'); b=source.rfind('</script>')
          assert a>=0 and b>a
          script=source[a+len('<script>'):b]
          assert 'webEcoFX' in script and "e.code==='F4'" in script
          assert 'function fxLimit()' in script
          Path('/tmp/mandex_game_smoke.js').write_text(script)
          PY
          node --check /tmp/mandex_game_smoke.js
      - name: Check representative DS frame hashes with old/new particle allocator
        run: |
          for fast in 0 1; do
            gcc -std=gnu99 -O2 -Wno-unused-function -DMX_FIXED -DMX_DS_PROFILE_HOST \
              -DMX_DS_AIM_CACHE=$fast -DMX_DS_PARTICLE_HINT=$fast -DMX_DS_WALL_DIRECT_RUNS=0 -DMX_DS_FACADE_CACHE=$fast -DMX_DS_WALL_INLINED=$fast \
              -Itest/stubs -Icore -Iart -Ids/source \
              test/ds_render.c ds/source/gfx.c ds/source/sfx.c ds/source/intro.c \
              core/mx.c core/mx_meta.c core/cloth.c -lm -o /tmp/ds_fx_$fast
          done
          for l in 0 5 19 39 59; do
            DS_PERF_BENCH=1 /tmp/ds_fx_0 /tmp/ds_fx_ref 520 "$l" | grep '^DS_FRAME_HASH ' > /tmp/ds_fx_old.txt
            DS_PERF_BENCH=1 /tmp/ds_fx_1 /tmp/ds_fx_new 520 "$l" | grep '^DS_FRAME_HASH ' > /tmp/ds_fx_new.txt
            test -s /tmp/ds_fx_old.txt
            diff -u /tmp/ds_fx_old.txt /tmp/ds_fx_new.txt
            echo "Level $((l+1)) DS particle and aim pixels identical"
          done
      - name: Check 3DS circles, stereo aiming and particle slots against reference
        run: |
          for src in gfx intro; do
            gcc -std=gnu99 -O1 -Wno-unused-function -DMX_FIXED -D__3DS__ \
              -I3ds/shim -Itest/stubs -Icore -Iart -Ids/source \
              -c ds/source/$src.c -o /tmp/n3d_smoke_$src.o
          done
          for fast in 0 1; do
            gcc -std=gnu99 -O1 -Wno-unused -Wno-misleading-indentation -D__3DS__ \
              -DMX_N3DS_AIM_CACHE=$fast -DMX_N3DS_FAST_PALETTE=$fast \
              -DMX_N3DS_INT_CIRCLE=$fast -DMX_N3DS_PARTICLE_HINT=$fast \
              -I3ds/shim -Itest/stubs -Icore -Iart -Ids/source \
              test/n3ds_render.c /tmp/n3d_smoke_gfx.o /tmp/n3d_smoke_intro.o \
              core/mx.c core/mx_meta.c core/cloth.c core/mx_snd.c -lm -o /tmp/n3d_smoke_$fast
          done
          N3DS_FASTPATH_PROBE=1 /tmp/n3d_smoke_0 > /tmp/n3d_smoke_old.txt
          N3DS_FASTPATH_PROBE=1 /tmp/n3d_smoke_1 > /tmp/n3d_smoke_new.txt
          diff -u /tmp/n3d_smoke_old.txt /tmp/n3d_smoke_new.txt
          cat /tmp/n3d_smoke_new.txt
          N3DS_TILE_CLIP_PROBE=1 /tmp/n3d_smoke_1
      - name: Exercise real 3DS pad/touch pause, restart and music controls
        run: |
          set -eu
          gcc -std=gnu99 -O1 -Wno-unused -Wno-misleading-indentation -D__3DS__ \
            -I3ds/shim -Itest/stubs -Icore -Iart -Ids/source \
            test/n3ds_walk.c /tmp/n3d_smoke_gfx.o /tmp/n3d_smoke_intro.o \
            core/mx.c core/mx_meta.c core/cloth.c core/mx_snd.c -lm -o /tmp/n3d_input_smoke
          /tmp/n3d_input_smoke > /tmp/n3d_input_smoke.log
          grep -q '3DS SELECT restarts without accidentally toggling music' /tmp/n3d_input_smoke.log
          grep -q 'pausing a 3DS pull safely resets aim without spending a life' /tmp/n3d_input_smoke.log
          grep -q '3DS touch RESUME preserves the current level' /tmp/n3d_input_smoke.log
          grep -q '3DS touch RESTART resets the world and resumes' /tmp/n3d_input_smoke.log
          grep -q '3DS touch MENU safely exits to the title' /tmp/n3d_input_smoke.log
          grep -q '3DS walking/pause/input test: all passed' /tmp/n3d_input_smoke.log
          tail -n 15 /tmp/n3d_input_smoke.log
      - name: Check Dreamcast RGB565 palette bytes and identical particle slots
        run: |
          for src in gfx intro; do
            gcc -std=gnu99 -O1 -Wno-unused-function -DMX_FIXED -DMX_SHARED_CUTSCENE \
              -Dgfx_init=ds_gfx_init -Idreamcast/shim -Itest/stubs -Icore -Iart -Ids/source \
              -c ds/source/$src.c -o /tmp/dc_smoke_$src.o
          done
          for fast in 0 1; do
            gcc -std=gnu99 -O1 -Wno-unused-function -Wno-misleading-indentation \
              -DMX_DC_FAST_PALETTE=$fast -DMX_DC_PARTICLE_HINT=$fast \
              -Idreamcast/shim -Itest/stubs -Icore -Iart -Ids/source \
              /tmp/dc_smoke_gfx.o /tmp/dc_smoke_intro.o \
              core/mx.c core/mx_meta.c core/cloth.c core/mx_snd.c \
              test/dc_render.c -lm -o /tmp/dc_smoke_$fast
          done
          DC_FASTPATH_PROBE=1 /tmp/dc_smoke_0 > /tmp/dc_smoke_old.txt
          DC_FASTPATH_PROBE=1 /tmp/dc_smoke_1 > /tmp/dc_smoke_new.txt
          diff -u /tmp/dc_smoke_old.txt /tmp/dc_smoke_new.txt
          cat /tmp/dc_smoke_new.txt
      - name: Dreamcast title/PVR memory and final-level navigation regression
        run: |
          set -eu
          DC_MENU_FLOW_TEST=1 /tmp/dc_smoke_1 > /tmp/dc_menu_flow.log
          grep -q 'returning to title reacquires the freed PVR texture' /tmp/dc_menu_flow.log
          grep -q 'restored title image is byte-identical' /tmp/dc_menu_flow.log
          grep -q 'winning final level returns to playable title' /tmp/dc_menu_flow.log
          grep -q 'losing a level retries that same valid level' /tmp/dc_menu_flow.log
          grep -q 'B on a loss screen returns to title' /tmp/dc_menu_flow.log
          grep -q 'B on a win screen takes priority over START' /tmp/dc_menu_flow.log
          grep -q '900 cutscene frames freeze physics' /tmp/dc_menu_flow.log
          grep -q 'title UI frames cannot advance hidden gameplay' /tmp/dc_menu_flow.log
          grep -q 'world simulation resumes after the intro/pause' /tmp/dc_menu_flow.log
          grep -q 'Dreamcast menu flow: all passed' /tmp/dc_menu_flow.log
          cat /tmp/dc_menu_flow.log

name: Browser creator and responsive play gates
# Focused tests run quickly even when the full float/fixed console host
# suite is still processing long destruction/replay sweeps.
on:
  pull_request:
    paths:
      - "web/**"
      - "test/browser_*.js"
      - "test/browser_*.py"
      - ".github/workflows/browser-creator-gates.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "test/browser_*.js"
      - "test/browser_*.py"
      - ".github/workflows/browser-creator-gates.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Canonical MX1 codes, UTF-8 names and malicious import rejection
        run: node test/browser_creator_codec_test.js
      - name: Portrait and landscape navigation, editor, world coordinates
        run: node test/browser_orientation_test.js
      - name: Captured multitouch and camera safety
        run: node test/browser_multitouch_test.js
      - name: Direct gadget chooser, stock and modal touch isolation
        run: node test/browser_tool_picker_test.js
      - name: Shared walk controls and collision memory
        run: node test/browser_walk_memory_test.js
      - name: Portrait walking focus and bounded camera transitions
        run: node test/browser_walk_camera_test.js
      - name: Owned aiming, manual pan and pinch zoom
        run: node test/browser_manual_camera_test.js
      - name: Creator expansion, landing pose and effect visibility
        run: node test/browser_camera_expansion_test.js
      - name: Player and enemy animation motion continuity
        run: node test/browser_animation_motion_test.js
      - name: Interactive world and destruction animation feedback
        run: node test/browser_world_animation_test.js
      - name: Landscape creator selection, pagination and trial navigation
        run: node test/browser_landscape_select_test.js
      - name: Touch-only end of walking life and remaining-time display
        run: node test/browser_walk_finish_test.js
      - name: Complete trial pack generation and decoder parity
        run: node test/trial_pack_test.js
      - name: Counterpunch interrupts and multi-hit recovery
        run: node test/browser_combat_recovery_test.js
      - name: Stomp-pad boost and held-button ascent
        run: node test/browser_pad_stomp_test.js
      - name: Shot readiness and inventory labels
        run: node test/browser_tool_feedback_test.js
      - name: Character pose turnaround and punch timing
        run: node test/browser_turn_pose_test.js
      - name: Golden Cels character shape, movement and facial acting
        run: node test/browser_cel_character_test.js
      - name: Walking HUD, objectives and portrait spacing
        run: node test/browser_objective_test.js
      - name: Adaptive refresh pacing, viewport actors and fracture thresholds
        run: node test/browser_viewport_performance_test.js
      - name: Shaking camera debris visibility and draw work
        run: node test/browser_rubble_draw_test.js
      - name: Shattered debris stops contacting during its solver step
        run: node test/browser_dead_rubble_test.js

  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
      - name: Compare actual Canvas pixels with complete reference drawing
        run: python3 test/browser_canvas_cull_test.py --out-dir out/browser-canvas
      - name: Exercise live keyboard, slingshot and orientation input
        run: python3 test/browser_input_smoke.py --out-dir out/browser-canvas/input
      - name: Exercise live gadget selection, pause and stock consumption
        run: python3 test/browser_tool_picker_live.py --out-dir out/browser-canvas/tools
      - name: Render Golden Cels character poses and verify Classic restoration
        run: python3 test/browser_cel_character_live.py --out-dir out/browser-canvas/character
      - name: Real three-stage circuits, HQ rewards and walking transit
        run: python3 test/browser_relay_circuit_test.py --out-dir out/browser-canvas/relays
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mandex-browser-canvas-review
          path: out/browser-canvas
          retention-days: 7
          if-no-files-found: warn

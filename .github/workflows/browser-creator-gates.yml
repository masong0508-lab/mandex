name: Browser creator and responsive play gates
# Focused tests run quickly even when the full float/fixed console host
# suite is still processing long destruction/replay sweeps.
on:
  pull_request:
    paths:
      - "web/**"
      - "test/browser_*.js"
      - "test/browser_*.py"
      - ".github/workflows/browser-creator-gates.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "test/browser_*.js"
      - "test/browser_*.py"
      - ".github/workflows/browser-creator-gates.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node version
        run: node --version
      - name: Canonical MX1 codes, UTF-8 names and malicious import rejection
        run: node test/browser_creator_codec_test.js
      - name: Portrait and landscape navigation, editor, world coordinates
        run: node test/browser_orientation_test.js
      - name: Low-end phones, independent frame pacing and responsive performance settings
        run: node test/browser_phone_performance_test.js
      - name: Captured multitouch and camera safety
        run: node test/browser_multitouch_test.js
      - name: Shared walk controls and collision memory
        run: node test/browser_walk_memory_test.js
      - name: Portrait walking focus and bounded camera transitions
        run: node test/browser_walk_camera_test.js
      - name: Counterpunch interrupts and multi-hit recovery
        run: node test/browser_combat_recovery_test.js
      - name: Stomp-pad boost and held-button ascent
        run: node test/browser_pad_stomp_test.js
      - name: Shot readiness and inventory labels
        run: node test/browser_tool_feedback_test.js
      - name: Character pose turnaround and punch timing
        run: node test/browser_turn_pose_test.js
      - name: Walking HUD, objectives and portrait spacing
        run: node test/browser_objective_test.js
      - name: Shaking camera debris visibility and draw work
        run: node test/browser_rubble_draw_test.js
      - name: Shattered debris stops contacting during its solver step
        run: node test/browser_dead_rubble_test.js

  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
      - name: Compare actual Canvas pixels with complete reference drawing
        run: python3 test/browser_canvas_cull_test.py --out-dir out/browser-canvas
      - name: Exercise live keyboard, slingshot and orientation input
        run: python3 test/browser_input_smoke.py --out-dir out/browser-canvas/input
      - name: Real Chromium phone performance settings and scaled slingshot
        run: python3 test/browser_phone_canvas_test.py --out-dir out/browser-canvas/phone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mandex-browser-canvas-review
          path: out/browser-canvas
          retention-days: 7
          if-no-files-found: warn

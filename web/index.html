 valveCrack(){if(!AC||muted)return;crackLoad();if(!crackBuf)return;const s=AC.createBufferSource();s.buffer=crackBuf;s.playbackRate.value=pv();const g=AC.createGain();g.gain.value=.9;s.connect(g);g.connect(master);s.start()},

const SPR=[];let bgA,bgB;
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function shade(hex,a){const n=parseInt(hex.slice(1),16);return`rgb(${clamp((n>>16)+a,0,255)|0},${clamp((n>>8&255)+a,0,255)|0},${clamp((n&255)+a,0,255)|0})`}
function paintCell(x,m,v,d){

  if(m===1){R(base,0,0,8,8);R(dark,2,0,1,8);R(dark,5,0,1,8);R(lite,0,0,8,1);R(dark,0,7,8,1);if(v===2)R(dark,3,3,2,2)}
  else if(m===2){R('#bcab9b',0,0,8,8);R(base,0,0,7,3);R(base,0,4,3,3);R(base,4,4,4,3);R(lite,0,0,7,1);R(lite,0,4,3,1);R(lite,4,4,4,1);R(dark,0,2,7,1);R(dark,0,6,3,1);R(dark,4,6,4,1)}
  else if(m===3){R(base,0,0,8,8);R(lite,0,0,8,1);R(lite,0,0,1,8);R(dark,0,7,8,1);R(dark,7,0,1,8);R(dark,2+v,3,1,1);R(lite,5-v%2,5,1,1);R(dark,4,2+v%2,1,1)}
  else if(m===4){x.globalAlpha=.5;R(base,0,0,8,8);x.globalAlpha=1;R('rgba(255,255,255,.85)',1,1,1,4);R('rgba(255,255,255,.7)',2,1,1,1);R('rgba(255,255,255,.5)',5,5,1,2);R('rgba(60,120,150,.5)',0,7,8,1);R('rgba(60,120,150,.5)',7,0,1,8)}
  else if(m===5){R(base,0,0,8,8);R('#fff',0,3,8,2);R('#111',1,3,1,2);R('#111',3,3,1,2);R('#111',5,3,1,2);R('#7a1010',0,7,8,1);R('#ff9a9a',0,0,8,1);R('#555',3,0,2,1)}
  else if(m===7){R(dark,0,0,8,8);R(base,1,1,6,6);R(lite,1,1,6,1);R(lite,1,1,1,3);R('rgba(255,255,255,.85)',2,2,2,1);R('rgba(255,255,255,.85)',2,3,1,1);R(dark,5,6,2,1);R(dark,0,0,1,1);R(dark,7,0,1,1);R(dark,0,7,1,1);R(dark,7,7,1,1)}
  else if(m===8){R(base,0,0,8,8);for(let k=0;k<11;k++){const px=(k*5+v*3)%8,py=(k*3+v*7+(k>>2))%8;R(k&1?lite:dark,px,py,1,1)}R(lite,0,0,8,1);R(dark,0,7,8,1)}
  else{R(base,0,0,8,8);R(lite,0,0,8,1);R(dark,0,7,8,1);R(dark,7,0,1,8);R('#d7e1ec',1,1,1,1);R('#d7e1ec',6,1,1,1);R(dark,1,6,1,1);R(dark,6,6,1,1);R(shade(M.c,o-12),3,3,2,2)}
  if(d>=1){const cr=m===4?'rgba(255,255,255,.9)':'rgba(20,10,5,.75)';R(cr,2,1,1,3);R(cr,3,4,2,1);R(cr,5,5,1,3)}
  if(d>=2){const cr=m===4?'rgba(255,255,255,.9)':'rgba(20,10,5,.85)';if(m!==4)R('rgba(0,0,0,.22)',0,0,8,8);R(cr,0,2,3,1);R(cr,4,0,1,3);R(cr,1,5,4,1);R(cr,6,3,1,4)}
}
function buildSprites(){for(let m=1;m<MAT.length;m++){SPR[m]=[];for(let v=0;v<4;v++){SPR[m][v]=[];for(let d=0;d<3;d++){const c=mkCanvas(V,V);paintCell(c.getContext('2d'),m,v,d);SPR[m][v][d]=c}}}}

// the world is normally 120 cells (960 px) wide; a level with `cols` is wider (the finale, 360).  Everything sized by COLS is rebuilt here, and the backdrop is redrawn at the new width.

  // far mountains

function nose(){ell(0,3.3,3.2,2.7,'#f3a784',1.2);ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(-1,2.4,1.1,.7,-.4,0,6.3);ctx.fill()}

  for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*.6,5.7);ctx.quadraticCurveTo(s*4,4.7,s*8.2,5.9);ctx.quadraticCurveTo(s*10.4,6.8,s*10,8.5);ctx.quadraticCurveTo(s*8.8,7.3,s*7,7.2);ctx.quadraticCurveTo(s*3.6,7.4,s*.6,6.7);ctx.closePath();ctx.fill();ctx.stroke()}
  ctx.restore()}
function eye(s,y,rx,ry,px,py,pr){const ex=s*6;ell(ex,y,rx,ry,'#fff',1.3);const r=pr||Math.min(rx,ry)*.66;

// =====================================================================
//  TOWEL CLOTH.  The towel he flags around is a small real cloth, not a drawing.  The recipe is in docs/CLOTH.md and core/cloth.c runs the same steps.
//  Design units (x right, y down, z toward the viewer, origin = body centre), orthographic: screen = (x,y), depth = z.
//  Cloth.x / Cloth.px are flat Float64Arrays of 3*CL_N numbers: particle k = i*CL_NY+j sits at x[3k],x[3k+1],x[3k+2]
//  (i = along the length, 0 = the held edge; j = across).  Only particle CL_PIN (0,1) is held, exactly on the hand.
// =====================================================================
let NOTOWEL=false;   // true: no towel is drawn and the arm does not wave (the console sprite generator sets it; the consoles draw their own cloth)
const CL_NX=7,CL_NY=3,CL_N=CL_NX*CL_NY,CL_PIN=1,CL_RL=7,CL_RW=9,CL_DT=1/60,CL_GRAV=420,CL_DAMP=.992,CL_KN=.12,CL_G=380,CL_W1=2*Math.PI*2.1,CL_W2=2*Math.PI*3.1,CL_ITER=6,CL_GPH=.8;
// edge modes: 0 = the recipe (only particle (0,1) is held); 1 = the whole held edge (3 particles) rides on the fist as a short VERTICAL bar, like a flag on a pole (used by the spin);
// 2 = the held edge is a short HORIZONTAL bar and the cloth hangs from it like a towel (used by the back view)
// distance pairs [a,b,rest^2], in this order every round: shear (both diagonals), j-neighbours, i-neighbours (the length goes last so it wins: stretch mean 6% instead of 9%).  No bend pairs: an i-to-i+2 pair at 2*RL just makes a rigid plank
const CL_PAIRS=(()=>{const P=[],k=(i,j)=>i*CL_NY+j,sh2=CL_RL*CL_RL+CL_RW*CL_RW;
  for(let i=0;i<CL_NX-1;i++)for(let j=0;j<CL_NY-1;j++){P.push([k(i,j),k(i+1,j+1),sh2]);P.push([k(i,j+1),k(i+1,j),sh2])}
  for(let i=0;i<CL_NX;i++)for(let j=0;j<CL_NY-1;j++)P.push([k(i,j),k(i,j+1),CL_RW*CL_RW]);
  for(let i=0;i<CL_NX-1;i++)for(let j=0;j<CL_NY;j++)P.push([k(i,j),k(i+1,j),CL_RL*CL_RL]);
  return P})();
class Cloth{
  constructor(H,mode){                              // start shape: drooping away from the fist (edge 1) or hanging straight down (edge 0, 2); z nudged +-0.4 so it is never perfectly flat
    this.mode=mode|0;this.x=new Float64Array(3*CL_N);this.px=new Float64Array(3*CL_N);this.cr=new Float64Array(3*CL_N);
    const dir=H[0]<0?-1:1;
    for(let i=0;i<CL_NX;i++)for(let j=0;j<CL_NY;j++){const k=i*CL_NY+j,z=H[2]+(k&1?.4:-.4);
      if(this.mode===1){this.x[3*k]=H[0]+dir*i*CL_RL*.9;this.x[3*k+1]=H[1]+(j-1)*CL_RW+i*CL_RL*.45;this.x[3*k+2]=z}
      else{this.x[3*k]=H[0]+(j-1)*CL_RW;this.x[3*k+1]=H[1]+i*CL_RL;this.x[3*k+2]=z}}
    this.px.set(this.x)}
  held(k){return this.mode?k<CL_NY:k===CL_PIN}
  // ONE fixed 1/60 s step.  H = hand anchor [x,y,z]; T = seconds since the towel started (drives the gust)
  step(H,T){
    const x=this.x,px=this.px,cr=this.cr,dt2=CL_DT*CL_DT;
    const gr=CL_GRAV*dt2;
    cr.fill(0);
    for(let i=0;i<CL_NX-1;i++)for(let j=0;j<CL_NY-1;j++){                          // normal drag: air pushes against the face of each quad
      const a=3*(i*CL_NY+j),b=3*((i+1)*CL_NY+j),c=3*(i*CL_NY+j+1),d=3*((i+1)*CL_NY+j+1);
      const bx=x[b]-x[a],by=x[b+1]-x[a+1],bz=x[b+2]-x[a+2],cx=x[c]-x[a],cy=x[c+1]-x[a+1],cz=x[c+2]-x[a+2];
      const nx=by*cz-bz*cy,ny=bz*cx-bx*cz,nz=bx*cy-by*cx;                          // n = (b-a) x (c-a)
      const ux=((x[a]-px[a])+(x[b]-px[b])+(x[c]-px[c])+(x[d]-px[d]))/4,uy=((x[a+1]-px[a+1])+(x[b+1]-px[b+1])+(x[c+1]-px[c+1])+(x[d+1]-px[d+1]))/4,uz=((x[a+2]-px[a+2])+(x[b+2]-px[b+2])+(x[c+2]-px[c+2])+(x[d+2]-px[d+2]))/4;
      const f=CL_KN*(nx*ux+ny*uy+nz*uz)/(nx*nx+ny*ny+nz*nz+1e-3)*.25;
      for(const q of[a,b,c,d]){cr[q]+=f*nx;cr[q+1]+=f*ny;cr[q+2]+=f*nz}}
    for(let k=0;k<CL_N;k++){if(this.held(k))continue;const q=3*k,ph=-CL_GPH*((k/CL_NY)|0);                      // Verlet; the gust runs a little late along the cloth (column i is CL_GPH*i radians behind), which is what makes ripples travel down it
      const gx=CL_G*Math.sin(CL_W1*T+ph)*dt2,gy=gr+.25*CL_G*Math.sin(CL_W2*T+1.3+ph)*dt2,gz=CL_G*Math.cos(CL_W1*T+.6+ph)*dt2;
      let u=(x[q]-px[q])*CL_DAMP-cr[q];px[q]=x[q];x[q]+=u+gx;
      u=(x[q+1]-px[q+1])*CL_DAMP-cr[q+1];px[q+1]=x[q+1];x[q+1]+=u+gy;
      u=(x[q+2]-px[q+2])*CL_DAMP-cr[q+2];px[q+2]=x[q+2];x[q+2]+=u+gz}
    for(let k=0;k<CL_N;k++)if(this.held(k)){const q=3*k;px[q]=x[q];px[q+1]=x[q+1];px[q+2]=x[q+2];x[q]=H[0]+(this.mode===2?(k-1)*CL_RW:0);x[q+1]=H[1]+(this.mode===1?(k-1)*CL_RW:0);x[q+2]=H[2]}   // the hand holds these
    for(let it=0;it<CL_ITER;it++)for(const[A,B,L2]of CL_PAIRS){                      // keep the lengths (no square root)
      const a=3*A,b=3*B,dx=x[b]-x[a],dy=x[b+1]-x[a+1],dz=x[b+2]-x[a+2],f=L2/(dx*dx+dy*dy+dz*dz+L2)-.5;
      const pa=this.held(A),pb=this.held(B);if(pa&&pb)continue;
      if(pa){x[b]+=2*dx*f;x[b+1]+=2*dy*f;x[b+2]+=2*dz*f}
      else if(pb){x[a]-=2*dx*f;x[a+1]-=2*dy*f;x[a+2]-=2*dz*f}
      else{x[a]-=dx*f;x[a+1]-=dy*f;x[a+2]-=dz*f;x[b]+=dx*f;x[b+1]+=dy*f;x[b+2]+=dz*f}}}}
// live driver: a towel state is advanced by the real clock in fixed 1/60 s steps (at most 5 per drawn frame, so a slow tab never explodes).
// If nobody drew it for a quarter second (gag over, man dragged) it starts again, hanging from the hand.
const TW_SPIN={c:null,seen:-9,T:0,acc:0},TW_BACK={c:null,seen:-9,T:0,acc:0};
function towelFor(tw,H,pre,mode){
  if(!tw.c||tw.c.mode!==(mode|0)||time-tw.seen>.25){tw.c=new Cloth(H,mode);tw.T=0;tw.acc=0;if(pre)for(let n=0;n<120;n++){tw.c.step(H,tw.T);tw.T+=CL_DT}}
  else{tw.acc+=Math.min(.1,time-tw.seen);let n=0;while(tw.acc>=CL_DT&&n<5){tw.c.step(H,tw.T);tw.T+=CL_DT;tw.acc-=CL_DT;n++}if(tw.acc>=CL_DT)tw.acc=0}
  tw.seen=time;return tw.c}
function towelStatic(H,mode){const c=new Cloth(H,mode||1);for(let n=0;n<150;n++)c.step(H,n*CL_DT);return c}   // a settled flag, for poses drawn with no live clock
function armWave(a){const p=6.2832*2.3*time;return[a*5*Math.sin(p),a*2.5*Math.cos(p),a*3*Math.cos(p+1.3)]}   // small circular wave of the raised hand

// Landscape is untouched (zoom 1, camera at 0,0).  In portrait the screen is a tall 540xN canvas, the world is drawn zoomed in,
// the ground sits at the bottom, and the camera slides sideways: to the buildings while you pull back, with the man in flight,
// and to the wreckage between throws.  Aiming works in SCREEN distance, so the moving camera never fights your finger.

    CAM.snap=true}

  CAM.on=por||!!(CL&&CL.cols>120&&(state==='play'||state==='win'||state==='lose'))}

  if(CL.slings){n=0;sx=0;for(const t of targets)if(t.alive&&t.zone===slingK){sx+=t.x;n++}}   // the wide finale: look at the landlords of the sling you stand at
  const bL=clamp((n?sx/n:640)-vw*.5,0,WW-vw),iL=CL.slings?clamp(SX-vw*.2,0,WW-vw):0,m=man;
  let tl=bL,ty=baseY,fast=4;

    for(let i=0;i<CH1;i++){const c=i%cols,r=(i/cols)|0;tile(x0+c*(tw+gx),y0+r*(th+gy),tw,th,i+1,LEVELS[i].name,PD.stars[i]||0,!storyUnlocked(i),()=>startStory(i))}
    txt(`${totalStars()} / ${CH1*3} ★   ${storyDone()}/${CH1} beaten`,W/2,H-14,15,'#cfd','center')}
  else{
    const cu=PD.custom,cols=4,tw=206,th=96,gx=10,gy=10,x0=(W-(cols*tw+(cols-1)*gx))/2,y0=112;
    tile('+','NEW LEVEL',0,false,()=>openEditor(false,-1),false);
    tile('⇩','IMPORT A LEVEL CODE',0,false,importCode,false);
    cu.slice(0,10).forEach((L,k)=>{const i2=k+2,c=i2%cols,r=(i2/cols)|0,x=x0+c*(tw+gx),y=y0+r*(th+gy);
      tile(k+1,L.n,0,false,()=>{startCustom(k)},false);
      // (tile() registered first; the small buttons registered after win the hit test)
      btn(x+6,y+th-62,48,22,'EDIT',()=>openEditor(false,k),{size:11});btn(x+58,y+th-62,54,22,'SHARE',()=>exportCode(L),{size:11});btn(x+116,y+th-62,48,22,'DEL',()=>{if(!confirmDel(L))return;cu.splice(k,1);pdTouch();pdSave()},{size:11})});
    if(!cu.length)txt('Make a level in the creator and it shows up here.',W/2,H-30,15,'#cfd','center')}}
function confirmDel(L){try{return confirm('Delete "'+L.n+'"?')}catch(e){return true}}
function drawAch(){
  ctx.fillStyle='rgba(10,14,30,.6)';ctx.fillRect(0,0,W,H);
  txt('ACHIEVEMENTS',W/2,50,38,'#ffd23f','center','#7a1a1a');txt(`${achCount()} / ${ACH.length}`,W-20,40,22,'#fff','right');
  btn(16,14,90,36,'< MENU',goMenu,{size:16});
  const rows=13,rw=450,rh=32,x0=[18,492],y0=62;
  ACH.forEach((a,i)=>{const c=(i/rows)|0,r=i%rows,x=x0[c],y=y0+r*(rh+2),got=PD.ach[a.id];
    ctx.save();rrect(x,y,rw,rh,8);ctx.fillStyle=got?'rgba(40,60,30,.85)':'rgba(15,18,30,.78)';ctx.fill();ctx.strokeStyle=got?'#7dff5a':'rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=got?'#ffd23f':'#3a3f55';ctx.beginPath();ctx.arc(x+20,y+17,11,0,7);ctx.fill();txt(got?'★':'?',x+20,y+23,15,got?'#1a1a2a':'#889','center',got?'#fff':'#000');
    txt(a.n,x+40,y+15,15,got?'#fff':'#aab','left');txt(a.d,x+40,y+30,11,got?'#cfd':'#889','left');
    if(!got&&a.p){const[p,m]=a.p();txt(`${Math.min(p,m)}/${m}`,x+rw-10,y+22,13,'#ffd23f','right')}ctx.restore()})}
function drawOutfits(){
  ctx.fillStyle='rgba(10,14,30,.62)';ctx.fillRect(0,0,W,H);
  txt('OUTFITS',W/2,50,38,'#ffd23f','center','#7a1a1a');btn(16,14,90,36,'< MENU',goMenu,{size:16});
  panel(30,70,330,430);
  ctx.save();ctx.translate(195,370);ctx.scale(1.4,1.4);if(outfitCur.rainbow)applyOutfit(outfitCur,time);const sw=Math.sin(time*5);drawManFrame(sw>.33?'BACK_R':sw<-.33?'BACK_L':'BACK_C');ctx.restore();
  txt(outfitCur.n,195,110,24,'#fff','center');
  const cols=2,cw=268,ch=58,x0=384,y0=72;
  OUTFITS.forEach((o,i)=>{const c=i%cols,r=(i/cols)|0,x=x0+c*(cw+10),y=y0+r*(ch+4),own=PD.own[o.id],sel=outfitCur===o;
    hits.push({x,y,w:cw,h:ch,fn:()=>{if(own){equip(o);SFX.ding()}else SFX.pop()}});const hov=mouseX>=x&&mouseX<x+cw&&mouseY>=y&&mouseY<y+ch;
    ctx.save();rrect(x,y,cw,ch,10);ctx.fillStyle=sel?'rgba(60,90,40,.9)':hov&&own?'rgba(255,255,255,.28)':'rgba(15,18,30,.78)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=sel?'#7dff5a':'rgba(255,255,255,.3)';ctx.stroke();
    let c1=o.thong?o.tg:o.br,c2=o.tow;if(o.rainbow){c1=`hsl(${(time*60)%360},85%,52%)`;c2=`hsl(${(time*60+180)%360},85%,70%)`}
    ctx.globalAlpha=own?1:.35;ctx.fillStyle=c1;rrect(x+10,y+9,46,46,8);ctx.fill();ctx.fillStyle=c2;rrect(x+36,y+29,26,26,6);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;rrect(x+10,y+9,46,46,8);ctx.stroke();ctx.globalAlpha=1;
    txt(o.n,x+74,y+26,17,own?'#fff':'#889','left');txt(own?(sel?'WEARING':'tap to wear'):'locked: '+o.h,x+74,y+48,12,own?'#cfd':'#aab','left');ctx.restore()})}

// ---------- custom levels ----------
let CL=LEVELS[0],testing=false;
function encodeCells(g){const out=[];let cur=g[0],n=0;for(let i=0;i<g.length;i++){if(g[i]===cur)n++;else{out.push(cur,n);cur=g[i];n=1}}out.push(cur,n);return out}
function decodeCells(a){const g=new Uint8Array(COLS*ROWS);let p=0;for(let i=0;i<a.length;i+=2){const m=a[i]|0,n=a[i+1]|0;for(let k=0;k<n&&p<g.length;k++)g[p++]=m>8?0:m}return g}
function levelFromData(L){const g=decodeCells(L.c);return{name:L.n,men:Math.max(1,Math.min(12,L.m|0||5)),custom:true,build(){for(let i=0;i<g.length;i++)if(g[i])set(i%COLS,(i/COLS)|0,g[i]);for(const[cx,row]of L.t)tgt(cx,row)}}}
function startCustom(k){testing=false;load(-1,levelFromData(PD.custom[k]))}
function exportCode(L){const code='MX1.'+btoa(JSON.stringify({n:L.n,m:L.m,c:L.c,t:L.t}));ST().exported++;pdTouch();achCheck();
  try{navigator.clipboard.writeText(code)}catch(e){}
  try{prompt('Level code (copied if your browser allows). Send it to a friend:',code)}catch(e){}return code}
function importCode(){let s=null;try{s=prompt('Paste a level code:')}catch(e){}if(!s)return;
  try{s=s.trim();if(!s.startsWith('MX1.'))throw 0;const o=JSON.parse(atob(s.slice(4)));if(!Array.isArray(o.c)||!Array.isArray(o.t))throw 0;
    PD.custom.push({n:String(o.n||'Imported').slice(0,24),m:o.m|0||5,c:o.c.map(v=>v|0),t:o.t.slice(0,16).map(p=>[p[0]|0,p[1]|0])});pdTouch();pdSave();toast('outfit','Level imported',String(o.n||'Imported').slice(0,24))}
  catch(e){toast('ach','That code did not work','check you copied all of it')}}

// ---------- the editor ----------
const E={g:new Uint8Array(COLS*ROWS),t:[],men:5,mat:1,tool:'mat',shape:'pen',bk:0,bs:0,bt:1,undo:[],id:-1,name:'',drag:null};
const EMIN=28;   // columns left of this stay empty: the sling lives there
function openEditor(back,which){
  testing=false;state='edit';hits=[];
  if(back)return;
  if(which!==undefined&&which>=0){const L=PD.custom[which];E.g=decodeCells(L.c);E.t=L.t.map(p=>p.slice());E.men=L.m|0||5;E.id=which;E.name=L.n}
  else{E.g=new Uint8Array(COLS*ROWS);E.t=[];E.men=5;E.id=-1;E.name=''}
  E.undo=[];E.mat=1;E.tool='mat';E.shape='pen';E.bk=0;E.bs=0;E.bt=1}

function eSnap(){E.undo.push([E.g.slice(),E.t.map(p=>p.slice())]);if(E.undo.length>30)E.undo.shift()}
function eUndo(){const s=E.undo.pop();if(s){E.g=s[0];E.t=s[1]}}
function eCell(px,py){return[Math.floor(px/V),Math.floor(py/V)]}
function eClearLord(x,y){E.t=E.t.filter(p=>!(p[0]===x&&p[1]-1===y))}
// brushes: SQUARE n x n, WIDE n x thickness (long beams), TALL thickness x n (columns), ROUND radius n (discs)
const BR_KIND=['SQUARE','WIDE','TALL','ROUND'];
const BR_SIZE=[[1,2,3,4,6,8,12],[4,6,10,16,24,32,48],[4,6,10,16,24,36],[1,2,3,5,8,12,16]];
function brushDims(){const k=E.bk,n=BR_SIZE[k][E.bs];
  if(k===0)return{w:n,h:n,r:0};if(k===1)return{w:n,h:E.bt,r:0};if(k===2)return{w:E.bt,h:n,r:0};return{w:2*n+1,h:2*n+1,r:n}}
function brushLabel(){const B=brushDims();return E.bk===3?'R'+B.r:B.w+'x'+B.h}
function brushHas(i,j,B){if(!B.r)return true;const dx=i-B.r,dy=j-B.r;return dx*dx+dy*dy<=B.r*B.r+B.r*.5}
function eKind(d){E.bk=(E.bk+d+4)%4;E.bs=Math.min(E.bs,BR_SIZE[E.bk].length-1)}
function eSize(d){const n=BR_SIZE[E.bk].length;E.bs=(E.bs+d+n)%n}
function eThick(){if(E.bk===1||E.bk===2)E.bt=E.bt%4+1}
function ePut(cx,cy,m){const B=brushDims(),ox=cx-((B.w-1)>>1),oy=cy-((B.h-1)>>1);
  for(let j=0;j<B.h;j++)for(let i=0;i<B.w;i++){if(!brushHas(i,j,B))continue;const x=ox+i,y=oy+j;if(x<EMIN||x>=COLS||y<0||y>=ROWS)continue;E.g[idx(x,y)]=m;eClearLord(x,y)}}
function eLine(a,b,m){const n=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));for(let t=1;t<=n;t++)ePut(Math.round(a[0]+(b[0]-a[0])*t/n),Math.round(a[1]+(b[1]-a[1])*t/n),m)}   // no gaps when you drag fast
function eRect(a,b,m){const x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(x<EMIN||x>=COLS||y<0||y>=ROWS)continue;E.g[idx(x,y)]=m;eClearLord(x,y)}}
function eDown(x,y){
  if(y>=GY+3||x<EMIN*V)return;const c=eCell(x,y);
  if(E.tool==='lord'){eSnap();const k=E.t.findIndex(p=>Math.abs(p[0]-c[0])<=1&&Math.abs(p[1]-1-c[1])<=1);
    if(k>=0)E.t.splice(k,1);else if(E.t.length>=12)toast('ach','Max 12 landlords','');else if(c[0]>=EMIN&&c[1]<ROWS&&!E.g[idx(c[0],c[1])])E.t.push([c[0],c[1]+1]);return}
  eSnap();const m=E.tool==='erase'?0:E.mat;
  if(E.shape==='rect'){E.drag={a:c,b:c,m};return}
  E.drag={pen:true,m,l:c};ePut(c[0],c[1],m)}
function eMove(x,y){if(!E.drag)return;const c=eCell(x,y);if(E.drag.pen){if(y<GY+3){const t=[c[0],Math.min(c[1],ROWS-1)];eLine(E.drag.l,t,E.drag.m);E.drag.l=t}}else E.drag.b=[c[0],Math.min(c[1],ROWS-1)]}
function eUp(){if(E.drag&&!E.drag.pen)eRect(E.drag.a,E.drag.b,E.drag.m);E.drag=null}
function eBuild(){const g=E.g.slice(),t=E.t.map(p=>p.slice());return{name:E.name||'Test Level',men:E.men,custom:true,build(){for(let i=0;i<g.length;i++)if(g[i])set(i%COLS,(i/COLS)|0,g[i]);for(const[cx,row]of t)tgt(cx,row)}}}
function eTest(){if(!E.t.length){toast('ach','Add at least one landlord','use the LANDLORD tool');return}testing=true;load(-1,eBuild())}
function eSave(){
  if(!E.t.length){toast('ach','Add at least one landlord','use the LANDLORD tool');return}
  let solid=0;for(const v of E.g)if(v)solid++;if(solid<8){toast('ach','Build something first','');return}
  if(!E.name){let nm=null;try{nm=prompt('Name your level:','My Level '+(PD.custom.length+1))}catch(e){}E.name=(nm&&nm.trim()?nm.trim():'My Level '+(PD.custom.length+1)).slice(0,24)}
  const L={n:E.name,m:E.men,c:encodeCells(E.g),t:E.t.map(p=>p.slice())};
  if(E.id>=0)PD.custom[E.id]=L;else{PD.custom.push(L);E.id=PD.custom.length-1;ST().created++}
  pdTouch();pdSave();achCheck();toast('outfit','Saved: '+E.name,'find it under PLAY > MY LEVELS')}
const MATCOL=['#444',...MAT.slice(1).map(m=>m.c)];
function drawBrushPanel(){
  const kb=(k,x,y)=>btn(x,y,100,44,BR_KIND[k],()=>eKind(k-E.bk),{size:15,on:E.bk===k});
  panel(2,46,220,392);
  kb(0,8,52);kb(1,116,52);kb(2,8,100);kb(3,116,100);
  txt('SIZE '+brushLabel(),112,170,16,'#fff','center');
  BR_SIZE[E.bk].forEach((n,i)=>btn(8+(i%4)*52,180+((i/4)|0)*46,48,42,E.bk===3?'R'+n:''+n,()=>{E.bs=i},{size:15,on:E.bs===i}));
  txt('THICKNESS',112,284,14,'#cdd','center');
  const th=E.bk===1||E.bk===2;
  for(let t=1;t<=4;t++)btn(8+(t-1)*52,292,48,42,''+t,()=>{if(th)E.bt=t},{size:15,on:th&&E.bt===t,disabled:!th});
  btn(8,344,100,44,E.shape==='pen'?'PEN':'RECT',()=>{E.shape=E.shape==='pen'?'rect':'pen'},{size:15});
  btn(116,344,100,44,'UNDO',eUndo,{size:15});
  btn(8,392,100,40,'ERASE',()=>{E.tool='erase'},{size:14,on:E.tool==='erase'});
  btn(116,392,100,40,'LANDLORD',()=>{E.tool='lord'},{size:13,on:E.tool==='lord',col:'#ff8a8a'})}
function drawEditor(){
  ctx.setTransform(1,0,0,1,0,0);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const m=E.g[idx(x,y)];if(m)ctx.drawImage(SPR[m][hsh(x,y)&3][0],x*V,y*V)}
  ctx.fillStyle='rgba(255,60,60,.14)';ctx.fillRect(0,0,EMIN*V,GY);ctx.strokeStyle='rgba(255,90,90,.7)';ctx.setLineDash([6,5]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(EMIN*V,0);ctx.lineTo(EMIN*V,GY);ctx.stroke();ctx.setLineDash([]);
  txt('SLING AREA',EMIN*V/2,34,14,'#ffb0b0','center');drawBrushPanel();
  if(innerHeight>innerWidth*1.1)txt('turn your phone sideways to build',W/2+110,24,18,'#fff','center');
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.beginPath();for(let x=EMIN;x<=COLS;x+=5){ctx.moveTo(x*V,0);ctx.lineTo(x*V,GY)}for(let y=0;y<=ROWS;y+=5){ctx.moveTo(EMIN*V,y*V);ctx.lineTo(W,y*V)}ctx.stroke();
  E.t.forEach((p,i)=>{ctx.save();ctx.translate(p[0]*V+V/2,p[1]*V-7);drawLandlord({t:time+i,x:0,y:0});ctx.restore()});
  if(E.drag&&!E.drag.pen){const a=E.drag.a,b=E.drag.b;ctx.fillStyle=E.drag.m?MATCOL[E.drag.m]:'rgba(255,255,255,.4)';ctx.globalAlpha=.55;ctx.fillRect(Math.min(a[0],b[0])*V,Math.min(a[1],b[1])*V,(Math.abs(a[0]-b[0])+1)*V,(Math.abs(a[1]-b[1])+1)*V);ctx.globalAlpha=1}
  else if(mouseY<GY&&mouseX>EMIN*V){const c=eCell(mouseX,mouseY);ctx.strokeStyle='#fff';ctx.lineWidth=2;if(E.tool==='lord')ctx.strokeRect((c[0]-0)*V,(c[1]-0)*V,2*V,2*V);
    else{const B=brushDims(),ox=c[0]-((B.w-1)>>1),oy=c[1]-((B.h-1)>>1);
      if(B.r){ctx.beginPath();ctx.arc(c[0]*V+V/2,c[1]*V+V/2,(B.r+.5)*V,0,7);ctx.stroke()}else ctx.strokeRect(ox*V,oy*V,B.w*V,B.h*V);
      ctx.fillStyle='rgba(255,255,255,.12)';for(let j=0;j<B.h;j++)for(let i=0;i<B.w;i++)if(brushHas(i,j,B))ctx.fillRect((ox+i)*V,(oy+j)*V,V,V)}}
  ctx.fillStyle='rgba(12,14,26,.94)';ctx.fillRect(0,GY+3,W,H-GY-3);
  let x=8;const y1=GY+8;
  for(let m=0;m<=8;m++){const on=(E.tool==='erase'&&m===0)||(E.tool==='mat'&&E.mat===m&&m>0);
    btn(x,y1,50,24,m?MAT[m].n.toUpperCase():'ERASE',()=>{if(m===0)E.tool='erase';else{E.tool='mat';E.mat=m}},{size:10,on,swatch:m?MATCOL[m]:null});x+=52}
  btn(x+4,y1,100,24,'LANDLORD',()=>{E.tool='lord'},{size:12,on:E.tool==='lord',col:'#ff8a8a'});x+=112;
  btn(x,y1,56,24,E.shape==='pen'?'PEN':'RECT',()=>{E.shape=E.shape==='pen'?'rect':'pen'},{size:12});x+=62;
  const y2=y1+28;x=8;
  btn(x,y2,26,24,'-',()=>{E.men=Math.max(1,E.men-1)},{size:16});txt('MEN '+E.men,x+62,y2+17,14,'#fff','center');btn(x+98,y2,26,24,'+',()=>{E.men=Math.min(12,E.men+1)},{size:16});x+=134;
  btn(x,y2,64,24,'UNDO',eUndo,{size:12});x+=70;
  btn(x,y2,64,24,'CLEAR',()=>{eSnap();E.g=new Uint8Array(COLS*ROWS);E.t=[]},{size:12});x+=70;
  btn(x,y2,90,24,'TEST PLAY',eTest,{size:13,on:true,col:'#7dff5a'});x+=96;
  btn(x,y2,64,24,'SAVE',eSave,{size:13,on:true});x+=70;
  btn(x,y2,70,24,'SHARE',()=>{if(!E.t.length){toast('ach','Add a landlord first','');return}exportCode({n:E.name||'My Level',m:E.men,c:encodeCells(E.g),t:E.t})},{size:12});x+=76;
  btn(x,y2,56,24,'EXIT',()=>{selTab=1;goSelect()},{size:12});
  txt(E.name?E.name:'unsaved level',W-8,y2+17,13,'#99a','right')}

// ---------- level finished: stars, achievements ----------
function onWin(){
  const st=men>=2?3:men>=1?2:1,sc=Math.round(score);
  if(CL&&CL.custom){if(testing||true)ST().customWins++}
  else{const hadValve=valveOpen();PD.stars[level]=Math.max(PD.stars[level]||0,st);PD.best[level]=Math.max(PD.best[level]||0,sc);ST().wins++;
    if(!hadValve&&valveOpen())toast('ach','Air valve unlocked!','tap the valve at the lower left of the sling')}
  const used=CL?CL.men-men:0;if(used<=1)ST().oneShots++;
  ST().bestScore=Math.max(ST().bestScore,sc);
  achCheck();pdSave()}
function onShot(){lv.shots++;ST().shots++;pdTouch()}
function onBoom(){lv.booms++;ST().booms++;ST().maxChain=Math.max(ST().maxChain,lv.booms);pdTouch()}
function onCell(){ST().cells++}
function onLandlord(){lv.kills++;ST().kills++;if(man&&man.mode==='fly'&&man.dive){lv.flops++;ST().flops++}pdTouch();achCheck()}
setInterval(()=>{if(pdDirty)pdSave();if(state==='play'||state==='win')achCheck()},4000);

buildSprites();buildBG();
let last=performance.now(),frameDt=.016;
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;frameDt=dt;try{layoutTick();update(dt);camTick(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}   // one bad frame must never stop the game
requestAnimationFrame(loop);
</script></body></html>

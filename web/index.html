<script>
'use strict';
// =====================================================================
//  MANDEX  -  sticky dad-bod demolition.  Voxel world + rigid-body chunks
// =====================================================================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const V=8,COLS=120,ROWS=60,GY=ROWS*V,W=960,H=540,G=900,K=1100,RC=V*.5;
const SX=128,SY=GY-118,PULL=92;
const DX=[1,-1,0,0],DY=[0,0,1,-1];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=Math.random;
const idx=(x,y)=>y*COLS+x,inb=(x,y)=>x>=0&&x<COLS&&y>=0&&y<ROWS;
function hsh(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return(h^(h>>>16))>>>0}

// ---------- materials: hp, density, max horizontal overhang (cells) ----------
const MAT=[null,
 {n:'wood',  hp:20, d:.6, lim:6, c:'#b98543',K:3600, damp:2.0,ymax:.90,rest:.16,fric:.7,brit:.8},
 {n:'brick', hp:40, d:1,  lim:9, c:'#c0503a',K:8000, damp:3.0,ymax:.30,rest:.12,fric:.8,brit:1.3},
 {n:'stone', hp:85, d:1.6,lim:14,c:'#8f929c',K:12800,damp:3.5,ymax:.26,rest:.08,fric:.8,brit:.6},
 {n:'glass', hp:5,  d:.5, lim:2, c:'#aee8f7',K:4400, damp:3.0,ymax:.12,rest:.30,fric:.3,brit:3},
 {n:'tnt',   hp:8,  d:.8, lim:2, c:'#d62a2a',K:3200, damp:2.0,ymax:.40,rest:.10,fric:.6,brit:1},
 {n:'steel', hp:150,d:2,  lim:16,c:'#7b8a9c',K:18000,damp:1.0,ymax:1.3,rest:.25,fric:.5,brit:.3},
 {n:'rubber',hp:60, d:.7, lim:8, c:'#ff6eaa',K:450,  damp:1.6,ymax:9,  rest:.85,fric:1, brit:0},
 {n:'sand',  hp:12, d:1.4,lim:8, c:'#e2c478',K:80,   damp:7.0,ymax:99, rest:0,  fric:.9,brit:2}];
const WOOD=1,BRICK=2,STONE=3,GLASS=4,TNT=5,STEEL=6,RUBBER=7,SAND=8;

// ---------- state ----------
let grid,hp,anch,hb=new Uint8Array(COLS*ROWS);
let ox,oy,ovx,ovy,brk,wobOn=false,wobQuiet=0,sandOn=false,sandT=0,crackEv=0;   // wobble lattice (cells, cells/s)
let chunks=[],parts=[],texts=[],targets=[],interiors=[],explQ=[],man,men=0;
let level=0,state='title',shake=0,freeze=0,slow=0,needSupport=false,dragging=false;
let score=0,shownScore=0,time=0,winT=0,loseT=0,banner=0,hint=1,waitT=0,chunkId=0,flash=0;

// =====================================================================
//  AUDIO (tiny synth)
// =====================================================================
let AC=null,master=null,muted=false;const lastSnd={};
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination)}catch(e){AC=null}}
function can(k,ms){const n=performance.now();if(lastSnd[k]&&n-lastSnd[k]<ms)return false;lastSnd[k]=n;return true}
function noise(dur,f0,f1,g,type){if(!AC||muted)return;const n=(AC.sampleRate*dur)|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'lowpass';
  f.frequency.setValueAtTime(f0,AC.currentTime);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
  const gn=AC.createGain();gn.gain.value=g;s.connect(f);f.connect(gn);gn.connect(master);s.start()}
function tone(f0,f1,dur,g,type){if(!AC||muted)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,AC.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),AC.currentTime+dur);
  gn.gain.setValueAtTime(g,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(gn);gn.connect(master);o.start();o.stop(AC.currentTime+dur+.02)}
const SFX={
 launch(){tone(260,820,.28,.16,'sawtooth');noise(.3,900,3000,.12,'bandpass')},
 crunch(a){if(!can('cr',45))return;noise(.18,2200,260,Math.min(.7,.15+a*.5),'lowpass');tone(110,50,.1,.18*a,'square')},
 glass(){if(!can('gl',60))return;noise(.22,9000,4000,.16,'highpass');tone(2200,3300,.06,.05,'triangle')},
 boom(){noise(.9,900,40,.9,'lowpass');tone(110,28,.7,.6,'sine')},
 splat(){tone(220,60,.18,.3,'sine');noise(.2,1200,200,.25,'lowpass')},
 ding(){tone(880,1320,.18,.2,'triangle');setTimeout(()=>tone(1320,1760,.25,.18,'triangle'),90)},
 wooo(){tone(420,720,.35,.12,'sawtooth')},
 thud(a){if(!can('th',80))return;noise(.12,500,80,Math.min(.6,a),'lowpass')},
 pop(){tone(500,150,.12,.2,'sine')},
 crack(){if(!can('ck',60))return;noise(.08,3400,500,.2,'bandpass');tone(900,260,.07,.07,'square')},
 boing(){if(!can('bo',90))return;tone(170,760,.2,.24,'sine');setTimeout(()=>tone(760,230,.22,.16,'sine'),110)},
 burp(){if(!can('bu',400))return;tone(150,62,.5,.3,'sawtooth');tone(300,120,.45,.1,'square');noise(.45,500,120,.2,'lowpass')},
 fart(){if(!can('fa',500))return;tone(112,52,.55,.26,'sawtooth');setTimeout(()=>tone(92,46,.3,.2,'square'),230);noise(.6,700,90,.22,'lowpass')},
 slap(){if(!can('sl',90))return;noise(.07,3200,700,.4,'bandpass');tone(220,90,.07,.22,'square')},
 wig(){if(!can('wg',110))return;tone(140,330,.1,.16,'sine');setTimeout(()=>tone(330,150,.1,.14,'sine'),60)},
 snore(){if(!can('sn',900))return;tone(78,52,.6,.2,'sawtooth');noise(.6,400,110,.12,'lowpass')},
 booger(){if(!can('bg',120))return;tone(340,90,.1,.2,'sine');noise(.1,2400,500,.14,'bandpass')},
 sniff(){if(!can('sf',300))return;noise(.18,1800,4200,.12,'highpass')},
 grunt(){if(!can('gr',300))return;tone(135,88,.22,.22,'square');noise(.15,600,150,.1,'lowpass')},
 yawn(){if(!can('yw',500))return;tone(230,420,.35,.1,'sine');setTimeout(()=>tone(420,170,.5,.1,'sine'),330)},
 jiggle(){if(!can('jg',180))return;tone(130,55,.22,.3,'sine');noise(.12,1500,300,.18,'lowpass');setTimeout(()=>tone(170,65,.2,.2,'sine'),95);setTimeout(()=>tone(150,70,.18,.12,'sine'),190)},
 whoosh(){if(!can('wh',100))return;noise(.22,600,4200,.22,'bandpass')},
 taunt(){if(!can('ta',600))return;for(let i=0;i<7;i++)setTimeout(()=>tone(210-i*8,150,.05,.2,'square'),i*42);setTimeout(()=>noise(.28,1200,250,.14,'bandpass'),20);setTimeout(()=>tone(520,330,.2,.1,'triangle'),300)}};

// =====================================================================
//  SPRITES (8x8 pixel voxels with damage states)
// =====================================================================
const SPR=[];let bgA,bgB;
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function shade(hex,a){const n=parseInt(hex.slice(1),16);return`rgb(${clamp((n>>16)+a,0,255)|0},${clamp((n>>8&255)+a,0,255)|0},${clamp((n&255)+a,0,255)|0})`}
function paintCell(x,m,v,d){
  const M=MAT[m],o=[0,-9,7,-4][v],base=shade(M.c,o),dark=shade(M.c,o-38),lite=shade(M.c,o+32);
  const R=(c,a,b,w,h)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};
  if(m===1){R(base,0,0,8,8);R(dark,2,0,1,8);R(dark,5,0,1,8);R(lite,0,0,8,1);R(dark,0,7,8,1);if(v===2)R(dark,3,3,2,2)}
  else if(m===2){R('#bcab9b',0,0,8,8);R(base,0,0,7,3);R(base,0,4,3,3);R(base,4,4,4,3);R(lite,0,0,7,1);R(lite,0,4,3,1);R(lite,4,4,4,1);R(dark,0,2,7,1);R(dark,0,6,3,1);R(dark,4,6,4,1)}
  else if(m===3){R(base,0,0,8,8);R(lite,0,0,8,1);R(lite,0,0,1,8);R(dark,0,7,8,1);R(dark,7,0,1,8);R(dark,2+v,3,1,1);R(lite,5-v%2,5,1,1);R(dark,4,2+v%2,1,1)}
  else if(m===4){x.globalAlpha=.5;R(base,0,0,8,8);x.globalAlpha=1;R('rgba(255,255,255,.85)',1,1,1,4);R('rgba(255,255,255,.7)',2,1,1,1);R('rgba(255,255,255,.5)',5,5,1,2);R('rgba(60,120,150,.5)',0,7,8,1);R('rgba(60,120,150,.5)',7,0,1,8)}
  else if(m===5){R(base,0,0,8,8);R('#fff',0,3,8,2);R('#111',1,3,1,2);R('#111',3,3,1,2);R('#111',5,3,1,2);R('#7a1010',0,7,8,1);R('#ff9a9a',0,0,8,1);R('#555',3,0,2,1)}
  else if(m===7){R(dark,0,0,8,8);R(base,1,1,6,6);R(lite,1,1,6,1);R(lite,1,1,1,3);R('rgba(255,255,255,.85)',2,2,2,1);R('rgba(255,255,255,.85)',2,3,1,1);R(dark,5,6,2,1);R(dark,0,0,1,1);R(dark,7,0,1,1);R(dark,0,7,1,1);R(dark,7,7,1,1)}
  else if(m===8){R(base,0,0,8,8);for(let k=0;k<11;k++){const px=(k*5+v*3)%8,py=(k*3+v*7+(k>>2))%8;R(k&1?lite:dark,px,py,1,1)}R(lite,0,0,8,1);R(dark,0,7,8,1)}
  else{R(base,0,0,8,8);R(lite,0,0,8,1);R(dark,0,7,8,1);R(dark,7,0,1,8);R('#d7e1ec',1,1,1,1);R('#d7e1ec',6,1,1,1);R(dark,1,6,1,1);R(dark,6,6,1,1);R(shade(M.c,o-12),3,3,2,2)}
  if(d>=1){const cr=m===4?'rgba(255,255,255,.9)':'rgba(20,10,5,.75)';R(cr,2,1,1,3);R(cr,3,4,2,1);R(cr,5,5,1,3)}
  if(d>=2){const cr=m===4?'rgba(255,255,255,.9)':'rgba(20,10,5,.85)';if(m!==4)R('rgba(0,0,0,.22)',0,0,8,8);R(cr,0,2,3,1);R(cr,4,0,1,3);R(cr,1,5,4,1);R(cr,6,3,1,4)}
}
function buildSprites(){for(let m=1;m<MAT.length;m++){SPR[m]=[];for(let v=0;v<4;v++){SPR[m][v]=[];for(let d=0;d<3;d++){const c=mkCanvas(V,V);paintCell(c.getContext('2d'),m,v,d);SPR[m][v][d]=c}}}}

function buildBG(){
  bgA=mkCanvas(W,H);bgB=mkCanvas(W,H);
  let x=bgA.getContext('2d');
  let g=x.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#3d8fe8');g.addColorStop(.55,'#8ccaf7');g.addColorStop(1,'#ffeccb');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(800,90,6,800,90,190);g.addColorStop(0,'rgba(255,255,230,1)');g.addColorStop(.12,'rgba(255,240,170,.95)');g.addColorStop(.35,'rgba(255,230,150,.28)');g.addColorStop(1,'rgba(255,230,150,0)');x.fillStyle=g;x.fillRect(560,0,400,300);
  x=bgB.getContext('2d');
  // far mountains
  x.fillStyle='#9ab9de';x.beginPath();x.moveTo(0,GY);for(let i=0;i<=W;i+=24)x.lineTo(i,GY-120-Math.sin(i*.007+1)*55-Math.sin(i*.021)*18);x.lineTo(W,GY);x.fill();
  x.fillStyle='#fff';x.globalAlpha=.55;for(let i=0;i<=W;i+=24){const hgt=120+Math.sin(i*.007+1)*55+Math.sin(i*.021)*18;if(hgt>150){x.beginPath();x.moveTo(i-12,GY-hgt+14);x.lineTo(i,GY-hgt-2);x.lineTo(i+12,GY-hgt+14);x.fill()}}x.globalAlpha=1;
  x.fillStyle='#7ea3cd';x.beginPath();x.moveTo(0,GY);for(let i=0;i<=W;i+=20)x.lineTo(i,GY-70-Math.sin(i*.011+3)*38-Math.sin(i*.04)*8);x.lineTo(W,GY);x.fill();
  // distant city
  x.fillStyle='#8fb0d4';for(let i=0;i<W;i+=26){const h=22+(hsh(i,7)%46);x.fillRect(i,GY-48-h*.6,18,h*.6+48)}
  // rolling hills + trees
  x.fillStyle='#78bf68';x.beginPath();x.moveTo(0,GY);for(let i=0;i<=W;i+=16)x.lineTo(i,GY-30-Math.sin(i*.013)*18);x.lineTo(W,GY);x.fill();
  for(let i=14;i<W;i+=58+(hsh(i,3)%40)){if(i>520&&i<880)continue;const hh=GY-22-Math.sin(i*.013)*18,s=.8+(hsh(i,1)%5)*.12;
    x.fillStyle='#6b4a2b';x.fillRect(i-3,hh-8*s,6,12*s);x.fillStyle=(hsh(i,2)%2)?'#3f9e4a':'#4cae50';x.beginPath();x.arc(i,hh-20*s,16*s,0,7);x.arc(i-10*s,hh-12*s,11*s,0,7);x.arc(i+10*s,hh-12*s,11*s,0,7);x.fill()}
  // ground
  g=x.createLinearGradient(0,GY,0,H);g.addColorStop(0,'#69bb4f');g.addColorStop(.07,'#4f9c3b');g.addColorStop(.075,'#7b5434');g.addColorStop(1,'#4d311d');x.fillStyle=g;x.fillRect(0,GY,W,H-GY);
  for(let i=0;i<260;i++){const px=hsh(i,11)%W,py=GY+14+(hsh(i,12)%(H-GY-14));x.fillStyle=(i%3)?'rgba(0,0,0,.18)':'rgba(255,220,170,.12)';x.fillRect(px,py,2+(i%3),2)}
  for(let i=0;i<24;i++){const px=hsh(i,21)%W,py=GY+18+(hsh(i,22)%(H-GY-22));x.fillStyle='#8a8478';x.beginPath();x.ellipse(px,py,4+(i%4),3,0,0,7);x.fill()}
  for(let i=0;i<W;i+=5){x.fillStyle=(hsh(i,5)%2)?'#3f8a31':'#5fb14a';const hh=3+(hsh(i,6)%5);x.fillRect(i,GY-hh+3,2,hh)}
  for(let i=0;i<30;i++){const px=hsh(i,31)%W;if(px>40&&px<200)continue;x.fillStyle=['#ff6b8a','#ffd23f','#fff'][i%3];x.beginPath();x.arc(px,GY-1,2,0,7);x.fill()}
  // fence
  x.fillStyle='#e8dcc4';x.strokeStyle='#8a7a5a';x.lineWidth=1;for(let i=300;i<560;i+=18){x.fillRect(i,GY-20,8,22);x.strokeRect(i,GY-20,8,22)}x.fillRect(300,GY-14,260,4);x.fillRect(300,GY-6,260,4);
}
const clouds=[{x:100,y:70,s:1,v:6},{x:430,y:48,s:.8,v:4},{x:660,y:110,s:1.1,v:8},{x:-120,y:140,s:.9,v:5}];

// =====================================================================
//  WORLD BUILDING
// =====================================================================
function set(x,y,m){if(!inb(x,y))return;const i=idx(x,y);grid[i]=m;hp[i]=m?MAT[m].hp:0;anch[i]=0}
function rect(x,y,w,h,m){for(let j=0;j<h;j++)for(let i=0;i<w;i++)set(x+i,y+j,m)}
function house(o){
  const{x,w,floors,fh=9,wall,floor,roof,gable,paper='#e8d3a8',crenel,g=ROWS-1}=o,top=g+1-(floors*fh+1);
  for(let f=0;f<=floors;f++)rect(x,g-f*fh,w,1,floor);
  for(let f=0;f<floors;f++){const yb=g-f*fh;interiors.push({x:x+1,y:yb-fh+1,w:w-2,h:fh-1,p:paper});
    for(let y=yb-fh+1;y<yb;y++){set(x,y,wall);set(x+w-1,y,wall);if(w>13)set(x+(w>>1),y,wall===6?6:1)}
    for(let y=yb-5;y<yb-3;y++){set(x,y,4);set(x+w-1,y,4)}}
  if(gable){for(let k=0;k<7&&w+2-2*k>1;k++)rect(x-1+k,top-1-k,w+2-2*k,1,roof)}
  else rect(x-1,top-2,w+2,2,roof);
  if(crenel){for(let k=0;k<w+2;k+=2)set(x-1+k,top-3,roof)}
}
const tnt=(x,y)=>rect(x,y-2,2,2,5);
function mound(x,width,height){for(let r=0;r<height&&width-2*r>0;r++)rect(x+r,ROWS-1-r,width-2*r,1,SAND)}
const tgt=(cx,row)=>targets.push({x:cx*V+V/2,y:row*V-7,vy:0,r:7,alive:true,t:rnd()*6});
const LEVELS=[
 {name:'Suburban Eviction',men:4,build(){
   house({x:76,w:16,floors:2,wall:2,floor:1,roof:1,gable:true});tgt(81,59);tgt(90,50);tnt(86,59)}},
 {name:'Duplex Dilemma',men:5,build(){
   house({x:58,w:12,floors:2,wall:1,floor:1,roof:1,gable:true,paper:'#cfe0c0'});
   house({x:80,w:16,floors:3,wall:2,floor:1,roof:2,gable:true});
   tgt(63,59);tgt(66,50);tgt(84,59);tgt(90,50);tgt(86,41);tnt(92,59);tnt(62,50)}},
 {name:'Tower Block Tussle',men:6,build(){
   house({x:62,w:10,floors:2,wall:1,floor:1,roof:1,gable:true,paper:'#f0c9c9'});
   house({x:82,w:14,floors:6,wall:2,floor:3,roof:3,paper:'#cdd7e6'});
   tgt(66,59);tgt(67,50);tgt(87,59);tgt(93,41);tgt(86,23);tnt(85,32);tnt(92,50)}},
 {name:'Castle Foreclosure',men:6,build(){
   house({x:52,w:8,floors:4,wall:3,floor:3,roof:3,gable:true,paper:'#b9b2c8'});
   house({x:64,w:26,floors:3,wall:3,floor:3,roof:3,crenel:true,paper:'#b9b2c8'});
   house({x:92,w:8,floors:4,wall:3,floor:3,roof:3,gable:true,paper:'#b9b2c8'});
   tgt(55,41);tgt(68,59);tgt(73,50);tgt(83,59);tgt(95,32);tnt(84,59);tnt(70,41)}},
 {name:'Corporate Takeover',men:7,build(){
   house({x:54,w:12,floors:3,wall:2,floor:1,roof:2,gable:true,paper:'#f0e0a8'});
   house({x:76,w:20,floors:5,wall:6,floor:3,roof:6,paper:'#cfd8e6'});
   tgt(59,59);tgt(62,50);tgt(80,59);tgt(90,50);tgt(84,41);tgt(92,32);tgt(82,23);tnt(88,59);tnt(80,32);tnt(92,23)}},
 {name:'Bouncy Castle',men:6,build(){   // rubber walls: the man rebounds - come in through the wooden roofs or use TNT
   house({x:54,w:14,floors:3,wall:RUBBER,floor:WOOD,roof:WOOD,gable:true,paper:'#f0c9d9'});
   house({x:78,w:14,floors:4,wall:RUBBER,floor:BRICK,roof:WOOD,gable:false,paper:'#cfe0f0'});
   tgt(59,59);tgt(63,50);tgt(59,41);tgt(83,59);tgt(87,50);tgt(83,41);tgt(87,32);tnt(64,59);tnt(88,41)}},
 {name:'Sandcastle Shakedown',men:7,build(){   // houses perched on sand: dig out the foundations and everything slumps
   mound(46,30,9);house({x:56,g:50,w:10,floors:2,wall:STONE,floor:WOOD,roof:STONE,gable:true,paper:'#cfe0c0'});
   mound(86,28,9);house({x:95,g:50,w:10,floors:2,wall:BRICK,floor:WOOD,roof:WOOD,gable:true,paper:'#f0e0a8'});
   tgt(60,50);tgt(62,41);tgt(99,50);tgt(101,41);tgt(76,59);tnt(58,59);tnt(98,59)}}];

function load(l){
  level=l;grid=new Uint8Array(COLS*ROWS);hp=new Float32Array(COLS*ROWS);anch=new Uint8Array(COLS*ROWS);
  ox=new Float32Array(COLS*ROWS);oy=new Float32Array(COLS*ROWS);ovx=new Float32Array(COLS*ROWS);ovy=new Float32Array(COLS*ROWS);brk=new Uint8Array(COLS*ROWS);wobOn=false;wobQuiet=0;sandOn=true;sandT=0;crackEv=0;
  chunks=[];parts=[];texts=[];targets=[];interiors=[];explQ=[];state='play';winT=loseT=0;men=LEVELS[l].men;score=0;shownScore=0;banner=2.4;waitT=0;
  LEVELS[l].build();
  supportPass();for(const ch of chunks)settleRaw(ch,true);chunks=[];
  man={mode:'none',x:-999,y:-999,t:0,a:1,R:14};nextMan();

const JIG_GAIN=.45,JIG_RGAIN=.35,JIG_MAX=1.5,JVIS=.5;      // JVIS = how much of a cell shows on screen (1 cell would be a huge 16 design units)
function jigNew(){return{px:0,py:0,vx:0,vy:0,has:false,bx:0,by:0,bvx:0,bvy:0,rx:0,ry:0,rvx:0,rvy:0,sq:0,sa:0,st:0,pk:0}}
function jigStep(m,dt){
  const j=m.jg;if(!j||dt<=0)return;
  if(m.mode==='none'||m.mode==='wait'||m.mode==='done')return;
  const px=m.x/V,py=m.y/V;
  if(!j.has){j.has=true;j.px=px;j.py=py;return}
  const vx=(px-j.px)/dt,vy=(py-j.py)/dt;
  const pvx=j.vx,pvy=j.vy,dvx=vx-pvx,dvy=vy-pvy-(m.mode==='fly'?G/V*dt:0);
  j.px=px;j.py=py;j.vx=vx;j.vy=vy;
  const mag=Math.abs(dvx)+Math.abs(dvy);
  if(mag<150){                                              // bigger than that is a respawn jump, not an impact
    j.bvx-=dvx*JIG_GAIN;j.bvy-=dvy*JIG_GAIN;j.rvx-=dvx*JIG_RGAIN;j.rvy-=dvy*JIG_RGAIN;
    if(mag>20){j.sq=1;j.sa=Math.atan2(dvy,dvx);j.st=(dvx*pvx+dvy*pvy)>=0?1:0;       // speeding up = stretch, slamming into something = squash
      if(!j.st&&(m.mode==='fly'||m.mode==='stuck'))SFX.jiggle()}}
  j.bvx+=(-400*j.bx-7*j.bvx)*dt;j.bvy+=(-400*j.by-7*j.bvy)*dt;
  j.rvx+=(-250*j.rx-6*j.rvx)*dt;j.rvy+=(-250*j.ry-6*j.rvy)*dt;
  j.bx=clamp(j.bx+j.bvx*dt,-JIG_MAX,JIG_MAX);j.by=clamp(j.by+j.bvy*dt,-JIG_MAX,JIG_MAX);
  j.rx=clamp(j.rx+j.rvx*dt,-JIG_MAX,JIG_MAX);j.ry=clamp(j.ry+j.rvy*dt,-JIG_MAX,JIG_MAX);
  j.sq*=Math.pow(.88,dt*60);
  if(!isFinite(j.bx+j.by+j.rx+j.ry+j.bvx+j.bvy+j.rvx+j.rvy+j.sq)){const k=j.has;Object.assign(j,jigNew());j.has=k;j.px=px;j.py=py}
  const bm=Math.hypot(j.bx,j.by);if(bm>j.pk)j.pk=bm}
// springs (cells) -> offsets in the figure's own drawing units (what drawFront/drawSide/drawBall expect)
function jigOpts(j,sx,sy,ang){
  if(!j)return null;
  const c=Math.cos(-ang),s=Math.sin(-ang),K=V*JVIS;
  const bo=[(j.bx*c-j.by*s)*K/sx,(j.bx*s+j.by*c)*K/sy],ro=[(j.rx*c-j.ry*s)*K/sx,(j.rx*s+j.ry*c)*K/sy];
  return{bo,ro,bs:[1+.006*(Math.abs(bo[1])-Math.abs(bo[0])),1+.006*(Math.abs(bo[0])-Math.abs(bo[1]))]}}
function jigSquash(j){if(j&&j.sq>.02){const k=j.sq*.12;ctx.rotate(j.sa);if(j.st)ctx.scale(1+k,1-k*.7);else ctx.scale(1-k,1+k*.8);ctx.rotate(-j.sa)}}

  sleepAfter:20,sleepFrames:['SLEEP_A','SLEEP_B'],sleepPeriod:.7};   // after ~20 s untouched he dozes off (snore on SLEEP_B)

// ---- gag engine.  One state object per man (Q); the host sets Q.ox/oy (body centre in world px), Q.sc (draw scale) and Q.jg (jiggle springs or null)
function gagNew(gmin,gmax,first){return{gag:null,gi:-1,step:0,st:0,idleT:0,quiet:0,gap:first,gmin,gmax,last:-1,asleep:false,sleepT:0,sph:0,done:0,ws:1,ox:0,oy:0,sc:1,jg:null}}
function gagReset(Q){if(!Q)return;Q.gag=null;Q.idleT=0;Q.quiet=0;Q.gap=MAN_IDLE.delay;Q.asleep=false;Q.sleepT=0}     // any touch: he snaps back to attention
function gagStart(Q,i){Q.gag=MAN_GAGS[i];Q.gi=i;Q.last=i;Q.step=0;Q.st=0;gagFx(Q,Q.gag.steps[0][2])}
function gagTick(Q,dt,canSleep){
  Q.idleT+=dt;
  if(Q.gag){Q.st+=dt;
    while(Q.gag&&Q.st>=Q.gag.steps[Q.step][1]){Q.st-=Q.gag.steps[Q.step][1];Q.step++;
      if(Q.step>=Q.gag.steps.length){Q.gag=null;Q.quiet=0;Q.gap=Q.gmin+rnd()*(Q.gmax-Q.gmin);Q.done++;break}
      gagFx(Q,Q.gag.steps[Q.step][2])}
    return}
  if(canSleep&&Q.idleT>=MAN_IDLE.sleepAfter){
    if(!Q.asleep){Q.asleep=true;Q.sleepT=0;Q.sph=0}
    Q.sleepT+=dt;const ph=Math.floor(Q.sleepT/MAN_IDLE.sleepPeriod)%2;
    if(ph!==Q.sph){Q.sph=ph;if(ph===1)gagFx(Q,'snore')}
    return}
  Q.quiet+=dt;
  if(Q.quiet>=Q.gap){let i;do{i=(rnd()*MAN_GAGS.length)|0}while(i===Q.last&&MAN_GAGS.length>1);gagStart(Q,i)}}
function gagFrame(Q){if(!Q)return null;if(Q.gag)return Q.gag.steps[Q.step][0];if(Q.asleep)return MAN_IDLE.sleepFrames[Q.sph];return null}
// fx: sound + particles + a kick on the belly/rear springs.  Positions are given in the figure's drawing units and mapped to the screen.
const gw=(Q,ux,uy)=>[Q.ox+ux*Q.sc,Q.oy+uy*Q.sc];
function gagKick(Q,bx,by,rx,ry){const j=Q.jg;if(!j)return;j.bvx+=bx;j.bvy+=by;j.rvx+=rx;j.rvy+=ry}

  for(let i=0;i<4;i++)P({k:6,x:x+(rnd()-.5)*12,y:y+6,vx:(rnd()-.5)*50,vy:-20-rnd()*20,l:1+rnd()*.4,l0:1.4,s:5*Math.max(1,Q.sc*.6),c:'#a6d63c'});popText(x,y-26*Q.sc,'BUUURP!','#b6e05a',22)},

  for(let i=0;i<4;i++)P({k:9,x:x+(i-1.5)*14*k,y:y-14*k,vx:(rnd()-.5)*10,vy:-34-rnd()*22,l:1.4,l0:1.4,ph:rnd()*6});popText(x+46*k,y+2*k,'PFFFT!','#b6e05a',24)},

 yawn(Q){SFX.yawn()},

const titleG=gagNew(1,2,.8);
function titleTick(dt){const Q=titleG;Q.ox=W/2;Q.oy=H/2+60;Q.sc=2.1;Q.jg=null;gagTick(Q,dt,false);updParts(dt);updTexts(dt)}

function renderMan(){
  const m=man;if(m.mode==='none'||m.mode==='wait'||m.mode==='done')return;
  const j=m.jg||null;
  if(m.mode==='stuck'){ctx.save();ctx.globalAlpha=m.a;drawGooSplat(m.t,m.x,m.y);ctx.translate(m.x,m.y);
    const wob=Math.sin(m.t*26)*Math.exp(-m.t*3.2);            // rocks from side to side for about a second after landing
    ctx.rotate(wob*.17);jigSquash(j);
    const sx=.56*(1-wob*.05),sy=.45*(1+wob*.07);ctx.scale(sx,sy);
    JIG=jigOpts(j,sx,sy,wob*.17);drawFront('star','dizzy',time);JIG=null;ctx.restore();return}
  ctx.save();ctx.translate(m.x,m.y);jigSquash(j);
  if(m.mode==='aim'){const sc=.5*(1+m.pop*.5),a=Math.atan2(SY-m.y,SX-m.x)*.25,sy=sc*(dragging?.94:1);
    ctx.rotate(a);ctx.scale(sc,sy);JIG=jigOpts(j,sc,sy,a);
    const fn=dragging?null:gagFrame(m.G),sp=fn&&spinLive(m.G);
    if(sp)drawSpin(sp.th,sp);else if(fn)drawManFrame(fn);else drawFront('up',dragging?'scream':'cool',time);
    JIG=null}
  else if(m.dive){ctx.rotate(m.spin);ctx.scale(.62,.62);JIG=jigOpts(j,.62,.62,m.spin);drawBall(time,'scream');JIG=null}
  else{ctx.rotate(m.ang);ctx.scale(.64,.64);JIG=jigOpts(j,.64,.64,m.ang);drawSide(time,'scream');JIG=null}
  ctx.restore()}
function drawLandlord(t){
  const bob=Math.sin(t.t*5)*.8;ctx.save();ctx.translate(t.x,t.y+bob);ctx.scale(1.15,1.15);
  ell(0,4,7.2,8.6,'#4a5568',1.4);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-2.6,-3);ctx.lineTo(2.6,-3);ctx.lineTo(0,3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d12b2b';ctx.beginPath();ctx.moveTo(-1.4,-2);ctx.lineTo(1.4,-2);ctx.lineTo(1.8,6);ctx.lineTo(0,8);ctx.lineTo(-1.8,6);ctx.closePath();ctx.fill();
  ell(0,-8,6.2,6.4,'#f2c7a1',1.4);ell(-6,-8,1.6,2.2,'#f2c7a1');ell(6,-8,1.6,2.2,'#f2c7a1');
  ctx.fillStyle='#111';ctx.fillRect(-7,-17,14,2);ctx.fillRect(-4.6,-24,9.2,7.5);ctx.fillStyle='#d12b2b';ctx.fillRect(-4.6,-19.5,9.2,1.8);
  ell(-2.3,-8.8,1.7,1.7,'#fff',.8);ell(2.3,-8.8,1.7,1.7,'#fff',.8);ell(-2.3,-8.8,.6,.6,'#111');ell(2.3,-8.8,.6,.6,'#111');
  ctx.strokeStyle='#222';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(-4.5,-11.5);ctx.lineTo(-1,-10.3);ctx.moveTo(4.5,-11.5);ctx.lineTo(1,-10.3);ctx.moveTo(-2.6,-4.6);ctx.quadraticCurveTo(0,-6.4,2.6,-4.6);ctx.stroke();
  ctx.fillStyle='#fff';ctx.save();ctx.translate(8,2);ctx.rotate(.3);ctx.fillRect(0,-4,6,8);ctx.strokeStyle='#999';ctx.lineWidth=.7;ctx.strokeRect(0,-4,6,8);ctx.fillStyle='#2a8a2a';ctx.fillRect(1.4,-1.5,3,1);ctx.restore();

function txt(s,x,y,size,fill,align,stroke){ctx.font=`bold ${size}px "Trebuchet MS",Impact,sans-serif`;ctx.textAlign=align||'left';ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle=stroke||'#000';ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=fill;ctx.fillText(s,x,y)}
function drawCloud(c){ctx.globalAlpha=.9;ctx.fillStyle='#fff';const r=34*c.s;ctx.beginPath();ctx.arc(c.x,c.y,r,0,7);ctx.arc(c.x+r*.9,c.y+6,r*.75,0,7);ctx.arc(c.x-r*.9,c.y+9,r*.65,0,7);ctx.arc(c.x+r*.2,c.y-r*.4,r*.7,0,7);ctx.fill();ctx.globalAlpha=1}
function drawSling(back){
  ctx.lineCap='round';
  if(back){ctx.strokeStyle='#4a2e14';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(SX+4,SY+34);ctx.lineTo(SX+13,SY+24);ctx.stroke();return}
  ctx.strokeStyle='#4a2e14';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(SX,GY+2);ctx.lineTo(SX,SY+44);ctx.stroke();
  ctx.strokeStyle='#7a5230';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(SX,GY);ctx.lineTo(SX,SY+44);ctx.stroke();
  ctx.strokeStyle='#4a2e14';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(SX,SY+44);ctx.lineTo(SX-12,SY+22);ctx.stroke();
  ctx.strokeStyle='#8f6238';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(SX,SY+44);ctx.lineTo(SX-12,SY+22);ctx.stroke()}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bgA,0,0);for(const c of clouds)drawCloud(c);ctx.drawImage(bgB,0,0);
  if(state==='title'){drawTitle();return}
  ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  for(const r of interiors){ctx.fillStyle=r.p;ctx.fillRect(r.x*V,r.y*V,r.w*V,r.h*V);ctx.fillStyle='rgba(0,0,0,.07)';for(let k=0;k<r.w*V;k+=16)ctx.fillRect(r.x*V+k,r.y*V,8,r.h*V);
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(r.x*V,(r.y+r.h)*V-5,r.w*V,5)}
  drawSling(true);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const i=idx(x,y),m=grid[i];if(!m)continue;const r=hp[i]/MAT[m].hp;let px=x*V,py=y*V;
    if(wobOn){px=Math.round(px+ox[i]*V);py=Math.round(py+oy[i]*V)}   // swaying with the wobble
    ctx.drawImage(SPR[m][hsh(x,y)&3][r>.66?0:r>.33?1:2],px,py);
    if(brk[i]){ctx.fillStyle=m===GLASS?'rgba(255,255,255,.95)':'rgba(15,8,4,.8)';const b=brk[i];   // snapped joints show as cracks
      if(b&1)ctx.fillRect(px+6,py+1,2,3);if(b&2)ctx.fillRect(px,py+4,2,3);if(b&4)ctx.fillRect(px+3,py+6,4,2);if(b&8)ctx.fillRect(px+1,py,4,2)}}
  for(const ch of chunks){ctx.save();ctx.translate(ch.x,ch.y);ctx.rotate(ch.ang);for(const a of ch.cells){const r=a.h/MAT[a.m].hp;ctx.drawImage(SPR[a.m][(a.lx*7+a.ly*3|0)&3][r>.66?0:r>.33?1:2],-V/2+a.lx,-V/2+a.ly)}ctx.restore()}
  for(const t of targets)if(t.alive){const[tx,ty]=targetOffset(t);ctx.save();ctx.translate(tx,ty);drawLandlord(t);ctx.restore()}
  // sling band behind man
  if(man.mode==='aim'){ctx.strokeStyle='#2a160a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(SX+13,SY+24);ctx.lineTo(man.x+4,man.y+6);ctx.stroke()}
  if(man.mode==='aim'&&dragging){const vx=(SX-man.x)*9.2,vy=(SY-man.y)*9.2;for(let t=.06,i=0;t<1.7;t+=.075,i++){ctx.fillStyle=`rgba(255,255,255,${.9-i*.035})`;ctx.beginPath();ctx.arc(man.x+vx*t,man.y+vy*t+450*t*t,3.4-i*.07,0,7);ctx.fill()}}
  renderMan();
  if(man.mode==='aim'){ctx.strokeStyle='#2a160a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(SX-12,SY+22);ctx.lineTo(man.x-2,man.y+6);ctx.stroke()}
  drawSling(false);
  drawParts();drawTexts();
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,240,200,${flash*.9})`;ctx.fillRect(0,0,W,H)}
  drawHUD()}
function drawHUD(){
  ctx.fillStyle='rgba(15,18,30,.72)';ctx.fillRect(0,0,W,34);ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,0,W,2);
  txt(`LV ${level+1}  ${LEVELS[level].name.toUpperCase()}`,12,24,18,'#ffd23f','left');
  const lb=aliveTargets();txt(`LANDLORDS ${lb}/${targets.length}`,430,24,18,lb?'#ff8a8a':'#7dff5a','left');
  txt(String(Math.round(shownScore)).padStart(6,'0'),W-12,24,20,'#fff','right');
  for(let i=0;i<men;i++){const x=300+i*20;ell(x,15,6,6.5,SK,1.2);ctx.fillStyle=HAIR;ctx.fillRect(x-4,18,8,2.2);ctx.fillStyle=HAIR;ctx.beginPath();ctx.arc(x,11,6,3.3,6.1);ctx.fill()}
  txt('MEN',270,24,12,'#bbb','left');
  if(hint>0&&state==='play'&&man.mode==='aim'){ctx.globalAlpha=.7+.3*Math.sin(time*5);txt('DRAG BACK  &  RELEASE!',SX+80,SY-60,22,'#fff','center');ctx.globalAlpha=1}
  if(man.mode==='fly'&&!man.dive){ctx.globalAlpha=.8;txt('TAP = BELLY FLOP',W/2,H-18,16,'#fff','center');ctx.globalAlpha=1}
  if(banner>0&&state==='play'){ctx.globalAlpha=Math.min(1,banner);txt(LEVELS[level].name,W/2,180,40,'#fff','center');txt('Evict every landlord!',W/2,214,20,'#ffd23f','center');ctx.globalAlpha=1}
  if(state==='win'||state==='lose')drawEnd()}
function star(x,y,r,on){ctx.fillStyle=on?'#ffd23f':'#3a3f55';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<10;i++){const a=-1.5708+i*.6283,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.stroke();ctx.fill()}
function drawEnd(){
  ctx.fillStyle='rgba(8,10,20,.72)';ctx.fillRect(0,0,W,H);const win=state==='win';
  ctx.save();ctx.translate(W/2-250,H/2+20);ctx.scale(.9,.9);
  if(win){const ph=time*14,sw=Math.sin(ph);                 // butt-wiggle victory dance, with a little hop
    ctx.translate(0,-Math.abs(Math.sin(time*7))*10);
    JIG={bo:[-Math.sin(ph-1.2)*2.5,Math.cos(ph*.5)*1.5],ro:[sw*5.5,-Math.abs(Math.cos(ph))*2],bs:[1,1]};
    drawManFrame(sw>.33?'BACK_R':sw<-.33?'BACK_L':'BACK_C');JIG=null}
  else{drawManFrame('SAD');                                  // sad pose, tears running down
    for(const sd of[-1,1])for(let k=0;k<2;k++){const f=(time*.9+k*.5+(sd>0?.17:0))%1;ctx.globalAlpha=1-f;ctx.fillStyle='#7fd4ff';ctx.beginPath();ctx.arc(sd*9.4,-18+f*30,2.3,0,7);ctx.fill();ctx.globalAlpha=1}}
  ctx.restore();
  txt(win?'EVICTION COMPLETE!':'THE LANDLORDS LIVE...',W/2+80,190,38,win?'#7dff5a':'#ff6a6a','center');
  if(win){const st=men>=2?3:men>=1?2:1;for(let i=0;i<3;i++)star(W/2-10+i*70,260,28,i<st)}
  txt('SCORE  '+Math.round(score),W/2+80,330,28,'#fff','center');
  ctx.globalAlpha=.7+.3*Math.sin(time*4);txt(win?'click / tap for next level':'click / tap to retry',W/2+80,380,20,'#ffd23f','center');ctx.globalAlpha=1}
function drawTitle(){
  ctx.fillStyle='rgba(10,14,30,.35)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2+60+Math.sin(time*2)*4);ctx.scale(2.1,2.1);
  const tf=gagFrame(titleG),tsp=tf&&spinLive(titleG);if(tsp)drawSpin(tsp.th,tsp);else if(tf)drawManFrame(tf);else drawFront('flex','cool',time);ctx.restore();
  drawParts();drawTexts();
  ctx.save();ctx.translate(W/2,110);ctx.rotate(-.03);txt('MANDEX',0,0,96,'#ffd23f','center','#7a1a1a');ctx.restore();
  txt('the sticky dad-bod demolition derby',W/2,150,22,'#fff','center');
  ctx.globalAlpha=.65+.35*Math.sin(time*4);txt('CLICK / TAP TO START',W/2,H-40,26,'#fff','center');ctx.globalAlpha=1}

// =====================================================================
//  INPUT / LOOP
// =====================================================================
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('pointerdown',e=>{
  audioInit();if(man.G)gagReset(man.G);const[x,y]=pt(e);
  if(state==='title'){load(0);return}
  if(state==='win'){load((level+1)%LEVELS.length);return}
  if(state==='lose'){load(level);return}
  if(man.mode==='aim'&&Math.hypot(x-man.x,y-man.y)<70){dragging=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  else dive()});
cv.addEventListener('pointermove',e=>{if(!dragging||man.mode!=='aim')return;gagReset(man.G);const[x,y]=pt(e);let dx=x-SX,dy=y-SY;const d=Math.hypot(dx,dy);if(d>PULL){dx*=PULL/d;dy*=PULL/d}man.x=SX+dx;man.y=SY+dy});
cv.addEventListener('pointerup',()=>{if(dragging){dragging=false;if(man.mode==='aim')launch()}});
addEventListener('keydown',e=>{audioInit();if(man.G)gagReset(man.G);
  if(e.code==='Space'){dive();e.preventDefault()}
  if(state==='title')return;
  if(e.key==='r'||e.key==='R')load(level);
  if(e.key==='n'||e.key==='N')load((level+1)%LEVELS.length);
  if(e.key==='m'||e.key==='M')muted=!muted});

buildSprites();buildBG();
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>

function paintCelCell(x,m,v,d){
  // The atlas is painted at 3x resolution; geometry remains exactly one voxel.
  const base=CEL_MATERIAL[m],s=v*17+13;
  x.save();x.scale(3,3);x.lineCap='round';x.lineJoin='round';
  if(m===4){
    const g=x.createLinearGradient(0,0,8,8);g.addColorStop(0,'rgba(196,239,246,.78)');g.addColorStop(.5,'rgba(94,153,182,.47)');g.addColorStop(1,'rgba(72,92,146,.68)');
    x.fillStyle=g;x.fillRect(0,0,8,8);x.strokeStyle='rgba(233,248,255,.8)';x.lineWidth=.65;
    x.beginPath();x.moveTo(.7,6.4);x.lineTo(6.5,.7);x.moveTo(4.5,7.4);x.lineTo(7.2,4.7);x.stroke();
  }else{
    const g=x.createLinearGradient(0,0,6,8);g.addColorStop(0,shade(base,40-v*3));g.addColorStop(.42,base);g.addColorStop(1,shade(base,-41+v*3));
    x.fillStyle=g;x.fillRect(0,0,8,8);x.fillStyle=shade(base,-54);x.fillRect(0,7.45,8,.55);x.fillRect(7.45,0,.55,8);
    x.strokeStyle=shade(base,37);x.lineWidth=.42;x.beginPath();x.moveTo(.4,7.1);x.lineTo(.4,.4);x.lineTo(7.2,.4);x.stroke();
    x.strokeStyle=shade(base,-24);x.lineWidth=.35;
    if(m===1){for(let j=0;j<3;j++){x.beginPath();x.moveTo(1.6+j*2.3,0);x.bezierCurveTo(2.6+j*2.3,2,0.7+j*2.3,5,2+j*2.3,8);x.stroke()}}
    else if(m===2){x.beginPath();x.moveTo(0,3.9);x.lineTo(8,3.9);x.moveTo(4,0);x.lineTo(4,3.9);x.moveTo(2,3.9);x.lineTo(2,8);x.stroke()}
    else if(m===5){x.fillStyle='#f5d9a0';x.fillRect(0,3,8,2);x.fillStyle='#652d31';for(let j=0;j<4;j++)x.fillRect(j*2,3,.7,2);x.fillStyle='#3f2938';x.fillRect(3.3,0,1.4,1)}
    else if(m===6){for(const xx of[1,6])for(const yy of[1,6]){x.fillStyle='#dde0dd';x.beginPath();x.arc(xx,yy,.45,0,7);x.fill()}}
    else if(m===7){x.strokeStyle='#f4c3b7';x.lineWidth=.75;x.strokeRect(1,1,6,6)}

const hgHW=d=>Math.min(14,3+Math.floor(d*.7));
function hourglass(c,rn,top,bot,sandTop){
  for(let r=top;r<=bot;r++){const hw=hgHW(Math.max(0,Math.abs(r-rn)-4)),glass=r<=rn+2,wm=glass?GLASS:STEEL,th=glass?2:3;   // a 9-row neck, glass to just under the waist, steel below
    for(let k=0;k<th;k++){set(c-hw-1-k,r,wm);set(c+hw+k,r,wm)}
    if(r>=sandTop&&r<rn-4)for(let x=c-hw;x<c+hw;x++)set(x,r,SAND)}}

function buildTrial(i){
  const a=TRIAL_META[i],digit=c=>c>=65&&c<=90?c-65:c>=97&&c<=122?c-71:c>=48&&c<=57?c+4:c===43?62:63,read=j=>{
    const off=Math.floor(j/3)*4,part=j%3,p=digit(TRIAL_BYTES.charCodeAt(off+part)),q=digit(TRIAL_BYTES.charCodeAt(off+part+1));
    return part===0?(p<<2)|(q>>4):part===1?((p&15)<<4)|(q>>2):((p&3)<<6)|q;
  },pals=["#e8d3a8","#d7dfe9","#d2b6b4","#b9d6be"],kinds=["","walker","thrower","bat","shield","sprinter","healer","boss"];
  for(let k=a[2],end=k+a[3]*5;k<end;k+=5)rect(read(k),read(k+1),read(k+2),read(k+3),read(k+4));
  for(let k=a[4],end=k+a[5]*5;k<end;k+=5)interiors.push({x:read(k),y:read(k+1),w:read(k+2),h:read(k+3),p:pals[read(k+4)]});
  for(let k=a[6],end=k+a[7]*4;k<end;k+=4)tgt(read(k),read(k+1),kinds[read(k+2)],read(k+3));
  for(let k=a[8],end=k+a[9]*3;k<end;k+=3)pads.push({x:read(k)*V,y:read(k+1)*V,w:read(k+2)*V});
  for(let k=a[10],end=k+a[11]*4;k<end;k+=4)tube('#ffb45d',read(k)*V,read(k+1)*V,read(k+2)*V,read(k+3)*V,0);
}
TRIAL_META.forEach((a,i)=>LEVELS.push({name:a[0],tip:a[1],men:a[12],walk:!!a[13],build(){buildTrial(i)}}));
// END MANDEX TRIAL DATA

// ---- pneumatic tubes ----
// Keep the orientation stable when the sling or tube fires left.
// Mirror the facing sprite, but pitch against abs(horizontal velocity),
// exactly as the shared console man_pose / mx_flight_face_update.
function flightFaceFor(vx,previous){
  return vx>12?1:vx< -12?-1:previous<0?-1:1;
}
function flightPitch(vx,vy){return Math.atan2(vy,Math.abs(vx))*.6}
// Exact integration of the angular acceleration across variable simulation dt.
function diveSpinIntegral(t){return t<.12?t*t/.24:t-.06}
function advanceDivePose(m,dt){
  const a=Math.max(0,m.diveAge||0),b=a+Math.max(0,dt);
  m.spin+=14*(diveSpinIntegral(b)-diveSpinIntegral(a));m.diveAge=b;
}
// The same 24-tick side/rear/side rebound accent as the console core.
function rearRollOffset(m){
  if(m.mode!=='fly'||!(m.rearT>0)||m.inf>0||m.bel>0)return 0;
  let k=Math.floor(Math.max(0,Math.min(.4,.4-m.rearT))*60+1e-7);
  if(k<1||k>=23)return 0;
  if(k>12)k=23-k;
  return Math.min(k,6);
}
function tubeStep(m,dt){
  if(m.tubeT>0)m.tubeT-=dt;
  if(m.tubeCd>0){m.tubeCd-=dt;return}
  for(const tb of tubes){if(Math.hypot(m.x-tb.ax,m.y-tb.ay)>tb.r)continue;
    ring(tb.ax,tb.ay,50,tb.col);SFX.whoosh();popText(tb.ax,tb.ay-34,'FWOOMP!',tb.col,24);
    m.x=tb.bx;m.y=tb.by;m.vx=Math.cos(tb.ang)*tb.sp;m.vy=Math.sin(tb.ang)*tb.sp;
    m.face=flightFaceFor(m.vx,m.face);m.ang=0; // blend into the new tube direction without a one-frame flip
    m.tubeT=.55;m.tubeCd=.35;tb.pulseAt=time;ring(tb.bx,tb.by,50,tb.col);SFX.pop();shake=Math.max(shake,3);break}}
function tubePulse(tb){
  const age=time-tb.pulseAt;
  if(!Number.isFinite(age)||age<0||age>=.45)return 0;
  const q=1-age/.45;return q*q;
}
// Animated guidance must follow surviving rubber rather than a deleted pad.
function drawPads(){
  for(const p of pads){
    const row=Math.floor(p.y/V),start=Math.floor(p.x/V),end=Math.ceil((p.x+p.w)/V);
    // Select the widest contiguous surviving run, leftmost on ties.
    // Averaging the two ends of a broken pad can point into empty space.
    let first=start,best=0,run=0;
    for(let x=start;x<end;x++){
      if(inb(x,row)&&grid[idx(x,row)]===RUBBER){
        if(++run>best){best=run;first=x-run+1}
      }else run=0;
    }
    if(!best)continue;
    const cx=(first+best/2)*V,half=Math.min(10,best*V/2);
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';
    for(let k=0;k<3;k++){
      const phase=(time*1.25+k/3)%1,y=p.y-12-phase*48;
      ctx.globalAlpha=.12+.78*Math.sin(Math.PI*phase);
      ctx.beginPath();ctx.moveTo(cx-half,y+6);ctx.lineTo(cx,y-6);ctx.lineTo(cx+half,y+6);ctx.stroke();
    }
    ctx.restore();
  }
}
function drawTubes(){
  tubes.forEach((tb,i)=>{
    const sw=Math.sin(time*1.3+i*2)*3,bx=tb.ax+sw,by=tb.ay-62+Math.sin(time*1.9+i)*3,pulse=tubePulse(tb);
    ctx.save();
    // rope from the balloon down to the mouth
    ctx.strokeStyle='#3a2a1a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx-9,by+26);ctx.lineTo(tb.ax-12,tb.ay-24);ctx.moveTo(bx+9,by+26);ctx.lineTo(tb.ax+12,tb.ay-24);ctx.stroke();
    // balloon
    ctx.fillStyle=tb.col;ctx.strokeStyle='#000';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(bx,by,27,31,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(bx-9,by-12,7,11,-.5,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(bx-5,by+30);ctx.lineTo(bx+5,by+30);ctx.lineTo(bx,by+36);ctx.closePath();ctx.fillStyle=tb.col;ctx.fill();ctx.stroke();
    txt('IN',bx,by+6,17,'#fff','center');
    // brass mouth with a swirl
    ctx.fillStyle='#2a2118';ctx.strokeStyle=tb.col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(tb.ax,tb.ay,26,0,7);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#c89a3a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(tb.ax,tb.ay,30,0,7);ctx.stroke();
    ctx.strokeStyle=tb.col;ctx.lineWidth=2.4;ctx.beginPath();
    for(let k=0;k<=60;k++){const a=k*.3+time*5,r=k*.37;const x=tb.ax+Math.cos(a)*r,y=tb.ay+Math.sin(a)*r;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.stroke();
    if(pulse>0){ctx.globalAlpha=pulse*.85;ctx.strokeStyle='#fff8d7';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(tb.ax,tb.ay,31+(1-pulse)*12,0,Math.PI*2);ctx.stroke()}
    ctx.restore();
    // brass nozzle stub on the wall of the room, with a coloured collar
    ctx.save();ctx.translate(tb.bx,tb.by);
    ctx.fillStyle='#c8963a';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.fillRect(-38,-11,32,22);ctx.strokeRect(-38,-11,32,22);
    ctx.fillStyle='#ffe08a';ctx.fillRect(-36,-9,28,5);
    ctx.fillStyle=tb.col;ctx.fillRect(-6,-13,11,26);ctx.strokeRect(-6,-13,11,26);
    if(pulse>0){ctx.globalAlpha=pulse*.9;ctx.strokeStyle='#fff8d7';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(8+(1-pulse)*25,0,3+(1-pulse)*5,15+(1-pulse)*7,0,0,Math.PI*2);ctx.stroke()}

//  UPDATE
// =====================================================================
function update(dt){
  if(state==='play')toolArm();
  crackEv=0;time+=dt;for(const c of clouds){c.x+=c.v*dt;if(c.x>WW+140)c.x=-160}
  if(outfitCur.rainbow)applyOutfit(outfitCur,time);
  if(state==='cutscene'){cutTick(dt);titleTick(dt);return}
  if(state==='title'||state==='edit'||UISTATES.includes(state)){titleTick(dt);return}
  if(freeze>0){freeze--;return}
  if(comboLeft>0){comboLeft=Math.max(0,comboLeft-dt);if(!comboLeft)combo=0}
  if(bankLeft>0)bankLeft=Math.max(0,bankLeft-dt);
  if(slow>0){slow-=dt;dt*=.4}
  if(banner>0)banner-=dt;if(flash>0)flash-=dt;
  if(man){if(man.hurtCd>0)man.hurtCd-=dt;if(man.stun>0)man.stun-=dt}
  shownScore+=(score-shownScore)*.15;
  if(man.mode==='aim'){man.pop=Math.max(0,man.pop-dt*4);const Q=man.G;if(man.chug)updChug(dt);
    if(dragging){gagReset(Q);if(man.vlv&&man.mode==='aim')airTick(man,dt);if(man.mode!=='aim')return;const pull=Math.hypot(man.x-SX,man.y-SY)/PULL;man.swT+=dt;if(pull>.7&&man.swT>.1){man.swT=0;sweat(man.x-2,man.y-24)}}
    else if(man.seated){man.x=VX;man.y=VY;airTick(man,dt)}
    else if(state==='play'){Q.ox=man.x;Q.oy=man.y;Q.sc=.5*(1+man.pop*.5);Q.jg=man.jg;gagTick(Q,dt,true)}}
  if(man.mode==='fly'){
    for(let i=0;i<8&&man.mode==='fly';i++)manStep(dt/8);
    if(man.mode==='fly'){const m=man;m.face=flightFaceFor(m.vx,m.face);
      m.ang+=(m.dive?0:(flightPitch(m.vx,m.vy)-m.ang)*.15);if(m.dive)advanceDivePose(m,dt);
      m.gooT+=dt;if(m.gooT>.04){m.gooT=0;if(parts.length<1200)parts.push({k:3,x:m.x-m.vx*.01,y:m.y-m.vy*.01,vx:-m.vx*.05+(rnd()-.5)*40,vy:(rnd()-.5)*40,l:.7,l0:.7,s:2+rnd()*2})}
      m.stT+=dt;if(m.stT>.2){m.stT=0;const c=Math.cos(m.ang),sn=Math.sin(m.ang);   // stink trail
        P({k:6,x:m.x+(-30*c-8*sn),y:m.y+(-30*sn+8*c),vx:-m.vx*.04+(rnd()-.5)*20,vy:-12-rnd()*16,l:.9+rnd()*.4,l0:1.3,s:5+rnd()*3,c:'#a6d63c'})}
      if(m.x>WW+100||m.x<-100||m.gt>9)m.mode='done'}
  }else if(man.mode==='stuck'){const m=man;m.t+=dt;m.gooT+=dt;if(m.burpT>0){m.burpT-=dt;if(m.burpT<=0)burpPop()}
    const by=Math.floor((m.y+m.R+2)/V),gx=Math.floor(m.x/V);
    if(m.t<1.8&&m.y+m.R<GY-2&&!(inb(gx,by)&&grid[idx(gx,by)]))m.y+=16*dt;
    if(m.gooT>.35){m.gooT=0;const cx=Math.floor(m.x/V),cy=Math.floor(m.y/V);for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++)damageCell(cx+i,cy+j,5);
      if(parts.length<1200)parts.push({k:3,x:m.x+(rnd()-.5)*24,y:m.y+10,vx:0,vy:20,l:.9,l0:.9,s:3})}
    for(const t of targets)if(t.alive&&Math.hypot(t.x-m.x,t.y-m.y)<m.R+t.r+6)killTarget(t);
    m.a=m.t>2?Math.max(0,1-(m.t-2)/.6):1;if(m.t>2.6){goo(m.x,m.y,20,240);SFX.pop();m.mode='done'}}
  if(man.mode==='walk'){walkStep(dt);walkTubeStep(man,dt);}
  if(man.burped&&man.bel>0)man.bel=Math.max(0,man.bel-dt*1.2);
  if(man.rearT>0)man.rearT=man.mode==='fly'?Math.max(0,man.rearT-dt):0;
  if(man.jg)jigStep(man,dt);
  if(man.jg&&(man.mode==='stuck'||man.mode==='fly'))ragStep(man,dt);
  if(man.mode==='done'){man={mode:'wait',x:-999,y:-999,t:0,a:1,R:14};waitT=0;aftershock()}
  if(CL.slings&&man.mode==='aim'&&!dragging&&!man.chug&&!man.seated&&!(man.stun>0)){const k0=slingK;zoneAdvance();if(slingK!==k0){man.x=SX;man.y=SY}}   // a district that fell apart after the last shot also moves you on
  if(man.mode==='wait'){waitT+=dt;if(waitT>.7&&(!busy()||waitT>3.5)){zoneAdvance();if(men>0)nextMan();else man={mode:'none',x:-999,y:-999,t:0,a:1,R:14}}}
  processExpl();
  if(needSupport)supportPass();
  for(const ch of chunks)if(ch.hasTnt){ch.tntImpact=0;ch.tntHit=null}
  for(let i=0;i<6;i++)stepChunks(dt/6);
  updateMovingTnt();
  processExpl(); // process detonations caused by late rubble contacts this frame
  cleanChunks(dt);
  if(wobOn){const n=Math.max(1,Math.min(8,Math.ceil(dt*180-.05)));for(let i=0;i<n;i++)wobStep(dt/n)}
  sandT++;if(sandOn&&sandT%3===0)sandStep();
  if(needSupport)supportPass();
  paperRoomUpdate();
  updTargets(dt);updCases(dt);
  updParts(dt);
  updTexts(dt);
  shake*=.9;
  if(state==='win'){endT+=dt;if(endT>.34){endT=0;SFX.wig()}}
  if(state==='play'){
    if(aliveTargets()===0){winT+=dt;if(winT>1.6){if(typeof relayAdvance==='function'&&relayAdvance())return;if(CL.slings)zoneAdvance(false);state='win';score+=men*3000;SFX.ding();onWin()}}
    else if(men===0&&man.mode==='none'){loseT+=dt;if((!busy()&&loseT>1.8)||loseT>15)state='lose'}}
}

//  Design units (x right, y down, z toward the viewer, origin = body centre), orthographic: screen = (x,y), depth = z.

// =====================================================================
//  JIGGLE: belly + rear hang off him on springs (cells; 1 cell = V px).  Fed by his acceleration, gravity taken out in flight.
//  Pure decoration: nothing in the physics reads these numbers.
// =====================================================================
const JIG_GAIN=.55,JIG_RGAIN=.42,JIG_MAX=1.8,JVIS=.5;      // JVIS = how much of a cell shows on screen (1 cell would be a huge 16 design units)
function jigNew(){return{sk:skNew(),px:0,py:0,vx:0,vy:0,has:false,bx:0,by:0,bvx:0,bvy:0,rx:0,ry:0,rvx:0,rvy:0,sq:0,sa:0,st:0,pk:0,fl:0,tau:0,slx:0,slv:0}}
function jigStep(m,dt){
  const j=m.jg;if(!j||dt<=0)return;
  if(m.mode==='none'||m.mode==='wait'||m.mode==='done')return;
  const px=m.x/V,py=m.y/V;
  if(!j.has){j.has=true;j.px=px;j.py=py;return}
  const vx=(px-j.px)/dt,vy=(py-j.py)/dt;
  const pvx=j.vx,pvy=j.vy,dvx=vx-pvx,dvy=vy-pvy-(m.mode==='fly'?G/V*dt:0);
  j.px=px;j.py=py;j.vx=vx;j.vy=vy;
  // BELLYPHYS: air makes the skin taut (stiffer, snappier); soda is a sloshing liquid mass (heavier swing, longer wobble, lags behind him)
  j.fl=stom(m);const air=Math.min(1,m.inf||0),sod=Math.min(1.4,m.bel||0);j.tau=air*1.2+Math.max(0,j.fl-1)*1.5;
  const mag=Math.abs(dvx)+Math.abs(dvy);
  if(mag<150){                                              // bigger than that is a respawn jump, not an impact
    j.bvx-=dvx*JIG_GAIN*(1+.5*sod);j.bvy-=dvy*JIG_GAIN*(1+.5*sod);j.slv-=dvx*.8;j.rvx-=dvx*JIG_RGAIN;j.rvy-=dvy*JIG_RGAIN;
    if(mag>20){j.sq=1;j.sa=Math.atan2(dvy,dvx);j.st=(dvx*pvx+dvy*pvy)>=0?1:0;       // speeding up = stretch, slamming into something = squash
      if(!j.st&&(m.mode==='fly'||m.mode==='stuck'))SFX.jiggle()}}
  j.slv+=(-90*j.slx-1.3*j.slv)*dt;j.slx=clamp(j.slx+j.slv*dt,-1.5,1.5);      // the soda: slow pendulum, barely damped
  const kb=400*(1+j.tau),cb=4.6*(1+.5*j.tau)*(1-.3*Math.min(1,sod));j.bvx+=j.slx*sod*70*dt;
  j.bvx+=(-kb*j.bx-cb*j.bvx)*dt;j.bvy+=(-kb*j.by-cb*j.bvy)*dt;
  j.rvx+=(-250*j.rx-4*j.rvx)*dt;j.rvy+=(-250*j.ry-4*j.rvy)*dt;
  j.bx=clamp(j.bx+j.bvx*dt,-JIG_MAX,JIG_MAX);j.by=clamp(j.by+j.bvy*dt,-JIG_MAX,JIG_MAX);
  j.rx=clamp(j.rx+j.rvx*dt,-JIG_MAX,JIG_MAX);j.ry=clamp(j.ry+j.rvy*dt,-JIG_MAX,JIG_MAX);
  skStep(j,dt,mag<150?dvx:0,mag<150?dvy:0);   // BODYPHYS
  j.sq*=Math.pow(.88,dt*60);
  if(!isFinite(j.bx+j.by+j.rx+j.ry+j.bvx+j.bvy+j.rvx+j.rvy+j.sq+j.slx+j.slv)){const k=j.has;Object.assign(j,jigNew());j.has=k;j.px=px;j.py=py}
  const bm=Math.hypot(j.bx,j.by);if(bm>j.pk)j.pk=bm}

// BODYPHYS v2 (frame-rate independent ragdoll)
// ===== BODYPHYS: soft skin + ragdoll limbs (cosmetic, nothing in the game physics reads these) =====
// Belly skin: a ring of SKN points.  The top of the ring is glued to the chest (pin ~1), the bottom hangs free (pin ~.1), so the belly
// wobbles and squashes but can never come off the torso.  Offsets are kept in cells in world orientation, like the other jiggle springs.
const SKN=14,SKPIN=[];for(let i=0;i<SKN;i++)SKPIN.push(clamp(.55-.5*Math.sin(i/SKN*6.2832),.12,.95));
function skNew(){const z=()=>new Array(SKN).fill(0);return{x:z(),y:z(),vx:z(),vy:z()}}
function skStep(j,dt,dvx,dvy){const q=j.sk;if(!q)return;
  for(let n=0;n<2;n++){const h=dt/2;
    for(let i=0;i<SKN;i++){const a=(i+SKN-1)%SKN,b=(i+1)%SKN,k=(50+650*SKPIN[i])*(1+(j.tau||0)),f=1-SKPIN[i];
      if(n===0){q.vx[i]-=dvx*.9*f;q.vy[i]-=dvy*.9*f}
      q.vx[i]+=(-k*q.x[i]-5*q.vx[i]+80*(q.x[a]+q.x[b]-2*q.x[i]))*h;q.vy[i]+=(-k*q.y[i]-5*q.vy[i]+80*(q.y[a]+q.y[b]-2*q.y[i]))*h}
    for(let i=0;i<SKN;i++){q.x[i]=clamp(q.x[i]+q.vx[i]*h,-1.4,1.4);q.y[i]=clamp(q.y[i]+q.vy[i]*h,-1.4,1.4)}}
  if(!isFinite(q.x[0]+q.y[3]+q.vx[5]+q.vy[8]))j.sk=skNew()}
// ring points of an ellipse + the spring offsets, rescaled about the centroid so the belly keeps its volume (squash = bulge)
function skPts(cx,cy,rx,ry,sk,bs,bdy){const P=[],R=[];let A0=0,A1=0,mx=0,my=0;
  for(let i=0;i<SKN;i++){const a=i/SKN*6.2832;let x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);if(bs){x*=bs[0];y=(y+2)*bs[1]-2+(bdy||0)}R.push([x,y]);P.push([x+sk[i][0],y+sk[i][1]])}
  for(let i=0;i<SKN;i++){const j=(i+1)%SKN;A0+=R[i][0]*R[j][1]-R[j][0]*R[i][1];A1+=P[i][0]*P[j][1]-P[j][0]*P[i][1];mx+=P[i][0];my+=P[i][1]}
  mx/=SKN;my/=SKN;const k=Math.pow(Math.abs(A0)/Math.max(1,Math.abs(A1)),.4);
  return P.map(p=>[mx+(p[0]-mx)*k,my+(p[1]-my)*k])}
function pSkin(P,fill){const p=new Path2D(),n=P.length;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.moveTo(P[0][0],P[0][1]);
  for(let i=0;i<n;i++){const a=P[(i+n-1)%n],b=P[i],c=P[(i+1)%n],d=P[(i+2)%n];
    p.bezierCurveTo(b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6,c[0]-(d[0]-b[0])/6,c[1]-(d[1]-b[1])/6,c[0],c[1]);
    x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[0]);y1=Math.max(y1,b[1])}
  p.closePath();return{p,fill,bb:[x0-3,y0-3,x1+3,y1+3]}}
// Ragdoll limbs: root -> mid -> end verlet chains in WORLD space.  The root is pinned to the body, a weak spring pulls each joint to the pose,
// gravity droops it, bone lengths hold, and joints are pushed out of solid voxels / the ground.  Landing in a wall, hands and feet rest on what is left.
const RAG_ST=[[-21.5,-20.5,-40,-28,-57,-36],[21.5,-20.5,40,-28,57,-36],[-10,24,-17,39,-26,55],[10,24,17,39,26,55]];   // armL armR legL legR of the 'star' pose
function ragFl(){const f=Math.sin(time*16);return[[-12,8,-27,12+f*2,-44,4+f*4],[-10,6,-24,16-f*2,-42,13-f*3]]}
function ragXf(m){if(m.mode==='stuck'){const w=Math.sin(m.t*26)*Math.exp(-m.t*3.2),a=w*.17;return{k:'st',a,sx:.56*(1-w*.05),sy:.45*(1+w*.07),c:Math.cos(a),s:Math.sin(a)}}

function rL(X,m,x,y){const dx=x-m.x,dy=y-m.y;return[(dx*X.c+dy*X.s)/X.sx,(-dx*X.s+dy*X.c)/X.sy]}
function ragHit(p){if(!solidAt(p.x,p.y))return;const gx=Math.floor(p.x/V),gy=Math.floor(p.y/V);let bx=0,by=0,bd=1e9,nx=0,ny=0;
  for(let d=1;d<=3&&bd>=1e9;d++)for(const[ox,oy]of[[-1,0],[1,0],[0,-1],[0,1]]){const cx=gx+ox*d,cy=gy+oy*d;if(solidAt(cx*V+V/2,cy*V+V/2))continue;
    const tx=ox?(ox<0?(cx+1)*V-.5:cx*V+.5):p.x,ty=oy?(oy<0?(cy+1)*V-.5:cy*V+.5):p.y,dd=Math.hypot(tx-p.x,ty-p.y);if(dd<bd){bd=dd;bx=tx;by=ty;nx=ox;ny=oy}}

// scene-to-scene transitions: fade, white, wipe (with a yellow edge), iris, or a straight cut
function cutTrans(tr,t){
  // A stable held fade, rather than moving wipes/irises that turn interiors
  // into seemingly unrelated rooms between adjacent compositions.
  if(t>=.34||tr==='cut')return;
  const fade=(1-t/.34)*(1-t/.34);
  ctx.fillStyle=tr==='white'?'rgba(255,255,255,'+fade+')':'rgba(8,10,20,'+fade+')';
  ctx.fillRect(0,0,W,H);
}

let CL=LEVELS[0],testing=false;
function encodeCells(g){const out=[];let cur=g[0],n=0;for(let i=0;i<g.length;i++){if(g[i]===cur)n++;else{out.push(cur,n);cur=g[i];n=1}}out.push(cur,n);return out}
// Custom levels retain their fixed 120-column geometry after the wide finale.
function decodeCells(a,width=COLS){
  const g=new Uint8Array(width*ROWS);let p=0;
  for(let i=0;i<a.length;i+=2){
    const m=a[i]|0,n=a[i+1]|0;
    for(let k=0;k<n&&p<g.length;k++)g[p++]=m>8?0:m;
  }
  return g;
}
function levelFromData(L){
  const width=120,g=decodeCells(L.c,width);
  return {cols:width,name:L.n,men:Math.max(1,Math.min(12,L.m|0||5)),
    custom:true,build(){
      for(let i=0;i<g.length;i++)if(g[i])set(i%width,(i/width)|0,g[i]);
      for(const[cx,row]of L.t)tgt(cx,row);
    }};
}
function startCustom(k){testing=false;load(-1,levelFromData(PD.custom[k]))}
// Shared-code validation is deliberately done only on import/export. The
// gameplay renderer, native ports, and 60 Hz simulation do not pay for it.
const MX_CODE_MAX=100000;
function validateSharedLevel(o){
  if(!o||typeof o!=='object'||Array.isArray(o))throw Error('Invalid level data');
  const width=120,c=o.c,t=o.t,total=width*ROWS;
  if(!Array.isArray(c)||c.length<2||c.length>total*2||c.length%2)
    throw Error('Invalid grid encoding');
  const g=new Uint8Array(total);let cells=0,solids=0;
  for(let i=0;i<c.length;i+=2){
    const m=c[i],run=c[i+1];
    if(!Number.isInteger(m)||m<0||m>8||
       !Number.isInteger(run)||run<=0||run>total-cells)
      throw Error('Invalid grid run');
    if(m){for(let j=cells;j<cells+run;j++)
      if(j%width<EMIN)throw Error('Sling area must be clear');
      solids+=run;g.fill(m,cells,cells+run)}
    cells+=run;
  }
  if(cells!==total||solids<8)throw Error('Level needs at least 8 solid cells');
  if(!Array.isArray(t)||t.length<1||t.length>12)
    throw Error('Place between 1 and 12 landlords');
  const seen=new Set();
  for(const pos of t){
    if(!Array.isArray(pos)||pos.length!==2)throw Error('Invalid landlord position');
    const x=pos[0],row=pos[1];
    if(!Number.isInteger(x)||!Number.isInteger(row)||
       x<EMIN||x>=width||row<1||row>ROWS||
       g[(row-1)*width+x]!==0)
      throw Error('Landlord outside playable empty space');
    const key=(row-1)*width+x;
    if(seen.has(key))throw Error('Duplicate landlord');
    seen.add(key);
  }
  const men=o.m==null?5:o.m;
  if(!Number.isInteger(men)||men<1||men>12)throw Error('Invalid player count');
  if(o.n!=null&&typeof o.n!=='string')throw Error('Invalid level name');
  return {n:(o.n||'Imported').trim().slice(0,24)||'Imported',
          m:men,c:c.slice(),t:t.map(p=>p.slice())};
}
function encodeSharedLevel(L){
  const v=validateSharedLevel(L);
  const bytes=new TextEncoder().encode(JSON.stringify(v));
  let binary='';
  for(let i=0;i<bytes.length;i+=8192)
    binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  const code='MX1.'+btoa(binary);
  if(code.length>MX_CODE_MAX)throw Error('Level code too large');
  return code;
}
function decodeSharedLevel(code){
  if(typeof code!=='string'||code.length>MX_CODE_MAX||
     !code.startsWith('MX1.')||code.length<8)throw Error('Invalid level code');
  const binary=atob(code.slice(4));
  let json;
  try{
    const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
    json=new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  }catch(e){
    // Older MX1 codes stored Latin-1 bytes directly, before UTF-8 export.
    json=binary;
  }
  return validateSharedLevel(JSON.parse(json));
}
function exportCode(L){
  let code;
  try{code=encodeSharedLevel(L)}
  catch(e){toast('ach','Cannot share this level',e.message);return ''}
  ST().exported++;pdTouch();achCheck();
  try{if(navigator.clipboard&&navigator.clipboard.writeText)
    Promise.resolve(navigator.clipboard.writeText(code)).catch(()=>{})}catch(e){}
  try{prompt('Level code (copied if your browser allows). Send it to a friend:',code)}catch(e){}
  return code;
}
function importCode(){
  let s=null;try{s=prompt('Paste a level code:')}catch(e){}if(!s)return;
  try{
    const L=decodeSharedLevel(s.trim());
    PD.custom.push(L);pdTouch();
    if(!pdSave()){
      PD.custom.pop(); // Never claim an import survived a failed storage write.
      toast('ach','Level not imported','Browser storage unavailable; your original code is still safe');
      return;
    }
    toast('outfit','Level imported',L.n);
  }catch(e){toast('ach','That code did not work',e.message||'Invalid code')}
}

const EMIN=28;   // columns left of this stay empty: the sling lives there

function openEditor(back,which){
  testing=false;state='edit';hits=[];
  // Editor grids are always 120×60, even after the 360-column finale.
  if(COLS!==120)setWorld(120);
  if(back)return;
  if(which!==undefined&&which>=0){const L=PD.custom[which];E.g=decodeCells(L.c,120);E.t=L.t.map(p=>p.slice());E.men=L.m|0||5;E.id=which;E.name=L.n}
  else{E.g=new Uint8Array(COLS*ROWS);E.t=[];E.men=5;E.id=-1;E.name=''}
  E.undo=[];E.redo=[];E.starters=false;starterPage=0;E.pointer=null;E.drag=null;E.mat=1;E.tool='mat';E.shape='pen';E.bk=0;E.bs=0;E.bt=1}

// Editor-only snapshots are capped at 24 states (~175 KiB of grid data).
// They never enter the console core, the save payload or the frame loop.
function eState(){return [E.g.slice(),E.t.map(p=>p.slice()),E.id,E.name,E.men]}
function eRestore(s){E.g=s[0];E.t=s[1];E.id=s[2];E.name=s[3];E.men=s[4];E.drag=null;E.pointer=null}
function eSnap(){E.undo.push(eState());if(E.undo.length>24)E.undo.shift();E.redo.length=0}
function eUndo(){const s=E.undo.pop();if(!s)return;E.redo.push(eState());eRestore(s)}
function eRedo(){const s=E.redo.pop();if(!s)return;E.undo.push(eState());eRestore(s)}
// Character-count edits are world edits: make them reversible on desktop and touch.
function eAdjustMen(delta){
  const next=Math.max(1,Math.min(12,E.men+delta));
  if(next===E.men)return false; // No phantom undo state at the limits.
  eSnap();E.men=next;return true;
}

function eCell(px,py){return[Math.floor(px/V),Math.floor(py/V)]}
// Preserve the tiny target list: large rectangle brushes can paint thousands
// of cells, and must not allocate a fresh array at every painted cell.
function eClearLord(x,y){
  for(let i=E.t.length-1;i>=0;i--){
    const p=E.t[i];
    if(p[0]===x&&p[1]-1===y)E.t.splice(i,1);
  }
}
// brushes: SQUARE n x n, WIDE n x thickness (long beams), TALL thickness x n (columns), ROUND radius n (discs)
const BR_KIND=['SQUARE','WIDE','TALL','ROUND'];
const BR_SIZE=[[1,2,3,4,6,8,12],[4,6,10,16,24,32,48],[4,6,10,16,24,36],[1,2,3,5,8,12,16]];
function brushDims(){const k=E.bk,n=BR_SIZE[k][E.bs];
  if(k===0)return{w:n,h:n,r:0};if(k===1)return{w:n,h:E.bt,r:0};if(k===2)return{w:E.bt,h:n,r:0};return{w:2*n+1,h:2*n+1,r:n}}
function brushLabel(){const B=brushDims();return E.bk===3?'R'+B.r:B.w+'x'+B.h}
function brushHas(i,j,B){if(!B.r)return true;const dx=i-B.r,dy=j-B.r;return dx*dx+dy*dy<=B.r*B.r+B.r*.5}
function eKind(d){E.bk=(E.bk+d+4)%4;E.bs=Math.min(E.bs,BR_SIZE[E.bk].length-1)}
function eSize(d){const n=BR_SIZE[E.bk].length;E.bs=(E.bs+d+n)%n}
function eThick(){if(E.bk===1||E.bk===2)E.bt=E.bt%4+1}
function ePut(cx,cy,m){const B=brushDims(),ox=cx-((B.w-1)>>1),oy=cy-((B.h-1)>>1);
  for(let j=0;j<B.h;j++)for(let i=0;i<B.w;i++){if(!brushHas(i,j,B))continue;const x=ox+i,y=oy+j;if(x<EMIN||x>=COLS||y<0||y>=ROWS)continue;E.g[idx(x,y)]=m;eClearLord(x,y)}}
function eLine(a,b,m){const n=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));for(let t=1;t<=n;t++)ePut(Math.round(a[0]+(b[0]-a[0])*t/n),Math.round(a[1]+(b[1]-a[1])*t/n),m)}   // no gaps when you drag fast
function eRect(a,b,m){const x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(x<EMIN||x>=COLS||y<0||y>=ROWS)continue;E.g[idx(x,y)]=m;eClearLord(x,y)}}
function eDown(x,y){
  // Invalid taps are not edits: do not consume undo or touch ownership.
  if(!Number.isFinite(x)||!Number.isFinite(y)||y<0||y>=GY||
     x<EMIN*V||x>=COLS*V)return;
  const c=eCell(x,y);
  if(c[1]<0||c[1]>=ROWS||c[0]<EMIN||c[0]>=COLS)return;
  if(E.tool==='lord'){
    const k=E.t.findIndex(p=>Math.abs(p[0]-c[0])<=1&&Math.abs(p[1]-1-c[1])<=1);
    if(k>=0){eSnap();E.t.splice(k,1)}
    else if(E.t.length>=12)toast('ach','Max 12 landlords','');
    else if(!E.g[idx(c[0],c[1])]){eSnap();E.t.push([c[0],c[1]+1])}
    return;
  }
  const m=E.tool==='erase'?0:E.mat;
  // Rectangles are previews until release; cancellation cannot erase redo.
  if(E.shape==='rect'){E.drag={a:c,b:c,m};return}
  eSnap();E.drag={pen:true,m,l:c};ePut(c[0],c[1],m);
}
function eMove(x,y){if(!E.drag)return;const c=eCell(x,y);if(E.drag.pen){if(y<GY+3){const t=[c[0],Math.min(c[1],ROWS-1)];eLine(E.drag.l,t,E.drag.m);E.drag.l=t}}else E.drag.b=[c[0],Math.min(c[1],ROWS-1)]}
function eUp(){
  if(E.drag&&!E.drag.pen){eSnap();eRect(E.drag.a,E.drag.b,E.drag.m)}
  E.drag=null;
}
// Only the touch that began an editor stroke may move or finish it.
// Canceled/rotated strokes discard an unfinished rectangle.
function eBeginStroke(id){
  if(E.pointer!==null||!E.drag)return false;
  E.pointer=id;return true
}
function eStrokeOwner(id){return E.pointer!==null&&E.pointer===id&&!!E.drag}
function eEndStroke(id,cancel){
  if(E.pointer===null||E.pointer!==id)return false;
  if(cancel)E.drag=null;else eUp();
  E.pointer=null;return true
}
function eBuild(){const g=E.g.slice(),t=E.t.map(p=>p.slice());return{name:E.name||'Test Level',men:E.men,custom:true,build(){for(let i=0;i<g.length;i++)if(g[i])set(i%COLS,(i/COLS)|0,g[i]);for(const[cx,row]of t)tgt(cx,row)}}}
/* The same safe geometry rules apply to edited and shared levels. Never
 * launch a broken test scene or overwrite a good saved level with one. */
function eCheckedLevel(action){
  try{return validateSharedLevel({
    n:E.name||'My Level',m:E.men,c:encodeCells(E.g),t:E.t
  })}catch(err){toast('ach','Fix level before '+action,err.message||'Invalid layout');return null}
}
// Explicitly requested preflight only; never encode 7,200 cells per frame.
function eCheckBuild(){
  const level=eCheckedLevel('checking');
  if(!level)return false;

    level.t.length+' landlords • '+level.m+' shots — TEST PLAY to try it');

}
function eTest(){
  if(!eCheckedLevel('testing'))return;
  testing=true;load(-1,eBuild());
}
function eSave(){
  const checked=eCheckedLevel('saving');if(!checked)return;
  if(!E.name){let nm=null;try{nm=prompt('Name your level:','My Level '+(PD.custom.length+1))}catch(e){}E.name=(nm&&nm.trim()?nm.trim():'My Level '+(PD.custom.length+1)).slice(0,24)}
  const L={n:E.name,m:checked.m,c:checked.c,t:checked.t};
  const previousId=E.id,previousCreated=ST().created;
  const editing=E.id>=0&&E.id<PD.custom.length;
  const previousLevel=editing?PD.custom[E.id]:null;
  if(editing)PD.custom[E.id]=L;
  else{PD.custom.push(L);E.id=PD.custom.length-1;ST().created++}
  pdTouch();
  if(!pdSave()){
    if(editing)PD.custom[previousId]=previousLevel;
    else PD.custom.pop();
    E.id=previousId;ST().created=previousCreated;
    toast('ach','Level not saved','Storage is full or unavailable. Copy the backup code.');
    try{prompt('Storage unavailable. Copy this level backup code before leaving:',encodeSharedLevel(L))}catch(e){}
    return;
  }
  achCheck();toast('outfit','Saved: '+E.name,'find it under PLAY > MY LEVELS')}
const MATCOL=['#444',...MAT.slice(1).map(m=>m.c)];
function drawBrushPanel(){

  for(let t=1;t<=4;t++)btn(8+(t-1)*52,292,48,42,''+t,()=>{if(th)E.bt=t},{size:15,on:th&&E.bt===t,disabled:!th});
  btn(8,344,100,44,E.shape==='pen'?'PEN':'RECT',()=>{E.shape=E.shape==='pen'?'rect':'pen'},{size:15});
  btn(116,344,100,44,'UNDO',eUndo,{size:15});
  btn(8,392,100,40,'ERASE',()=>{E.tool='erase'},{size:14,on:E.tool==='erase'});
  btn(116,392,100,40,'LANDLORD',()=>{E.tool='lord'},{size:13,on:E.tool==='lord',col:'#ff8a8a'})}
function drawEditor(){
  ctx.setTransform(1,0,0,1,0,0);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const m=E.g[idx(x,y)];if(m)ctx.drawImage(SPR[m][hsh(x,y)&3][0],x*V,y*V,V,V)}
  ctx.fillStyle='rgba(255,60,60,.14)';ctx.fillRect(0,0,EMIN*V,GY);ctx.strokeStyle='rgba(255,90,90,.7)';ctx.setLineDash([6,5]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(EMIN*V,0);ctx.lineTo(EMIN*V,GY);ctx.stroke();ctx.setLineDash([]);
  txt('SLING AREA',EMIN*V/2,34,14,'#ffb0b0','center');drawBrushPanel();
  if(innerHeight>innerWidth*1.1)txt('turn your phone sideways to build',W/2+110,24,18,'#fff','center');
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.beginPath();for(let x=EMIN;x<=COLS;x+=5){ctx.moveTo(x*V,0);ctx.lineTo(x*V,GY)}for(let y=0;y<=ROWS;y+=5){ctx.moveTo(EMIN*V,y*V);ctx.lineTo(W,y*V)}ctx.stroke();
  E.t.forEach((p,i)=>{ctx.save();ctx.translate(p[0]*V+V/2,p[1]*V-7);drawLandlord({t:time+i,x:0,y:0});ctx.restore()});
  if(E.drag&&!E.drag.pen){const a=E.drag.a,b=E.drag.b;ctx.fillStyle=E.drag.m?MATCOL[E.drag.m]:'rgba(255,255,255,.4)';ctx.globalAlpha=.55;ctx.fillRect(Math.min(a[0],b[0])*V,Math.min(a[1],b[1])*V,(Math.abs(a[0]-b[0])+1)*V,(Math.abs(a[1]-b[1])+1)*V);ctx.globalAlpha=1}
  else if(mouseY<GY&&mouseX>EMIN*V){const c=eCell(mouseX,mouseY);ctx.strokeStyle='#fff';ctx.lineWidth=2;if(E.tool==='lord')ctx.strokeRect((c[0]-0)*V,(c[1]-0)*V,2*V,2*V);
    else{const B=brushDims(),ox=c[0]-((B.w-1)>>1),oy=c[1]-((B.h-1)>>1);
      if(B.r){ctx.beginPath();ctx.arc(c[0]*V+V/2,c[1]*V+V/2,(B.r+.5)*V,0,7);ctx.stroke()}else ctx.strokeRect(ox*V,oy*V,B.w*V,B.h*V);
      ctx.fillStyle='rgba(255,255,255,.12)';for(let j=0;j<B.h;j++)for(let i=0;i<B.w;i++)if(brushHas(i,j,B))ctx.fillRect((ox+i)*V,(oy+j)*V,V,V)}}
  ctx.fillStyle='rgba(12,14,26,.94)';ctx.fillRect(0,GY+3,W,H-GY-3);
  let x=8;const y1=GY+8;
  for(let m=0;m<=8;m++){const on=(E.tool==='erase'&&m===0)||(E.tool==='mat'&&E.mat===m&&m>0);
    btn(x,y1,50,24,m?MAT[m].n.toUpperCase():'ERASE',()=>{if(m===0)E.tool='erase';else{E.tool='mat';E.mat=m}},{size:10,on,swatch:m?MATCOL[m]:null});x+=52}
  btn(x+4,y1,100,24,'LANDLORD',()=>{E.tool='lord'},{size:12,on:E.tool==='lord',col:'#ff8a8a'});x+=112;
  btn(x,y1,56,24,E.shape==='pen'?'PEN':'RECT',()=>{E.shape=E.shape==='pen'?'rect':'pen'},{size:12});x+=62;
  const y2=y1+28;x=8;
  btn(x,y2,26,24,'-',()=>eAdjustMen(-1),{size:16});txt('MEN '+E.men,x+62,y2+17,14,'#fff','center');btn(x+98,y2,26,24,'+',()=>eAdjustMen(1),{size:16});x+=134;
  btn(x,y2,64,24,'UNDO',eUndo,{size:12});x+=70;
  btn(x,y2,64,24,'REDO',eRedo,{size:12});x+=70;
  btn(x,y2,64,24,'CLEAR',()=>{eSnap();E.g=new Uint8Array(COLS*ROWS);E.t=[]},{size:12});x+=70;
  btn(x,y2,90,24,'TEST PLAY',eTest,{size:13,on:true,col:'#7dff5a'});x+=96;
  btn(x,y2,64,24,'SAVE',eSave,{size:13,on:true});x+=70;
  btn(x,y2,70,24,'SHARE',()=>{if(!E.t.length){toast('ach','Add a landlord first','');return}exportCode({n:E.name||'My Level',m:E.men,c:encodeCells(E.g),t:E.t})},{size:12});x+=76;
  btn(x,y2,56,24,'EXIT',()=>{selTab=1;goSelect()},{size:12});x+=62;
  btn(x,y2,106,24,'STARTER BUILDS',()=>{E.starters=!E.starters},{size:12,on:E.starters});
  btn(x+112,y2,90,24,'CHECK BUILD',eCheckBuild,{size:11});
  txt(E.name?E.name:'unsaved level',W-8,y1+17,13,'#99a','right');
  if(E.starters){hits=[];drawStarterMenu(W-428,66,416)}}

// ---------- level finished: stars, achievements ----------
function onWin(){
  const st=men>=2?3:men>=1?2:1,sc=Math.round(score);
  if(CL&&CL.custom){if(testing||true)ST().customWins++}
  else{const hadValve=valveOpen(),hadArt=artUnlocked();PD.stars[level]=Math.max(PD.stars[level]||0,st);PD.best[level]=Math.max(PD.best[level]||0,sc);ST().wins++;
    if(!hadValve&&valveOpen())toast('ach','Air valve unlocked!','select AIR VALVE from the toolbar');
    if(!hadArt&&artUnlocked())toast('ach','GOLDEN CELS UNLOCKED','Options > Gameplay > Art Style')}
  const used=lv.shots;if(used<=1)ST().oneShots++;
  ST().bestScore=Math.max(ST().bestScore,sc);
  achCheck();pdSave()}
function onShot(){lv.shots++;ST().shots++;pdTouch()}
function onBoom(){lv.booms++;ST().booms++;ST().maxChain=Math.max(ST().maxChain,lv.booms);pdTouch()}
function onCell(){ST().cells++}
function onLandlord(){lv.kills++;ST().kills++;if(man&&man.mode==='fly'&&man.dive){lv.flops++;ST().flops++}pdTouch();achCheck()}
setInterval(()=>{if(pdDirty)pdSave();if(state==='play'||state==='win')achCheck()},4000);

buildSprites();buildBG();
// Same measured definitions as the console HUDs: submitted images per real
// second vs physics update calls per real second. F3 turns the overlay on.
let frameMeterVisible=!!OPT().showPerf,frameMeterClock=0,frameMeterDraws=0,frameMeterSims=0,frameMeterGameTime=0;
let frameMeterFps=0,frameMeterSps=0,frameMeterSpeed=0;
addEventListener('keydown',e=>{
  if(e.code==='F3'&&!e.repeat){frameMeterVisible=!frameMeterVisible;OPT().showPerf=frameMeterVisible;pdTouch();pdSave();e.preventDefault()}
  if(e.code==='F4'&&!e.repeat){cycleWebFX(OPT());pdTouch();pdSave();e.preventDefault()}
});
function drawFrameMeter(){
  ctx.save();ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.fillStyle='rgba(8,12,27,.9)';ctx.fillRect(8,8,277,48);
  ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.fillStyle='#ffdc81';
  ctx.fillText('RENDER '+frameMeterFps+' FPS   SIM '+frameMeterSps+' SPS',16,27);
  ctx.fillStyle='#eee';
  ctx.fillText('GAME TIME '+frameMeterSpeed+'%  FX '+webFXLabel(OPT())+' [F4]',16,46);
  ctx.restore();
}
/* Physics and game logic must not run once per monitor refresh: at 120/144 Hz
 * that also doubles frame-triggered gameplay effects, while a 30 Hz screen
 * halves them. Step at a fixed 60 Hz; render at the display's own cadence.
 * Cap catch-up at four steps so a background-tab pause or a slow Android
 * frame never creates an unbounded update burst. No extra canvas/buffers. */
const WEB_SIM_DT=1/60, WEB_SIM_MAX_STEPS=4;
let webSimCarry=0;
function webSimSteps(elapsed){
  webSimCarry=Math.min(WEB_SIM_DT*WEB_SIM_MAX_STEPS,webSimCarry+elapsed);
  const steps=Math.min(WEB_SIM_MAX_STEPS,Math.floor((webSimCarry+1e-10)/WEB_SIM_DT));
  webSimCarry=Math.max(0,webSimCarry-steps*WEB_SIM_DT);
  return steps;
}
let last=performance.now(),frameDt=.016,webLastDraw=-Infinity,webNextDraw=-Infinity,webDrawCap=0,webDrawState='',webDrawMode='',webDrawW=0,webDrawH=0;
function webNextPaint(t,cap,next,force){const period=1000/cap;return force?t+period:Math.max(t-period,next)+period}
document.addEventListener('visibilitychange',()=>{
  last=performance.now();webLastDraw=webNextDraw=-Infinity;webSimCarry=0;webPerfBad=webPerfGood=0;
  if(document.hidden)musUpdate();
});
function loop(t){
  const raw=Math.min(.5,Math.max(0,(t-last)/1000));
  last=t;
  if(document.hidden){webSimCarry=0;requestAnimationFrame(loop);return}
  const ticks=webSimSteps(raw);
  let sim=0,painted=false,started=performance.now();
  try{
    webFxCap=webFxBudget(OPT());webDetailedLighting=state!=='play'||webLightingDetail(OPT()); // resolve preferences once, not for every particle
    layoutTick();
    for(let i=0;i<ticks;i++){
      const playing=state==='play';
      update(WEB_SIM_DT);
      if(playing)sim++;
    }
    camTick(Math.min(.067,raw));musUpdate();
    const mode=(man&&man.mode||''),cap=state==='play'?webRenderCap(OPT()):60;
    const force=state!==webDrawState||mode!==webDrawMode||cv.width!==webDrawW||cv.height!==webDrawH||cap!==webDrawCap;
    if(force||t+1>=webNextDraw){
      frameDt=Math.min(.067,Math.max(0,(t-webLastDraw)/1000));
      draw();if(frameMeterVisible&&state==='play')drawFrameMeter();painted=true;webLastDraw=t;
      webNextDraw=webNextPaint(t,cap,webNextDraw,force);webDrawCap=cap;
      webDrawState=state;webDrawMode=mode;webDrawW=cv.width;webDrawH=cv.height;
    }
    webPerfSample(OPT(),raw,performance.now()-started,state==='play');
  }catch(e){console.error(e)}
  frameMeterClock+=raw;frameMeterDraws+=painted?1:0;frameMeterSims+=sim;frameMeterGameTime+=sim*WEB_SIM_DT;
  if(frameMeterClock>=2){
    frameMeterFps=Math.round(frameMeterDraws/frameMeterClock);
    frameMeterSps=Math.round(frameMeterSims/frameMeterClock);
    frameMeterSpeed=Math.round(100*frameMeterGameTime/frameMeterClock);
    frameMeterClock=0;frameMeterDraws=0;frameMeterSims=0;frameMeterGameTime=0;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
